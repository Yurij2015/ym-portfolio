content: |
  DigiPulse перевіряє, чи доступні сайти та коли закінчуються їхні SSL-сертифікати. Користувач додає монітори й контакти, налаштовує правила сповіщень та отримує повідомлення про збої в Telegram або email. Перевірки виконуються кожні 60 секунд, а зміни статусу відображаються на панелі без ручного оновлення.

  ## Моя робота в проєкті

  Це мій продукт, у якому я розробляю Laravel-бекенд, панель Filament та окремий сервіс перевірок на Go. Також працюю над MCP-сервером для доступу AI-асистентів до даних моніторингу й налаштовую розгортання та інфраструктуру.

  ## Ключові можливості

  - **Окремий сервіс перевірок** — Go-сервіс виконує запити до сайтів кожні 60 секунд, а Laravel керує моніторами, контактами й сповіщеннями
  - **Дашборд у реальному часі** - Reverb websockets передають зміни статусу в UI наживо, без ручного оновлення
  - **Octane + Filament** - резидентний у пам'яті Laravel із повною адмін-панеллю для моніторів, контактів і правил сповіщень
  - **MCP-сервер** - монітори та інциденти доступні для AI-асистентів (Claude, Cursor) через Model Context Protocol
  - **Google OAuth + Turnstile** - вхід без пароля та захист від ботів на публічних формах
  - **Self-hosted** - розгорнуто в середовищі Proxmox, де я адмініструю віртуальні машини й сервіси

  ## Стек технологій

  - **Бекенд**: Laravel (Octane, Reverb websockets)
  - **Адмін-панель**: Filament
  - **Движок моніторингу**: Go (окремий сервіс)
  - **База даних**: PostgreSQL
  - **Інтеграція AI**: MCP-сервер
  - **Інфраструктура**: Self-hosted на Proxmox
