content: |
  SaaS для моніторингу доступності — перевірки кожні 60 секунд, відстеження закінчення SSL, сповіщення через Telegram та email. Адмін панель та основний бекенд побудовані з Laravel (Octane, Reverb websockets) та Filament, а моніторинг-движок — окремий Go сервіс. Інтеграція Google OAuth sign-in та Cloudflare Turnstile. Включає MCP сервер, який надає дані моніторингу безпосередньо до AI асистентів. Self-hosted на Proxmox.

  ## Ключові можливості

  - **Окремий Go-движок** - перевірки доступності виконує окремий Go-сервіс, тож постійний поллінг кожні 60 секунд не гальмує Laravel-застосунок
  - **Дашборд у реальному часі** - Reverb websockets передають зміни статусу в UI наживо, без ручного оновлення
  - **Octane + Filament** - резидентний у пам'яті Laravel із повною адмін-панеллю для моніторів, контактів і правил сповіщень
  - **MCP-сервер** - монітори та інциденти доступні для AI-асистентів (Claude, Cursor) через Model Context Protocol
  - **Google OAuth + Turnstile** - вхід без пароля та захист від ботів на публічних формах
  - **Self-hosted** - розгорнуто на власному Proxmox-хомлабі, який я адмініструю повністю

  ## Стек технологій

  - **Бекенд**: Laravel (Octane, Reverb websockets)
  - **Адмін-панель**: Filament
  - **Движок моніторингу**: Go (окремий сервіс)
  - **База даних**: PostgreSQL
  - **Інтеграція AI**: MCP-сервер
  - **Інфраструктура**: Self-hosted на Proxmox
