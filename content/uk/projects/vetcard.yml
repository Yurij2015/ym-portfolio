content: |
  Публічна частина VetSpace — мультитенантний каталог ветеринарних клінік. Один Nuxt SSR-деплой обслуговує всі клініки: SEO-сторінки клінік, онлайн-запис на прийом з проксуванням до tenant-бекенду кожної клініки, темізація під бренд клініки та підтримка філій.

  ## Ключові особливості

  - **Один деплой — багато клінік** — застосунок маршрутизує за slug клініки; запити на запис і слоти проксуються до власного tenant-бекенду кожної клініки
  - **SEO-first каталог** — 590+ клінік з SSR-сторінками, структурованими даними та локалізованими маршрутами
  - **Брендинг кожної клініки** — сторінка клініки темізується її кольором, з бейджем "Powered by VetSpace"
  - **Реальний UX запису** — вільні слоти показують кількість вільних лікарів із кольоровим кодуванням дефіциту
  - **Повна локалізація** — українська, англійська та польська з prefix-маршрутизацією

  ## Технології

  - **Фронтенд**: Nuxt 4 / Vue 3, Tailwind CSS v4
  - **Бекенд**: Laravel catalog API + tenant-ендпоінти для запису
  - **Рендеринг**: SSR для SEO-сторінок, CSR для флоу запису
  - **Тестування**: Vitest юніт-тести + Cypress E2E проти реального бекенду
