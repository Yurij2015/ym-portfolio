content: |
  Код за digispace.pro — публічний сайт агенції, адмін панель та кастомний CMS, збудований з Laravel, Inertia та Vue. Відкритий код: той самий production код, який працює на живому сайті.

  ## Key Features

  - **Public agency site** - Публічний сайт агенції
  - **Admin panel** - Адмін панель
  - **Custom CMS** - Кастомний CMS
  - **Open source** - Відкритий код
  - **Production-ready** - Production-ready код
  - **Modern stack** - Сучасний стек

  ## Tech Stack

  - **Backend**: Laravel
  - **Frontend**: Vue.js
  - **Connection**: Inertia.js
  - **Build tool**: Vite
  - **Architecture**: Custom CMS
