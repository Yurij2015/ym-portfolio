content: |
  Production-сайт digispace.pro — публічний сайт агенції, адмін-панель та кастомна CMS в одному застосунку Laravel, тепер повністю мультимовний (EN/UK/PL), з Filament-панеллю поруч зі старою адмінкою на Inertia + Vue. Той самий код, що працює на живому сайті, доступний на GitHub.

  ## Ключові можливості

  - **Адмін-панель на Filament** - паралельна панель `/control` (24 ресурси) з TipTap-редактором, заливкою зображень напряму в MinIO та контент-орієнтованою навігацією, впроваджена ресурс за ресурсом поруч з існуючою Inertia-адмінкою
  - **Мультимовність за задумом** - перекладаються не лише сторінки, а й структурні UI-рядки (меню, футер, кнопки) для кожної локалі, з hreflang-маршрутизацією
  - **SEO з коробки** - структуровані дані JSON-LD, локалізовані sitemap та коректна обробка 404 для кожної локалі
  - **Моноліт як треба** - публічний сайт і обидві адмінки в одному застосунку Laravel, без окремого API
  - **Самостійний контент** - сторінки, послуги й кейси редагуються в CMS — без деплою заради зміни тексту чи перекладу
  - **Брама якості** - PHPUnit-тести та статичний аналіз PHPStan у CI
  - **Відкритий код** - саме той код, що обслуговує digispace.pro, публічний на GitHub

  ## Стек технологій

  - **Бекенд**: Laravel
  - **Адмінка**: Filament 5 (`/control`) + стара адмінка на Inertia.js + Vue
  - **Фронтенд**: Vue.js, Vite
  - **Локалізація**: переклади контенту й структури EN/UK/PL
  - **Архітектура**: Кастомна CMS
