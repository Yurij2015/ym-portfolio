Двостороння ветеринарна платформа — SEO-каталог клінік та CRM для підписки з призначеннями та записами пацієнтів. Публічний каталог клінік, побудований для SEO-first набуття клієнтів, та підписка на основі CRM (призначення, візити, записи пацієнтів) як окремі Vue/Nuxt додатки над одним Laravel API. Архітектура database-per-tenant, підписки Stripe через Cashier, GraphQL + REST, та аналіз візитів з допомогою AI через присвячений Go мікросервіс.

## Key Features

- **SEO clinic catalog** - SEO-каталог клінік
- **CRM system** - CRM система для ветеринарів
- **Appointment scheduling** - Призначення візитів
- **Patient records** - Записи пацієнтів
- **Stripe subscriptions** - Підписки через Stripe
- **Multi-tenant** - Database-per-tenant архітектура
- **AI analysis** - AI аналіз візитів
- **Go microservice** - Go мікросервіс для AI

## Tech Stack

- **Backend**: Laravel (API)
- **Frontend**: Vue/Nuxt (окремі додатки)
- **Architecture**: Database-per-tenant multi-tenancy
- **Payments**: Stripe через Cashier
- **API**: GraphQL + REST
- **AI**: Go мікросервіс для аналізу візитів