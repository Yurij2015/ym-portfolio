content: |
  Двостороння ветеринарна платформа — SEO-каталог клінік та CRM для підписки з призначеннями та записами пацієнтів. Публічний каталог клінік, побудований для SEO-first набуття клієнтів, та підписка на основі CRM (призначення, візити, записи пацієнтів) як окремі Vue/Nuxt додатки над одним Laravel API. Архітектура database-per-tenant, підписки Stripe через Cashier, GraphQL + REST, та аналіз візитів з допомогою AI через присвячений Go мікросервіс.

  ## Ключові можливості

  - **Двостороння воронка** - SEO-каталог залучає клініки, а CRM за підпискою (візити, картки пацієнтів) їх утримує
  - **Справжня ізоляція тенантів** - database-per-tenant тримає дані кожної клініки окремо, а GDPR-експорт/видалення — це операція на рівні бази
  - **Дві грані API** - GraphQL для складних запитів каталогу, REST для CRM — одна кодова база Laravel
  - **Білінг із коробки** - підписки Stripe через Cashier: тріали, зміна планів, dunning
  - **AI там, де допомагає** - аналіз візитів виконує окремий Go-мікросервіс, не навантажуючи основний API

  ## Стек технологій

  - **Бекенд**: Laravel (API)
  - **Фронтенд**: Vue/Nuxt (окремі застосунки)
  - **Архітектура**: Database-per-tenant multi-tenancy
  - **Платежі**: Stripe через Cashier
  - **API**: GraphQL + REST
  - **AI**: Go-мікросервіс для аналізу візитів
