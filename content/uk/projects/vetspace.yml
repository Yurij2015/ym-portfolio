content: |
  VetSpace поєднує публічний каталог ветеринарних клінік і CRM за підпискою для запису на прийом, візитів та карток пацієнтів. Каталог і CRM працюють як окремі Vue/Nuxt-застосунки зі спільним Laravel API. Кожна клініка має власну базу даних, підписки обробляються через Stripe і Cashier, а для аналізу візитів за допомогою AI використовується окремий Go-сервіс.

  ## Ключові можливості

  - **Каталог і CRM** — публічні сторінки клінік та окремий робочий інтерфейс для візитів і карток пацієнтів
  - **Окремі бази даних** — дані кожної клініки зберігаються у власній базі
  - **GraphQL і REST** - GraphQL для складних запитів каталогу, REST для CRM — одна кодова база Laravel
  - **Підписки Stripe** - підписки Stripe через Cashier: тріали, зміна планів, dunning
  - **Аналіз візитів** — AI-обробка виконується в окремому Go-сервісі

  ## Стек технологій

  - **Бекенд**: Laravel (API)
  - **Фронтенд**: Vue/Nuxt (окремі застосунки)
  - **Архітектура**: Database-per-tenant multi-tenancy
  - **Платежі**: Stripe через Cashier
  - **API**: GraphQL + REST
  - **AI**: Go-мікросервіс для аналізу візитів
