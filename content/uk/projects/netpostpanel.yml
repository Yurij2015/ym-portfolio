content: |
  AI платформа для контенту з мультипровайдерною генерацією (Gemini/OpenAI за драйвер абстракції), семантичним пошуком на Qdrant, RSS/новинним агрегаційним движком з авто-відкриттям та збором контенту, та Langfuse tracing для LLM обсервабельності.

  ## Ключові можливості

  - **AI без прив'язки до провайдера** - Gemini та OpenAI за драйвер-абстракцією, тож зміна моделі — це конфіг, а не рефакторинг
  - **Семантичний пайплайн** - векторний пошук на Qdrant дедублікує й кластеризує новини ще до генерації
  - **Автономна агрегація** - авто-виявлення RSS-стрічок плюс скрапінг перетворюють тему на самопоповнюване джерело контенту
  - **Прозорі LLM-виклики** - кожна генерація трасується в Langfuse: токени, затримка, вартість
  - **На чергах** - Laravel Horizon виконує задачі генерації та скрапінгу з ретраями й контролем навантаження

  ## Стек технологій

  - **Бекенд**: Laravel
  - **AI**: Мультипровайдерно (Gemini/OpenAI)
  - **Векторна БД**: Qdrant для семантичного пошуку
  - **Обсервабельність**: Langfuse для LLM-трейсингу
  - **Черга**: Laravel Horizon
  - **Архітектура**: Патерн драйвер-абстракції
