content: |
  AI платформа для контенту з мультипровайдерною генерацією (Gemini/OpenAI за драйвер абстракції), семантичним пошуком на Qdrant, RSS/новинним агрегаційним движком з авто-відкриттям та збором контенту, та Langfuse tracing для LLM обсервабельності.

  ## Key Features

  - **Multi-provider AI** - Мультипровайдерна генерація (Gemini/OpenAI)
  - **Semantic search** - Семантичний пошук на Qdrant
  - **RSS aggregation** - RSS/новинний агрегаційний движок
  - **Content scraping** - Авто-відкриття та збір контенту
  - **LLM observability** - Langfuse tracing
  - **Job queues** - Horizon для обробки задач
  - **Driver abstraction** - Драйвер абстракція для AI провайдерів

  ## Tech Stack

  - **Backend**: Laravel
  - **AI**: Multi-provider (Gemini/OpenAI)
  - **Vector DB**: Qdrant для семантичного пошуку
  - **Observability**: Langfuse для LLM tracing
  - **Queue**: Laravel Horizon
  - **Architecture**: Driver abstraction pattern
