content: |
  Внутрішня AI-платформа для контент-операцій, яка перетворює дослідження теми на готовий контент: повний RAG-пайплайн (Google Custom Search + RSS → скрапінг → мультипровайдерна генерація → векторизація), плюс версіонований зовнішній API, що живить контент-процеси інших проєктів, зокрема блог-пайплайн DigiSpace.

  ## Ключові можливості

  - **Зовнішній API** - версіонований `POST /api/v1/generate` + `/translate` з ключами й лімітами на клієнта відкриває весь пайплайн для інших застосунків, синхронно або асинхронно з колбеками
  - **Auto Pilot** - щоденні заплановані запуски генерують контент з нових джерел натхнення чи власних тем без участі людини
  - **AI без прив'язки до провайдера** - Gemini та OpenAI за драйвер-абстракцією, тож зміна моделі — це конфіг, а не рефакторинг
  - **Семантичний пайплайн** - векторний пошук на Qdrant дедублікує й кластеризує новини ще до генерації
  - **Автономна агрегація** - авто-виявлення RSS-стрічок та Google Custom Search плюс скрапінг перетворюють тему на самопоповнюване джерело контенту
  - **Прозорі LLM-виклики** - кожна генерація трасується в Langfuse: токени, затримка, вартість
  - **Рольовий доступ** - ролі admin/content manager/editor, кожен запит обмежений власником, крім адміна

  ## Стек технологій

  - **Бекенд**: Laravel, агенти `laravel/ai`
  - **Фронтенд**: Inertia.js + Vue 3 (SPA Search & Creation, редактор TipTap)
  - **AI**: Мультипровайдерно (Gemini/OpenAI) за драйвер-абстракцією
  - **Дослідження**: Google Custom Search + RSS-агрегація, скрапінг сторінок
  - **Векторна БД**: Qdrant для семантичного пошуку
  - **Обсервабельність**: Langfuse для LLM-трейсингу
  - **Черга**: Laravel Horizon
  - **Тести**: PHPUnit/Pest + Cypress E2E
