faq:
  - label: Якщо немає доступу до сервера?
    content: Спершу треба знайти власника акаунта й дізнатися процедуру відновлення в провайдера. З технічною частиною допоможу, але результат залежить від прав і того, що збереглося.
  - label: Чи доведеться переписувати проєкт?
    content: Це стає зрозуміло після діагностики. Спочатку дивимося, які частини можна підтримувати і що треба змінити, щоб проєкт працював.
content: |-
  ## Спершу зрозуміти, що є

  Без інструкції запуску, з невідомими залежностями й неперевіреними резервними копіями навіть дрібна зміна стає ризикованою. Перший етап потрібен, щоб зібрати цю інформацію й визначити порядок дій; іноді він виявляє додаткові обмеження.

  Docker, автоматичне розгортання чи оновлення PHP можуть стати частиною рішення, але це залежить від стану проєкту. Скільки триватиме повне відновлення, за самим описом помилки сказати не можна.

  Розкажіть, що перестало працювати, і які код, доступи й резервні копії залишилися. Ціна від $1 800 охоплює діагностику й перші роботи зі стабілізації.
