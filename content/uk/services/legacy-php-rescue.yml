summary: "Допомагаю повернути PHP-проєкт у стан, коли його можна запускати й змінювати. Збираю відомості про код та інфраструктуру, перевіряю резервні копії, відтворюю помилки й налагоджую розгортання. Починаю з того, що заважає зараз: зламаної функції, невдалого релізу чи відсутнього тестового середовища."
