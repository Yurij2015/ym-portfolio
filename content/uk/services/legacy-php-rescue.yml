faq:
  - label: Якщо немає доступу до сервера?
    content: Спершу треба знайти власника акаунта й дізнатися процедуру відновлення в провайдера. З технічною частиною допоможу, але результат залежить від прав і того, що збереглося.
  - label: Чи доведеться переписувати проєкт?
    content: Це стає зрозуміло після діагностики. Спочатку дивимося, які частини можна підтримувати і що треба змінити, щоб проєкт працював.
content: |-
  ## Спершу зрозуміти, що є

  Коли немає інструкції запуску, залежності невідомі, а резервні копії не перевірялися, важко оцінити навіть невелику зміну. Тому спочатку збираю відомості про код та інфраструктуру, з’ясовую, як запустити копію проєкту й чи можна відновити дані.

  Це дає основу для перших виправлень і подальшого плану. За результатами діагностики описую поточний стан, усуваю погоджені проблеми, що блокують роботу, та визначаю наступні кроки. Якщо потрібні додаткове налаштування середовища, відновлення даних чи зміна розгортання, готую для них окремий перелік робіт і оцінку.

  Почати можна з опису того, що перестало працювати, і матеріалів, які залишилися: коду, доступів, резервних копій чи повідомлень про помилки. Вони допоможуть визначити, з чого братися за відновлення. Вартість діагностики й погоджених перших робіт зі стабілізації починається від $1 800.
