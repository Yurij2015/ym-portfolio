faq:
  - label: Чи потрібен RAG?
    content: Якщо відповідь має спиратися на ваші документи, пошук потрібних фрагментів допомагає. Для класифікації чи витягу полів окрема база знань зазвичай не потрібна.
  - label: Що з конфіденційністю та вартістю?
    content: Перед запуском перевіряю, як провайдер обробляє й зберігає дані. Витрати рахую за обраною моделлю та кількістю запитів. Використання API оплачується окремо від моєї роботи.
content: |-
  ## Досвід NetPostPanel і DigiPulse

  У NetPostPanel я працюю з пошуком джерел, генерацією контенту та векторним пошуком у Qdrant. Ці операції виконуються через черги Horizon, а виклики моделей відстежуються в Langfuse. Інший спосіб взаємодії використовую в DigiPulse: там MCP-сервер дає AI-асистентам доступ до даних моніторингу.

  Вибір інтеграції починається з перевірки самої задачі: чи дає модель корисний результат на ваших даних і де саме вона помиляється. Якщо відповіді мають спиратися на документи, додаю пошук потрібних фрагментів; якщо їх оброблятиме код, визначаю структурований формат. Оскільки навіть із цими налаштуваннями помилки можливі, спосіб перевірки відповідей погоджуємо до запуску.

  Для такої перевірки потрібні кілька прикладів вхідних даних і бажаних відповідей. Разом з очікуваною кількістю запитів та обмеженнями щодо даних вони допоможуть оцінити інтеграцію. Вартість однієї AI-функції з підключенням до застосунку починається від $2 200.
