faq:
  - label: Чи потрібен RAG?
    content: Якщо відповідь має спиратися на ваші документи, пошук потрібних фрагментів допомагає. Для класифікації чи витягу полів окрема база знань зазвичай не потрібна.
  - label: Що з конфіденційністю та вартістю?
    content: Перед запуском перевіряю, як провайдер обробляє й зберігає дані. Витрати рахую за обраною моделлю та кількістю запитів. Використання API оплачується окремо від моєї роботи.
content: |-
  ## Досвід NetPostPanel і DigiPulse

  У NetPostPanel пошук джерел, генерація контенту й векторний пошук у Qdrant працюють через черги Horizon, а виклики моделей відстежуються в Langfuse. У DigiPulse MCP-сервер дає AI-асистентам доступ до даних моніторингу.

  Для нової задачі я спершу перевіряю, чи модель дає корисний результат на ваших даних. Пошук по документах і структурований формат відповіді допомагають, але помилок не виключають, тому спосіб перевірки відповідей визначаємо до запуску.

  Для оцінки надішліть кілька прикладів вхідних даних і бажаних відповідей, очікувану кількість запитів та обмеження щодо даних. Ціна від $2 200 покриває одну AI-функцію з інтеграцією в застосунок.
