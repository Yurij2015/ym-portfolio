faq:
  - label: Чи працюєте із самописним PHP?
    content: Так. Спочатку розбираюся в структурі коду, залежностях і запуску, після цього оцінюю доопрацювання.
  - label: Чи треба переходити на фреймворк?
    content: Не завжди. Про перехід є сенс говорити, якщо він помітно спростить подальшу роботу й окупить витрати.
  - label: "Чи можна звернутися з невеликою задачею?"
    content: "Так. Окреме виправлення чи доопрацювання можна обговорити в погодинному форматі від $35/год. Надішліть опис задачі: ставку й потрібний час обговоримо з урахуванням її складності та стану проєкту. Ціна від $1 800 стосується окремого блоку робіт, а не кожного звернення."
content: |-
  ## Зміни в робочій системі

  Навіть невелике доопрацювання може зачіпати кілька частин застосунку. Наприклад, нова інтеграція впливає на обмін даними, а зміна розрахунку змінює пов’язані звіти. Тому перед роботою з’ясовую ці зв’язки й визначаю, як перевірити результат у наявній системі.

  З такими зв’язками працюю, зокрема, у DigiSpace, де публічний сайт, контент і панелі керування розвиваються в одній кодовій базі на Laravel. Тут зміни в окремій функції потрібно узгоджувати з рештою логіки. Так само працюю і з клієнтськими застосунками.

  **Для оцінки опишіть задачу й укажіть версію PHP.** Якщо йдеться про помилку, додайте кроки відтворення та повідомлення з логів; для нової функції — приклад очікуваного результату. За цими матеріалами зможу визначити, що переглянути в коді, й оцінити роботу.

  Стартовий бюджет від $1 800 стосується погодженого доопрацювання, наприклад звіту або обміну даними, разом із перевірками та інструкцією розгортання. Якщо потрібне невелике виправлення, можемо обговорити погодинну роботу за ставкою від $35/год. Ставку й потрібний час обговоримо після знайомства із задачею та станом проєкту.
