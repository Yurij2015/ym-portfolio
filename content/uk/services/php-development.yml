faq:
  - label: Чи працюєте із самописним PHP?
    content: Так. Спочатку розбираюся в структурі коду, залежностях і запуску, після цього оцінюю доопрацювання.
  - label: Чи треба переходити на фреймворк?
    content: Не завжди. Про перехід є сенс говорити, якщо він помітно спростить подальшу роботу й окупить витрати.
content: |-
  ## Зміни в робочій системі

  Нова інтеграція, зміна розрахунку чи виправлення помилки часто зачіпають кілька частин застосунку. Тому перед роботою дивлюся пов’язані сценарії й вирішую, як перевірити результат. Переписувати систему для цього не потрібно.

  У DigiSpace я розвиваю Laravel-застосунок, де публічний сайт, контент і панелі керування живуть в одній кодовій базі. Цей досвід допомагає вносити зміни, не ламаючи наявну логіку.

  Надішліть задачу й версію PHP. Для помилки допоможуть кроки відтворення й повідомлення з логів, для нової функції приклад очікуваного результату. Від $1 800 коштує окремий блок розробки.
