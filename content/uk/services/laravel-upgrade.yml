faq:
  - label: Що робити, якщо немає тестів?
    content: Перед оновленням визначимо найважливіші сценарії й покриємо їх тестами. Ця робота входить в оцінку.
  - label: Чи можна обійтися без простою?
    content: Залежить від інфраструктури та змін у базі даних. Спосіб розгортання й, за потреби, вікно обслуговування визначаємо заздалегідь.
content: |-
  ## Від чого залежить обсяг

  Складність оновлення визначає стан застосунку: чи підтримуються його пакети, наскільки змінилася конфігурація та яку частину власного коду потрібно адаптувати. Самої різниці між поточною й цільовою версіями для оцінки недостатньо, тому спочатку переглядаю залежності й спосіб запуску.

  Наступне питання — як перевірити поведінку системи після змін. У власних Laravel-продуктах VetSpace і DigiPulse я працюю з підписками, чергами та інтеграціями, для яких успішний запуск застосунку є лише початком перевірки. Важливо також пройти самі операції та переконатися, що їхній результат залишився правильним.

  **Для оцінки оновлення надішліть composer.json, composer.lock і короткий опис запуску застосунку.** Перехід між визначеними версіями починається від $1 600; якщо потрібні заміна покинутих пакетів чи написання відсутніх тестів, враховую цю роботу в оцінці.
