faq:
  - label: Що робити, якщо немає тестів?
    content: Перед оновленням визначимо найважливіші сценарії й покриємо їх тестами. Ця робота входить в оцінку.
  - label: Чи можна обійтися без простою?
    content: Залежить від інфраструктури та змін у базі даних. Спосіб розгортання й, за потреби, вікно обслуговування визначаємо заздалегідь.
content: |-
  ## Від чого залежить обсяг

  Оновлення може вимагати заміни покинутого пакета, зміни конфігурації чи переписування частини власного коду. Тому кількість версій між поточною й цільовою мало що каже про обсяг роботи.

  У своїх Laravel-продуктах VetSpace і DigiPulse я працюю з підписками, чергами та інтеграціями. Після оновлення такі процеси треба перевіряти окремо: те, що застосунок запустився, ще не означає, що вони працюють.

  Для оцінки надішліть composer.json, composer.lock і опис того, як запускається застосунок. Від $1 600 коштує оновлення між визначеними версіями; заміна покинутих пакетів і написання відсутніх тестів збільшують обсяг.
