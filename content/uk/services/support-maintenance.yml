  - label: Чи працюєте з чужим кодом?
    content: Так. Спочатку роблю огляд проєкту. Якщо застосунок не запускається або доступи втрачено, починаємо зі стабілізації.
  - label: Чи є цілодобова аварійна підтримка?
    content: Чергування 24/7 у погодинну послугу не входить. Доступність і час реакції обговорюємо до початку співпраці.
content: |-
  ## Про що домовляємося на старті

  У робочому продукті виправлення, оновлення залежностей і невеликі доопрацювання часто потрібні одночасно. Щоб розподілити час між ними, спочатку переглядаю стан застосунку, а потім разом із вами визначаю пріоритети, бюджет і графік підтримки. Великі оновлення та нові модулі оцінюю окремо.

  До цього плану входить і порядок реагування на збої. Доступність сайту можна відстежувати через мій сервіс DigiPulse зі сповіщеннями в Telegram та email, а до початку роботи ми погоджуємо, хто отримує ці повідомлення та як діє далі.

  **Щоб обговорити підтримку продукту, розкажіть, хто займається ним зараз і які задачі накопичилися.** Це допоможе визначити частоту перевірок і порядок звернень. Робота оплачується погодинно, від $35. Остаточну ставку узгоджуємо до початку співпраці з урахуванням стану застосунку та потрібних робіт.
