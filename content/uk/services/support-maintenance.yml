  - label: Чи працюєте з чужим кодом?
    content: Так. Спочатку роблю огляд проєкту. Якщо застосунок не запускається або доступи втрачено, починаємо зі стабілізації.
  - label: Чи є цілодобова аварійна підтримка?
    content: Чергування 24/7 у погодинну послугу не входить. Доступність і час реакції обговорюємо до початку співпраці.
content: |-
  ## Про що домовляємося на старті

  Підтримка може включати виправлення, оновлення залежностей, перевірку резервних копій і невеликі зміни в продукті. Задачі різні, тому спочатку розставляємо пріоритети й визначаємо, скільки часу на них є. Великі оновлення й нові модулі оцінюю окремо.

  Доступність сайту можна відстежувати через мій сервіс DigiPulse, який надсилає сповіщення в Telegram та email. Моніторинг допомагає помітити збій, але не замінює домовленого порядку реагування.

  Розкажіть, хто зараз підтримує продукт і які задачі накопичуються. Ставка від $50 за годину; частоту перевірок і порядок звернень визначаємо перед початком.
