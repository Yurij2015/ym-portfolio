faq:
  - label: Може, просто потрібен потужніший сервер?
    content: Можливо. Але спершу варто з’ясувати, який ресурс обмежує роботу і чи можна зменшити навантаження змінами в застосунку.
  - label: Чи достатньо схеми бази даних?
    content: Вона показує структуру, але для аналізу швидкодії зазвичай потрібні ще плани запитів, статистика й реалістичні тестові дані.
content: |-
  ## Вимірюю конкретну операцію

  Повільний звіт і повільний запис на прийом можуть мати різні причини, тому спочатку потрібно відтворити саме ту затримку, яку помічають користувачі. Для цього вимірюю час відповіді, перевіряю обсяг даних і зовнішні залежності. Коли стає зрозуміло, де виникає затримка, можна обрати зміну й погодити показники для перевірки результату.

  Після виправлення повторюю ту саму операцію з порівнянним обсягом даних і зіставляю час виконання та використання ресурсів. Водночас перевіряю правильність відповіді, адже прискорений звіт має повертати ті самі дані.

  **Щоб оцінити задачу, покажіть сторінку чи операцію, на яку доводиться чекати, й опишіть, коли виникає затримка.** Якщо маєте логи або вимірювання, додайте їх. Діагностика й робота з однією конкретною причиною починаються від $1 200.
