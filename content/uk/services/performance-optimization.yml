title: Оптимізація швидкодії PHP-застосунків
description: "Пошук причин повільної роботи PHP, Laravel і Symfony-застосунків: вимірювання, виправлення й порівняння результату."
summary: "Допомагаю з повільними сторінками, API й фоновими задачами у PHP-застосунках. Починаю з операції, на яку найбільше скаржаться користувачі чи працівники, і з’ясовую, де витрачається час: у запитах до бази, обробці даних, зовнішніх викликах чи чергах. Після виправлення порівнюю результати вимірювань, щоб було видно, що саме змінилося."
