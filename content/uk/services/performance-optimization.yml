faq:
  - label: Може, просто потрібен потужніший сервер?
    content: Можливо. Але спершу варто з’ясувати, який ресурс обмежує роботу і чи можна зменшити навантаження змінами в застосунку.
  - label: Чи достатньо схеми бази даних?
    content: Вона показує структуру, але для аналізу швидкодії зазвичай потрібні ще плани запитів, статистика й реалістичні тестові дані.
content: |-
  ## Вимірюю конкретну операцію

  Повільний звіт і повільний запис на прийом можуть гальмувати з різних причин. Тому починаю з операції, яку можна відтворити: вимірюю час відповіді, обсяг даних і зовнішні залежності. Після цього можна обрати зміну й перевірити, що вона дала.

  У DigiPulse мережеві перевірки винесені з Laravel в окремий Go-сервіс. Це рішення під конкретну задачу, а не порада переписувати PHP на іншу мову.

  Надішліть повільну сторінку чи операцію, умови, за яких з’являється затримка, і логи, якщо є. Ціна від $1 200 покриває діагностику й роботу з однією конкретною причиною; наскільки вдасться прискорити, стане зрозуміло після вимірювань.
