faq:
  - label: Чи можна почати з короткого завдання?
    content: Так. Перша оплачувана задача допомагає зрозуміти, як нам працюється разом, і познайомитися з проєктом. Її обсяг і умови обговорюємо заздалегідь.
  - label: Який у вас часовий пояс?
    content: Працюю з Познані (CET). Робочі години й перетин із вашою командою обговорюємо на старті. Спілкуюся українською та англійською.
content: |-
  ## Над чим я працюю

  Працюю над квитковими магазинами на Symfony, MySQL, Redis і Vue.js з оплатами через Stripe і Dalenys. Серед власних продуктів розвиваю VetSpace, CRM для ветеринарних клінік з окремими базами клінік і підписками Stripe, а також DigiPulse на Laravel і Go та NetPostPanel із чергами й AI-інтеграціями.

  У команді беру окрему функцію або частину беклогу: розбираюся в пов’язаному коді, пропоную реалізацію, пишу тести й готую pull request. Роблю й рев’ю змін інших розробників. Якщо під час роботи з’являються питання чи залежності, які впливають на рішення, кажу про них одразу.

  Надішліть стек і дві-три задачі з беклогу, які хочете передати, так буде легше зрозуміти мою роль і потрібний час. Ставка від $50 за годину; кількість годин і дата старту залежать від моєї доступності.
