faq:
  - label: Чи можна почати з короткого завдання?
    content: Так. Перша оплачувана задача допомагає зрозуміти, як нам працюється разом, і познайомитися з проєктом. Її обсяг і умови обговорюємо заздалегідь.
  - label: Який у вас часовий пояс?
    content: Працюю з Познані (CET). Робочі години й перетин із вашою командою обговорюємо на старті. Спілкуюся українською та англійською.
content: |-
  ## Над чим я працюю

  Працюю над квитковими магазинами на Symfony з MySQL, Redis, інтерфейсом на Vue.js та оплатами через Stripe і Dalenys. Паралельно розвиваю власні продукти: VetSpace — CRM для ветеринарних клінік з окремими базами даних і підписками Stripe, DigiPulse на Laravel і Go та NetPostPanel із чергами й AI-інтеграціями.

  Цей досвід використовую і в командній роботі, коли беру окрему функцію або частину беклогу. Спочатку розбираюся в пов’язаному коді та пропоную реалізацію, а потім готую зміни з тестами й передаю їх на рев’ю через pull request. Також переглядаю код колег і одразу повідомляю про питання чи залежності, які впливають на рішення.

  Для знайомства з вашою задачею надішліть стек і дві-три позиції з беклогу, які хочете передати. На їхньому прикладі зможемо визначити мою роль і потрібний обсяг часу. Ставка починається від $35 за годину, а кількість годин і дату старту погоджуємо з урахуванням моєї доступності. Остаточну ставку обговорюємо з урахуванням задач і тривалості співпраці.
