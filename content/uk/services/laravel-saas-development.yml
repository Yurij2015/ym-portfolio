faq:
  - label: Чи потрібна окрема база для кожного клієнта?
    content: Залежить від вимог до даних, резервного копіювання та інфраструктури. Порівняємо окремі бази зі спільною базою, де доступ розмежований у коді.
  - label: Що входить у стартову ціну?
    content: Перший етап розробки. Ролі, інтеграції й функції визначаємо до оцінки, тому ціна не означає MVP будь-якого розміру.
content: |-
  ## Досвід VetSpace

  У VetSpace кожна клініка має власну базу даних, а підписки працюють через Stripe і Cashier. Для нового продукту спосіб ізоляції обираю після розбору вимог: така архітектура потрібна не кожному SaaS.

  Підпискам потрібні чіткі правила: коли відкривається доступ, що відбувається після невдалої оплати, як змінюється тариф. Ці питання розбираємо разом із функціями першої версії.

  У клієнтському маркетплейсі від придбаного пакета залежало, скільки активних оголошень і чернеток може мати користувач.

  Опишіть користувачів продукту, їхню головну задачу та спосіб оплати. Ціна від $4 800 розрахована на першу версію з обмеженим набором функцій; білінг, імпорт даних і зовнішні інтеграції впливають на оцінку.
