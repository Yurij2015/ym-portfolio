faq:
  - label: Чи потрібна окрема база для кожного клієнта?
    content: Залежить від вимог до даних, резервного копіювання та інфраструктури. Порівняємо окремі бази зі спільною базою, де доступ розмежований у коді.
  - label: Що входить у стартову ціну?
    content: Перший погоджений етап розробки SaaS. До оцінки визначаємо, які облікові записи, ролі, функції та сценарії підписки він охоплює, і який робочий результат ви отримаєте наприкінці етапу.
content: |-
  ## Досвід VetSpace

  У VetSpace кожна клініка має власну базу даних, а підписки працюють через Stripe і Cashier. Для цього продукту дані розділені саме так; у новому SaaS спосіб ізоляції обираю з урахуванням вимог до доступу, резервного копіювання та інфраструктури.

  Разом із доступом до даних потрібно продумати й правила підписки: коли користувач отримує доступ, як змінює тариф і що відбувається після невдалої оплати. Від цих правил залежать функції продукту. Наприклад, у клієнтському маркетплейсі придбаний пакет визначав кількість активних оголошень і чернеток, які міг мати користувач.

  **Щоб визначити перший етап, розкажіть, хто користуватиметься вашим SaaS, яку задачу він має вирішувати та як ви плануєте брати оплату.** Так ми погодимо обсяг роботи й очікуваний результат.

  Стартовий бюджет від $4 800 стосується першого погодженого етапу розробки. Функції, сценарії білінгу й інтеграції, які він охоплює, фіксуємо в оцінці до початку роботи.
