content: |-
  ## Квиткові магазини на Symfony

  Я працюю над мультитенантними квитковими магазинами, через які продають квитки на футбол, баскетбол, мото- й автоперегони, а також до музеїв, на виставки й фестивалі. Вони побудовані на Symfony з Doctrine, MySQL, Redis і чергах, з інтерфейсом на Vue.js та оплатами через Stripe і Dalenys.

  Для кожної інтеграції з’ясовую, як система має поводитися, коли відповідь затримується, повідомлення приходить повторно або постачальник недоступний. Ці випадки входять у тести.

  Опишіть процес, який треба додати чи змінити, і вкажіть версії Symfony та PHP. Ціна від $3 200 розрахована на окремий модуль із тестами; зовнішні інтеграції й залежності впливають на оцінку.
