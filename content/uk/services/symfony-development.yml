content: |-
  ## Квиткові магазини на Symfony

  Я працюю над мультитенантними магазинами, через які продають квитки на спортивні події, зокрема футбол, баскетбол, мото- й автоперегони, а також до музеїв, на виставки та фестивалі. Їхній бекенд побудований на Symfony з Doctrine, MySQL, Redis і чергами, інтерфейс — на Vue.js, а оплати проходять через Stripe і Dalenys.

  У цих проєктах я працюю з оформленням замовлень, оплатами та обміном даними із зовнішніми сервісами. Коли потрібно змінити один із цих процесів, спочатку розбираюся, як він реалізований і які частини застосунку зачіпає. Це допомагає спланувати доопрацювання та перевірити його разом із пов’язаною логікою.

  **Щоб оцінити вашу задачу, опишіть процес, який потрібно додати чи змінити, та вкажіть версії Symfony і PHP.** Це допоможе визначити пов’язані модулі й зовнішні залежності. Вартість окремого модуля з тестами починається від $3 200, а потрібні інтеграції враховую в загальній оцінці.
