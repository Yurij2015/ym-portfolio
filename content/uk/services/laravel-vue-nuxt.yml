faq:
  - label: Inertia чи окремий Nuxt?
    content: Inertia дає змогу писати інтерфейс на Vue всередині застосунку Laravel. Окремий Nuxt зручніший для публічної частини з серверним рендерингом. Вибір залежить від вимог.
  - label: Чи потрібен готовий дизайн?
    content: Можу працювати за макетом або на готовій бібліотеці компонентів. Розробку власного візуального стилю треба врахувати в обсязі робіт.
content: |-
  ## Приклад VetCard

  У VetCard публічні сторінки клінік працюють на Nuxt, а інформацію та дані для онлайн-запису отримують із Laravel API. Щоб користувач міг обрати час прийому й отримати підтвердження, інтерфейс і бекенд мають узгоджено обробити весь запис — від завантаження доступних даних до відповіді на надіслану форму.

  Тому під час розробки перевіряю не лише вигляд сторінки, а й те, що людина бачить у процесі роботи: стан завантаження, повідомлення про помилки та підтвердження виконаної дії. Для публічних сторінок додатково налаштовую метадані й серверний рендеринг, щоб основний контент був у HTML-відповіді сервера.

  **Щоб оцінити подібну задачу, надішліть список екранів і дій, які мають бути доступні користувачу, та макети, якщо вони є.** На цій основі визначимо зміни в обох частинах застосунку. Вартість функції з інтерфейсом і бекендом починається від $2 400.
