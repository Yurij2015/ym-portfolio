faq:
  - label: Inertia чи окремий Nuxt?
    content: Inertia дає змогу писати інтерфейс на Vue всередині застосунку Laravel. Окремий Nuxt зручніший для публічної частини з серверним рендерингом. Вибір залежить від вимог.
  - label: Чи потрібен готовий дизайн?
    content: Можу працювати за макетом або на готовій бібліотеці компонентів. Розробку власного візуального стилю треба врахувати в обсязі робіт.
content: |-
  ## Приклад VetCard

  VetCard показує публічні сторінки клінік на Nuxt, а дані й онлайн-запис бере з Laravel API. Обидві частини мають працювати узгоджено: користувач бачить актуальну інформацію, обирає час прийому й отримує зрозуміле підтвердження.

  Для публічних сторінок налаштовую метадані й серверний рендеринг. Це допомагає пошуковим системам бачити контент, але позицій чи індексації не гарантує.

  Надішліть список екранів, макети, якщо є, і опис потрібних дій. Ціна від $2 400 розрахована на окрему частину застосунку з інтерфейсом і бекендом.
