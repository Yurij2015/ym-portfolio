faq:
  - label: Filament, Flowbite чи AdminLTE?
    content: Filament підходить, коли застосунок на Laravel, а панель складається з типових екранів зі списками, формами, фільтрами й ролями. Flowbite беру, коли потрібен власний вигляд чи нестандартні екрани або коли фронтенд окремий, на Vue чи Nuxt. AdminLTE доречний, якщо проєкт уже на Bootstrap або в ньому є адмінка на AdminLTE, яку треба доробити.
  - label: Чи можна додати Filament у наявний Laravel?
    content: Так, якщо сумісні версії, моделі й авторизація. Ресурси можна додавати по одному, не чіпаючи решту застосунку.
  - label: Що робити, якщо бекенд не на Laravel?
    content: Тоді Filament не підійде. Панель на Flowbite або AdminLTE можна вбудувати в наявний PHP-застосунок або зробити окремою, з доступом до даних через API. Другий варіант додає інтеграційну роботу.
content: |-
  ## Приклади з проєктів

  У DigiSpace панель Filament працює поруч зі старою адмінкою на Inertia та Vue. У ній редагують контент, переклади й SEO-метадані, а екрани переносяться зі старої адмінки поступово. У DigiPulse на Filament зроблено керування моніторами, контактами й правилами сповіщень.

  Flowbite я використовую в NetPostPanel, де фронтенд на Inertia та Vue, і в панелі клініки VetSpace на Nuxt. На ньому ж зроблено адмінку клієнтського маркетплейсу з користувачами, ролями, оголошеннями й замовленнями, а також сервіс для фотографів із галереями та пакетами послуг.

  На AdminLTE я робив дві панелі на Laravel. Перша збирає за розкладом дані через API зовнішнього сервісу й показує агенції статистику, витрати та експорт. Друга керує збором і фільтрацією даних із соцмережі через черги задач.

  Обсяг роботи над панеллю визначає не кількість таблиць у базі, а операції: що створюють і редагують, за чим фільтрують, які дії потребують підтвердження.

  Покажіть поточні екрани або таблиці, з якими працює команда, і розкажіть, що зараз доводиться робити вручну. Від $1 600 коштує набір пов’язаних екранів; імпорт, звіти й нестандартні операції додаються до оцінки залежно від складності.
