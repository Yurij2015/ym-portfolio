faq:
  - label: Filament, Flowbite чи AdminLTE?
    content: Filament підходить, коли застосунок на Laravel, а панель складається з типових екранів зі списками, формами, фільтрами й ролями. Flowbite беру, коли потрібен власний вигляд чи нестандартні екрани або коли фронтенд окремий, на Vue чи Nuxt. AdminLTE доречний, якщо проєкт уже на Bootstrap або в ньому є адмінка на AdminLTE, яку треба доробити.
  - label: Чи можна додати Filament у наявний Laravel?
    content: Так, якщо сумісні версії, моделі й авторизація. Ресурси можна додавати по одному, не чіпаючи решту застосунку.
  - label: Що робити, якщо бекенд не на Laravel?
    content: Тоді Filament не підійде. Панель на Flowbite або AdminLTE можна вбудувати в наявний PHP-застосунок або зробити окремою, з доступом до даних через API. Другий варіант додає інтеграційну роботу.
content: |-
  ## Приклади з проєктів

  У DigiSpace я поступово переношу екрани зі старої адмінки на Inertia та Vue до Filament. Обидві панелі працюють поруч, а в новій уже можна редагувати контент, переклади й SEO-метадані. Filament використовую і в DigiPulse, де через нього керують моніторами, контактами та правилами сповіщень.

  Працюю також із Flowbite. На ньому побудовані NetPostPanel і панель клініки VetSpace, а серед клієнтських проєктів — адмінка маркетплейсу з користувачами, оголошеннями й замовленнями та сервіс для фотографів із галереями й пакетами послуг.

  Маю досвід і з AdminLTE: на ньому я робив дві панелі для Laravel-застосунків. Одна за розкладом отримує дані через зовнішній API й дає агенції змогу переглядати статистику та витрати й експортувати їх. Інша керує збором і фільтрацією даних із соцмережі через черги задач.

  У кожному з цих випадків обсяг роботи визначають щоденні дії команди: які дані треба створювати й редагувати, як їх шукати та які операції потребують підтвердження. **Щоб оцінити адмін-панель, покажіть поточні екрани або таблиці й розкажіть, що доводиться робити вручну.**

  Вартість набору пов’язаних екранів починається від $1 600. Якщо потрібні імпорт, звіти чи нестандартні операції, враховую їхню складність у загальній оцінці.
