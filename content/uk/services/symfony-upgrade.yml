faq:
  - label: Яку версію Symfony обрати?
    content: Порівняємо строки підтримки, вимоги до PHP і сумісність пакетів. Найновіша версія не завжди найкращий вибір.
  - label: Чи можна перенести самописний PHP?
    content: "Так, але таку міграцію треба планувати окремо: маршрути, дані й частини старої системи, які ще працюватимуть."
content: |-
  ## Оновлення під конкретний застосунок

  У квиткових магазинах, над якими я працюю, доводилося мати справу з різними поколіннями Symfony та PHP. Тому під час оновлення окремо перевіряю конфігурацію, інтеграції й бізнес-сценарії.

  Попередження про застарілі виклики дають лише частину картини. Окремо треба перевірити сторонні бандли, зміни API та власний код. Якщо пакет більше не підтримується, пропоную заміну або обговорюємо, як змінити залежну функцію.

  Надішліть версії Symfony і PHP, файли залежностей і причину оновлення. Ціна від $1 800 розрахована на оновлення до визначеної версії; перенесення самописної системи на Symfony оцінюється окремо.
