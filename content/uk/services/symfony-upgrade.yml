faq:
  - label: Яку версію Symfony обрати?
    content: Порівняємо строки підтримки, вимоги до PHP і сумісність пакетів. Найновіша версія не завжди найкращий вибір.
  - label: Чи можна перенести самописний PHP?
    content: "Так, але таку міграцію треба планувати окремо: маршрути, дані й частини старої системи, які ще працюватимуть."
content: |-
  ## Оновлення під конкретний застосунок

  У роботі над квитковими магазинами я мав справу з різними поколіннями Symfony та PHP. Під час переходу між версіями зміни можуть стосуватися конфігурації, сторонніх бандлів та власного коду, тому оцінку починаю з їхнього перегляду.

  Попередження про застарілі виклики допомагають знайти частину потрібних змін, але сумісність залежностей і зміни API перевіряю окремо. Якщо бандл більше не підтримується, пропоную заміну або обговорюємо адаптацію залежної функції. Після цього перевіряю інтеграції та бізнес-сценарії, яких торкнулося оновлення.

  **Для оцінки надішліть версії Symfony і PHP, файли залежностей та причину оновлення.** За ними зможу визначити обсяг переходу до цільової версії, вартість якого починається від $1 800. Якщо потрібно перенести власну PHP-систему на Symfony, підготую окрему оцінку.
