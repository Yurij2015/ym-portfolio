faq:
  - label: З якими платіжними системами ви працювали?
    content: Stripe у власному VetSpace (підписки через Cashier) і в квиткових магазинах, де також використовується Dalenys. У клієнтському маркетплейсі налаштовував Stripe Connect. Інтегрував і Revolut. Нового провайдера спершу вивчаю за документацією.
  - label: Чи можна додати підписки до наявного продукту?
    content: Так. Треба визначити тарифи, доступ після оплати, зміну плану, скасування й поведінку при невдалому платежі.
content: |-
  ## Що входить в інтеграцію

  Після оплати застосунок має підтвердити операцію на своєму боці й оновити її статус. Якщо відповідь провайдера затримується або вебхук надходить повторно, система повинна коректно обробити ці події та показати користувачу зрозумілий стан. Саме тому інтеграція охоплює весь процес, включно з помилками й повторними повідомленнями.

  З підписками Stripe я працюю у власному VetSpace. Складніший розподіл платежів реалізував у клієнтському маркетплейсі на Laravel через Stripe Connect: продавці підключають власні акаунти, покупець платить через Checkout, а платформа утримує свою комісію. Учасникам партнерської програми також переказується їхня комісія, тоді як статуси замовлень оновлюються за вебхуками платформи й підключених акаунтів.

  Подібна увага до помилок і статусів потрібна й для інших зовнішніх сервісів. Наприклад, у NetPostPanel їхні API викликаються у фонових задачах підготовки контенту, де результат має бути зрозумілим і після завершення самого запиту.

  Для оцінки платіжної інтеграції напишіть, якого провайдера обрали та які операції потрібні: разова оплата, підписки чи повернення. Якщо йдеться про інший API, допоможуть документація й опис даних для обміну. Вартість інтеграції починається від $1 600, а комісії провайдера сплачуються окремо.
