faq:
  - label: З якими платіжними системами ви працювали?
    content: Stripe у власному VetSpace (підписки через Cashier) і в квиткових магазинах, де також використовується Dalenys. У клієнтському маркетплейсі налаштовував Stripe Connect. Інтегрував і Revolut. Нового провайдера спершу вивчаю за документацією.
  - label: Чи можна додати підписки до наявного продукту?
    content: Так. Треба визначити тарифи, доступ після оплати, зміну плану, скасування й поведінку при невдалому платежі.
content: |-
  ## Що входить в інтеграцію

  Сторінка «Оплата пройшла» лише частина інтеграції. Застосунок має підтвердити операцію на своєму боці, показати користувачу зрозумілий стан під час затримки й правильно обробити повторне повідомлення від провайдера.

  У VetSpace я працюю з підписками Stripe, а в NetPostPanel зовнішні сервіси викликаються у фонових задачах підготовки контенту. В обох випадках потрібні обробка помилок і зрозумілий статус операції.

  У маркетплейсі, який я розробляв для клієнта на Laravel, платежі йдуть через Stripe Connect. Продавці підключають власний акаунт Stripe, покупець платить через Checkout, платформа утримує комісію, а учасникам партнерської програми переказується їхня комісія. Стан замовлень оновлюють вебхуки платформи й підключених акаунтів.

  Для платежів напишіть, який провайдер і які операції потрібні: разова оплата, підписки, повернення. Для іншого API надішліть документацію й опис даних для обміну. Ціна від $1 600 стосується інтеграції; комісії провайдера сплачуються окремо.
