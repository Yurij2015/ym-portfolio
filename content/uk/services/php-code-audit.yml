faq:
  - label: Чи потрібен доступ до продакшну?
    content: Для початку зазвичай вистачає репозиторію й опису проблем. Логи, тестові дані чи середовище знадобляться залежно від того, що перевіряємо.
  - label: Чи входять виправлення у вартість?
    content: Ні, результат аудиту це звіт. Виправлення можу взяти окремою задачею або передати вашій команді.
content: |-
  ## З чого починається аудит

  Аудит має відповісти на конкретне питання: чому не проходить оплата, де бракує перевірки доступу, що заважає розвивати модуль. Якщо потрібен загальний огляд, спочатку обираємо найважливіші частини системи.

  У звіті вказую, що саме перевірено і які висновки підтверджені кодом або відтвореною помилкою. Поради щодо структури коду подаю окремо від дефектів. Обмежена перевірка не означає, що в решті системи проблем немає.

  Надішліть короткий опис застосунку й питання, на які має відповісти аудит. Ціна від $1 000 охоплює перевірку визначених модулів і звіт.
