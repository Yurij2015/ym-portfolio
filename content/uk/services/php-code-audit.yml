faq:
  - label: Чи потрібен доступ до продакшну?
    content: Для початку зазвичай вистачає репозиторію й опису проблем. Логи, тестові дані чи середовище знадобляться залежно від того, що перевіряємо.
  - label: Чи входять виправлення у вартість?
    content: Ні, результат аудиту — це звіт. Виправлення можу взяти окремою задачею або передати вашій команді.
content: |-
  ## З чого починається аудит

  Спочатку визначаємо, на які питання має відповісти перевірка: чому не проходить оплата, де бракує контролю доступу чи що заважає розвивати модуль. Якщо потрібен загальний огляд, обираємо найважливіші частини системи, щоб спрямувати час на них.

  Від цього фокуса залежить і звіт: у ньому описую перевірені ділянки та висновки, підтверджені кодом або відтвореною помилкою. Для кожної проблеми пояснюю наслідки й рекомендоване виправлення, а поради щодо структури коду подаю окремо від дефектів. Так команда бачить і пріоритети, і межі проведеної перевірки.

  **Щоб визначити обсяг аудиту, надішліть короткий опис застосунку та питання, які вас турбують.** На цій основі погодимо модулі для перевірки. Аналіз і звіт починаються від $1 000.
