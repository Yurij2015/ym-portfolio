summary: "Розробляю на Laravel кабінети користувачів, обробку замовлень, звіти та інтеграції. Беру функцію цілком: структуру даних, серверну логіку, права доступу й інтерфейс. Працюю як з новими продуктами, так і з наявними застосунками, де нове має вписатися в систему й не зламати те, що вже працює."
