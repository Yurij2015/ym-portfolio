process:
  - title: Розбір задачі
    description: Дивлюся поточний застосунок і з’ясовую, які дії та дані потрібні користувачам.
  - title: Розробка модуля
    description: Створюю структуру даних, логіку й екрани, показую робочі зміни по ходу.
  - title: Перевірка й реліз
    description: Тестую права доступу та пов’язані операції, готую розгортання й документацію.
