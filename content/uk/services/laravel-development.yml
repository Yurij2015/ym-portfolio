title: Розробка на Laravel
content: |-
  ## Приклади з проєктів

  У VetSpace працюю з CRM для клінік, їхніми даними й підписками Stripe. У DigiPulse Laravel керує моніторами й сповіщеннями, а мережеві перевірки виконує окремий Go-сервіс. Задачі різні, тому архітектуру нового модуля підбираю під конкретний процес.

  Для клієнта я розробляв на Laravel маркетплейс з оголошеннями й платними пакетами. У ньому є чат, відеодзвінки через LiveKit, пошук на Meilisearch і тікети підтримки, які створюються також із листів.

  Якщо застосунок уже працює, спочатку дивлюся залежності, структуру даних і спосіб розгортання. Нова функція має вписатися в цю систему, тож перевіряю її разом із пов’язаною логікою.

  Опишіть, що має робити користувач, і покажіть поточний застосунок або макети. Я розберу технічну частину й запропоную, як це реалізувати, з оцінкою часу й вартості.
deliverables:
  - Робочий модуль, наприклад кабінет із ролями, обробка замовлень або інтеграція із зовнішнім сервісом
  - Перевірки прав доступу й тести основних сценаріїв
  - Код у вашому репозиторії та документація із запуску й підтримки
description: Модулі, кабінети користувачів та інтеграції на Laravel, як у нових продуктах, так і в наявних застосунках.
faq:
  - label: Що означає ціна від $2 400?
    content: "Це стартовий бюджет для окремого модуля чи інтеграції з тестами й підготовкою до запуску, наприклад кабінету з ролями або обробки замовлень. Фіксованих пакетів немає: дрібне виправлення й новий продукт оцінюються по-різному."
  - label: Чи потрібен окремий фронтенд?
    content: Для внутрішніх панелей використовую Filament, для кабінетів, зокрема, Inertia і Vue. Публічні сторінки можна зробити на Nuxt, як у VetCard. Вибір залежить від інтерфейсу й того, хто його підтримуватиме.
