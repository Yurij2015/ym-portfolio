title: Розробка на Laravel
content: |-
  ## Приклади з проєктів

  У VetSpace я розвиваю CRM для клінік, працюючи з їхніми даними й підписками Stripe. У DigiPulse Laravel відповідає за керування моніторами та сповіщеннями, тоді як мережеві перевірки виконує окремий Go-сервіс. В обох продуктах нові модулі мають враховувати логіку, яка вже працює.

  Серед клієнтських проєктів — маркетплейс на Laravel з оголошеннями й платними пакетами. Окрім основних функцій, я працював у ньому з чатом, відеодзвінками через LiveKit, пошуком на Meilisearch і тікетами підтримки, які створюються також із листів.

  Щоб додати подібну функцію до наявного застосунку, спершу потрібно зрозуміти його структуру даних, залежності та спосіб розгортання. Після цього можна спланувати зміни й перевірки так, щоб новий модуль узгоджувався з рештою системи.

  Почати можемо з опису того, що має робити користувач, і перегляду поточного застосунку або макетів. На цій основі я запропоную реалізацію з оцінкою часу й вартості.
deliverables:
  - Робочий модуль, наприклад кабінет із ролями, обробка замовлень або інтеграція із зовнішнім сервісом
  - Перевірки прав доступу й тести основних сценаріїв
  - Код у вашому репозиторії та документація із запуску й підтримки
description: Модулі, кабінети користувачів та інтеграції на Laravel, як у нових продуктах, так і в наявних застосунках.
faq:
  - label: Що означає ціна від $2 400?
    content: "Це стартовий бюджет для окремого модуля чи інтеграції з тестами й підготовкою до запуску, наприклад кабінету з ролями або обробки замовлень. До початку роботи погоджуємо функції модуля, критерії прийняття й вартість."
  - label: Чи потрібен окремий фронтенд?
    content: Для внутрішніх панелей використовую Filament, для кабінетів, зокрема, Inertia і Vue. Публічні сторінки можна зробити на Nuxt, як у VetCard. Вибір залежить від інтерфейсу й того, хто його підтримуватиме.
