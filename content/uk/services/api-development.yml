faq:
  - label: Чи можна доопрацювати наявний API?
    content: Так. Спочатку дивлюся поточний контракт і те, хто ним користується, а потім планую сумісні зміни або нову версію.
  - label: Чи завжди потрібен REST?
    content: Ні. Формат залежить від клієнтів і операцій. Якщо REST уже працює й підходить, міняти його немає сенсу.
content: |-
  ## API під конкретних клієнтів

  У VetSpace один Laravel API обслуговує публічний каталог через GraphQL і CRM через REST. NetPostPanel надає іншим застосункам генерацію та переклад контенту, синхронно або з колбеком. Доступ, тривалість операцій і спосіб повернення результату в цих випадках різні.

  Для клієнтського маркетплейсу я писав REST API з авторизацією через Sanctum і документацією Swagger. Через нього працюють оголошення, замовлення, чат і тікети підтримки.

  Перед реалізацією з’ясовую, хто викликає API, які дані йому можна бачити і що він має отримати у разі помилки. Для довгих операцій зазвичай краще фонове виконання з перевіркою статусу.

  Для оцінки опишіть потрібні операції та додайте приклад даних, а якщо API вже існує, то й документацію. Ціна від $1 800 розрахована на групу пов’язаних операцій із документацією та тестами.
