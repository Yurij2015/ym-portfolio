faq:
  title: "Часті запитання"
  description: "Коротко про процес, технології та співпрацю."
  categories:
    - title: "Співпраця"
      questions:
        - label: "Чи беретеся за підтримку наявного коду?"
          content: "Так. Більшість моєї роботи — розвиток і підтримка продакшн-продуктів: аудит кодової бази, рефакторинг і нові фічі без зупинки релізів."
        - label: "Як виглядає процес?"
          content: "Короткий бриф → оцінка з термінами → розробка з демо кожні 1–2 тижні → деплой і підтримка."
        - label: "Що після релізу?"
          content: "Моніторинг, виправлення багів і розвиток продукту — залишаюся на підтримці стільки, скільки потрібно."
    - title: "Технології"
      questions:
        - label: "З якими технологіями ви працюєте?"
          content: "Laravel (Filament, Octane, FrankenPHP) і Symfony на бекенді, Vue.js/Nuxt на фронтенді, Docker, Terraform, CI/CD, платіжні інтеграції та AI."
        - label: "Чи працюєте ви з командою клієнта?"
          content: "Так, комфортно вбудовуюся в наявні команди: code review, спільний пайплайн, документація та регулярні демо."
        - label: "У якому часовому поясі ви працюєте?"
          content: "CET (Познань, Польща), з гнучким перетином робочих годин для Європи та США."
