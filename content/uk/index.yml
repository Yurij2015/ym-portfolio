about:
  title: "Про мене"
  description: |
    Full-Stack розробник із 10+ роками комерційного досвіду. Створюю та підтримую SaaS-продукти, CRM-системи, ticketing/e-commerce платформи та REST API.
    Глибока експертиза в Laravel (Filament, Octane, FrankenPHP) та Symfony, а також Vue.js/Nuxt, мультитенантних архітектурах та інтеграції платіжних систем.
