about:
  title: "Про мене"
  description: |
    Працюю над власними продуктами й долучаюся до клієнтських проєктів. У VetSpace розвиваю CRM для ветеринарних клінік, у DigiPulse — моніторинг доступності сайтів, а в NetPostPanel — підготовку контенту за допомогою AI.
    У цих продуктах працюю з Laravel, Filament, чергами й API. Для інтерфейсів використовую Vue та Nuxt, а для окремих сервісів — Go. Приклади й технічні деталі зібрані нижче в проєктах.
