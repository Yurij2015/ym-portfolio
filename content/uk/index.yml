testimonials:
  - quote: "Юрій — машина кодування. З моменту, коли він відгукнувся на контракт, було зрозуміло, що він людина небагатослівна, але співбесіда пройшла чудово, і його найняли. Він спроєктував базу даних, налаштував архітектуру коду та спланував майбутні релізи. Працює самостійно, рев'юїть і дебажить код, постійно пропонує покращення та знаходить логічні вади в системі. Я працюю з фрилансерами з 2012 року, і він єдиний на Upwork, хто по-справжньому впорався зі складними задачами й додав реальну цінність проєкту. Він заслуговує на senior-ставку. Завжди був доступний, щоб підтримати проєкт, коли потрібно, ніколи не вигадує виправдань і чітко комунікує."
    rating: 5
    author:
      name: 'Upwork'
      description: 'Відгук клієнта на Upwork'
      to: 'https://www.upwork.com/freelancers/~012af578c90561eb11'
  - quote: "Гаряче рекомендую Юрія як надійного, проактивного й орієнтованого на результат професіонала. Юрій — відповідальний спеціаліст, який може автономно працювати над широким спектром задач. Має сильну експертизу в PHP (Symfony, Laravel) та JavaScript-фреймворках (Vue.js, Angular) — самостійно досліджує складні проблеми, знаходить першопричини та впроваджує ефективні рішення."
    author:
      name: 'LinkedIn'
      description: 'Рекомендація на LinkedIn'
      to: 'https://www.linkedin.com/in/yurii-mokryi/details/recommendations/'
  - quote: "Можна звернутися з окремою задачею або долучити мене до роботи над продуктом. Для початку достатньо описати, що потрібно зробити, і показати застосунок чи матеріали, які вже є."
    author:
      name: 'Yurii Mokryi'
      description: 'Senior Full-Stack PHP Developer • 8+ років • Poznań'
      avatar:
        src: '/images/avatar-3.jpeg'
        alt: 'Yurii Mokryi'
faq:
  title: "Часті запитання"
  description: "Коротко про процес, технології та співпрацю."
  categories:
    - title: "Співпраця"
      questions:
        - label: "Чи беретеся за підтримку наявного коду?"
          content: "Так. Значна частина моєї роботи — розвиток і підтримка застосунків після запуску: перегляд коду, рефакторинг і нові функції. Перед змінами знайомлюся з проєктом і його процесом релізів."
        - label: "Як виглядає процес?"
          content: "Спочатку обговорюємо задачу й переглядаємо наявні матеріали. Потім я пропоную план робіт з оцінкою часу та вартості. Під час розробки показую робочі зміни; частоту демо й порядок релізу визначаємо разом."
        - label: "Що після релізу?"
          content: "Можу продовжити роботу над продуктом: виправляти помилки, перевіряти сповіщення моніторингу й додавати функції. Обсяг підтримки та мою доступність погоджуємо окремо."
    - title: "Технології"
      questions:
        - label: "З якими технологіями ви працюєте?"
          content: "На бекенді працюю з PHP, Laravel і Symfony, на фронтенді — з Vue та Nuxt. У власних продуктах використовую також Filament, Redis, Go й інтеграції з AI-провайдерами. Інструменти для конкретної задачі добираю з урахуванням наявного проєкту."
        - label: "Чи працюєте ви з командою клієнта?"
          content: "Так. Працюю з беклогом команди, готую pull request, беру участь у рев’ю коду й обговоренні рішень. Формат звітів і демо узгоджуємо на початку співпраці."
        - label: "У якому часовому поясі ви працюєте?"
          content: "Працюю з Познані, Польща. Години зв’язку й час спільної роботи з вашою командою обговорюємо на початку співпраці."
