content: |
  Виділене залізо Hetzner — місце, де живуть мої SaaS-продукти: фізичний сервер із Proxmox, що замінив зростаючий флот хмарних дроплетів, коли математика перестала сходитися.

  ## Як я використовую Hetzner

  - **Виділений сервер** — одна фізична машина хостить VM, на яких працюють DigiPulse, VetSpace, NetPostPanel і допоміжні сервіси.
  - **Власний шар віртуалізації** — Proxmox на bare metal: VM і контейнери нарізані під навантаження, зі снапшотами й бекапами під моїм контролем.
  - **Передбачувана економіка** — фіксована місячна вартість за реальні ядра й RAM замість по-VM хмарного прайсу; заощаджене йде в запас на резервування.

  ## Продакшн-досвід

  Володіння залізом означає й володіння інцидентами — для диска, що помирає, чи криво налаштованого фаєрвола немає саппорт-тікета, лише консоль і відповідальність полагодити. Саме такий обмін мені й був потрібен: повний контроль над стеком від гіпервізора до застосунку за ціною, що робить bootstrap-SaaS сталим. Весь мій продакшн відповідає цій машині.

  ## Виділене vs хмара в моєму стеку

  Сталі always-on навантаження належать власному залізу; пікові чи одноразові — хмарі. Мої продукти — перший випадок: передбачуване навантаження, відомі сусіди (я) і жодних сюрпризів у рахунку, коли трафік росте.
