content: |
  Redis — сховище даних у пам'яті, яке я використовую для кешування та фонової обробки. У Laravel-проєктах воно допомагає виконувати роботу, на завершення якої користувач не повинен чекати в межах HTTP-запиту.

  ## Приклади з моїх проєктів

  NetPostPanel використовує Laravel Horizon для черг генерування контенту. У DigiPulse Redis бере участь у подієвій архітектурі моніторингу. Такі завдання потребують іншого підходу до збереження, ніж звичайний кеш сторінки: втрачена робота може вплинути на продукт, навіть якщо кеш легко відновити.

  ## Кешування та координація

  Redis може зберігати результати обчислень, лічильники запитів і тимчасові блокування. Ключі й час життя кешу мають відповідати даним. Блокування допомагають узгодити роботу обробників, проте повторні спроби все одно потрібно проєктувати так, щоб вони не дублювали бізнес-дії.

  ## Збереження даних черги

  Redis підтримує знімки RDB і журнал AOF із різними умовами відновлення. Перезапуск не обов'язково стирає дані, а вважати всі ключі одноразовими небезпечно для черг. Збереження, витіснення ключів і повторні спроби завдань потрібно налаштовувати разом. Натомість Redis Pub/Sub не зберігає повідомлення для від'єднаних підписників.
