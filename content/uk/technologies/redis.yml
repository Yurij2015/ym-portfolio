content: |
  Redis — клей мого Laravel-стека: черги, кеші й ефемерний стан, який не має торкатися основної бази. Кожен продукт із фоновою роботою проходить через нього.

  ## Як я використовую Redis

  - **Черги з Horizon** — AI-конвеєр контенту NetPostPanel (fetch → generate → index) і відправка сповіщень DigiPulse працюють як Horizon-задачі на Redis.
  - **Кеш застосунку** — конфіги, агрегати й лічильники rate-limit на гарячому шляху: база тримає правду записів, Redis обслуговує читання.
  - **Блокування й координація** — атомарні локи не дають запланованим моніторинговим перевіркам спрацювати двічі на різних воркерах.
  - **Подієва сантехніка** — pub/sub і broadcast-підкладка там, де фронтенду потрібні живі оновлення.

  ## Продакшн-досвід

  Redis — той елемент, що перетворює застосунок «запит → відповідь» на систему, яка справді працює: AI-генерація в черзі, перевірки за розкладом, дедупліковані сповіщення. Операційна звичка, що найважливіша: стався до Redis як до одноразового стану — все в ньому має відновлюватися з первинного сховища, бо одного дня вузол рестартнеться, і ти будеш радий, що так і є.

  ## Де Redis проти альтернатив

  Для Laravel-навантажень це досі прагматичний стандарт — Horizon, кеш і бродкастинг говорять ним нативно. До черг на базі даних вдаюся лише на найменших деплоях; щойно в продукті з'являється реальна фонова робота, Redis уже там і робить три справи одночасно.
