content: |
  Laravel — мій основний backend-фреймворк. Я будую та підтримую на ньому продакшн-SaaS, адмін-панелі й API — від першої міграції до задеплоєного й монітореного сервісу на власних серверах.

  ## Як я використовую Laravel

  - **Мультитенантні SaaS API** — VetSpace працює на Laravel API з database-per-tenant: один код обслуговує і публічний каталог клінік, і CRM за підпискою.
  - **Адмінки на Filament** — бек-офіси DigiPulse і DigiSpace: ресурси, фільтри, дашборди та керування контентом без окремої розробки адмінки.
  - **Білінг** — підписки Stripe через Laravel Cashier: тріали, зміна планів, dunning, вебхуки.
  - **Черги та задачі** — воркери під Horizon для AI-конвеєрів контенту та моніторингових перевірок.
  - **Дизайн API** — REST для CRM-частин, GraphQL для складних запитів каталогу — версійовано й задокументовано.

  ## Продакшн-досвід

  Laravel несе всі мої SaaS-продукти: VetSpace (ветеринарна платформа), DigiPulse (моніторинг доступності), NetPostPanel (AI-контент-операції) і сайт DigiSpace з власною CMS. Патерн, який повторюється всюди: доменна логіка в сервісах, ізоляція тенантів на рівні бази, а Octane/FrankenPHP дають запас продуктивності, коли трафік росте.

  ## Коли Laravel — правильний вибір

  Продукти, яким потрібні адмінка, білінг, черги й справжнє API, виграють найбільше — Laravel дає все це без збирання десятка пакетів. Для тонкого стейтлес-сервісу чи важкого воркера іноді беру Go; для всього продуктового — Laravel за замовчуванням.
faq:
  - label: Ви будуєте Laravel-застосунки з нуля чи підхоплюєте існуючі?
    content: "І те, і інше. Більшість комерційної роботи — розвиток існуючих продакшн-кодових баз: аудит, рефакторинг, нові фічі без зупинки релізів. Проєкти з нуля йдуть за тією ж дисципліною з першого дня."
  - label: Які інструменти екосистеми Laravel ви використовуєте?
    content: Filament для адмінок, Cashier для Stripe-білінгу, Horizon для черг, Octane з FrankenPHP там, де важлива продуктивність, а також Pest/PHPUnit і PHPStan у CI.
  - label: Чи можете ви самі хостити й деплоїти Laravel-застосунки?
    content: "Так — мої SaaS-проєкти живуть на власному сервері Hetzner: Proxmox, Docker, Caddy і пайплайни GitHub Actions. Я закриваю весь шлях від коміту до продакшну."
