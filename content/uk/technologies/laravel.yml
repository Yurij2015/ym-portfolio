content: |
  Laravel — PHP-фреймворк, на якому я створюю SaaS-продукти, API та адміністративні інструменти. Серед моїх проєктів — VetSpace, DigiPulse, NetPostPanel і сайт DigiSpace. Кожен має власні бізнес-правила та вимоги до інтеграцій.

  ## Як я використовую Laravel

  - **VetSpace** — спільний API для каталогу клінік і CRM, доступ з урахуванням клініки та підписки Stripe через Cashier.
  - **DigiPulse** — застосунок моніторингу й панель Filament поруч з окремим сервісом перевірок на Go.
  - **NetPostPanel** — фонові процеси генерування контенту через черги та Horizon.
  - **DigiSpace** — багатомовний сайт із власною CMS і панеллю Filament.

  ## Фреймворк та його екосистема

  Laravel надає маршрутизацію, перевірку даних, роботу з базою та API черг. Filament, Cashier і Horizon — додаткові інструменти, які я добираю й налаштовую для проєкту. Платежі, права доступу та ізоляція клієнтських даних потребують окремого проєктування й тестування.

  ## Підтримка після запуску

  Намагаюся відокремлювати бізнес-логіку від HTTP-запитів та адміністративних екранів. Це полегшує повторне використання процесу в API чи фоновому завданні. Оптимізацію починаю з вимірювань: Octane може допомогти за відповідного навантаження, але не замінює оптимізації запитів і контролю стану застосунку.
faq:
  - label: Ви створюєте нові Laravel-застосунки чи підтримуєте наявні?
    content: І те, й інше. Працюю над новими застосунками, аудитами, рефакторингом і розвитком наявних продуктів. Підхід залежить від стану коду та вимог до випусків.
  - label: З якими інструментами Laravel ви працюєте?
    content: Filament для адміністрування, Cashier для підписок Stripe і Horizon для черг Redis. Також працюю з Octane та FrankenPHP, коли застосунку підходять процеси тривалої роботи.
  - label: Чи можете ви налаштувати хостинг і розгортання Laravel?
    content: Так. Працюю з Docker, Caddy, Proxmox і CI/CD, зокрема на орендованому виділеному сервері Hetzner. Конфігурація залежить від вимог до доступності й підтримки проєкту.
