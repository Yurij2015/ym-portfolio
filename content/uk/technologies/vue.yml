content: |
  Vue.js — мій фреймворк вибору для фронтенду: від інтерактивних SaaS-дашбордів до SSR-сайтів. Більшість того, що я відправляю у веб, містить Vue — напряму чи через Nuxt.

  ## Як я використовую Vue

  - **Фронтенди SaaS** — панель клініки VetSpace: автентифікований мультитенантний UI зі станом на Pinia, TypeScript і Tailwind.
  - **SSR-сайти через Nuxt** — публічний каталог VetCard і це портфоліо рендеряться на сервері заради SEO, потім гідратуються в той самий Vue-застосунок.
  - **Inertia-застосунки** — адмінка DigiSpace поєднує Laravel-бекенд із Vue-сторінками без окремого API-шару.
  - **Інтерактивні віджети** — букінг-флоу, календарі й динамічні форми всередині серверно відрендерених сторінок.

  ## Продакшн-досвід

  Сильне місце Vue у моїй роботі — межа між «сайтом» і «застосунком»: каталог клінік має ранжуватися в Google (SSR, швидкий перший рендер), а букінг на тій самій сторінці потребує клієнтської інтерактивності. Vue покриває обидва сценарії без розпаду на окремі проєкти. Composition API + TypeScript тримають код читабельним у міру росту — панель VetSpace має роки накопичених фіч і досі легко навігується.

  ## Vue vs React у моїй роботі

  Прагматичний вибір: шаблонний синтаксис Vue ближчий до HTML для змішаних серверно-рендерених сайтів, Nuxt — зріла SSR-історія, а single-file component тримає шаблон, логіку й стиль в одному перегляданому блоці. Для PHP-бекендів інтегрується чисто — без важкого окремого фронтенд-пайплайна, доки проєкт його не потребує.
faq:
  - label: Vue з Nuxt чи standalone?
    content: Обидва. Nuxt — коли сторінка має індексуватися (каталоги, маркетингові сайти); standalone Vue або Inertia — для автентифікованих панелей, де SEO не застосовується.
  - label: Міграції з Vue 2 на Vue 3?
    content: Так — мігрував продакшн-фронтенди на Vue 3 + Composition API інкрементально, маршрут за маршрутом, без переписування з нуля.
