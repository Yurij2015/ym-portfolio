content: |
  Vue.js — JavaScript-фреймворк для створення інтерфейсів. Я використовую його в панелі клініки VetSpace, публічному сайті VetCard та адміністративних інтерфейсах, зокрема DigiSpace.

  ## Різні інтерфейси зі спільними інструментами

  - **Панелі застосунків** — форми, списки та робочі процеси для авторизованих користувачів.
  - **Публічні сайти** — Vue-компоненти в Nuxt-сторінках із серверним рендерингом.
  - **Інтеграція з Laravel** — Inertia поєднує серверні маршрути з Vue-сторінками без потреби в окремому публічному API для цих екранів.

  ## Приклад сторінки клініки

  VetCard потрібні і зрозуміла інформація про клініку, і інтерактивний запис на прийом. Nuxt відповідає за серверний рендеринг сторінки, а Vue — за взаємодію з користувачем. Так один сайт допомагає і прочитати про клініку, і вибрати час візиту.

  ## Підтримка компонентів

  Composition API допомагає групувати пов'язану логіку, а TypeScript — явно описувати параметри й результати. Я розділяю завантаження даних, спільну логіку та відображення там, де це робить код зрозумілішим. Вибір фреймворку все одно залежить від наявного проєкту й команди: різні інтерфейси можуть потребувати різної архітектури.
faq:
  - label: Ви використовуєте Vue з Nuxt чи Laravel?
    content: Обидва варіанти. Nuxt — для публічних сайтів на кшталт VetCard, Vue з Laravel або Inertia — для інтерфейсів застосунків. Вибір залежить від маршрутизації, доступу до даних і рендерингу.
  - label: Як ви підійшли б до міграції з Vue 2 на Vue 3?
    content: Спочатку перевірив би залежності й несумісні API, потім спланував зміни за компонентами чи маршрутами, якщо архітектура це дозволяє. Тести й поетапні випуски допомагають контролювати перехід.
