content: |
  Go — моя друга backend-мова: для малих always-on сервісів, де PHP-життєцикл запиту є неправильним інструментом. Легкі воркери, не ще один моноліт.

  ## Як я використовую Go

  - **Моніторинг-воркери** — перевірки доступності DigiPulse працюють як Go-сервіси: тисячі конкурентних HTTP-проб із часткою пам'яті, яку потребував би PHP-еквівалент.
  - **AI-мікросервіс** — VetSpace делегує аналіз візитів окремому Go-сервісу, тож основний Laravel API лишається відзивчивим, поки йде інференс.
  - **Деплой одним бінарником** — скомпільований артефакт падає в Docker-образ без рантайм-залежностей; найпростіші деплої в моїй інфраструктурі.

  ## Продакшн-досвід

  Патерн, що працює: домен і білінг лишаються в Laravel, а конкурентні чи латентно-чутливі краї виносяться в Go. Моніторинг — підручниковий випадок: воркер має вчасно відпрацювати тисячі перевірок, витримати часткові збої мережі й швидко звітувати. Горутини й мала пам'ять Go роблять це буденністю — саме такою має бути інфраструктура.

  ## Go vs PHP у моєму стеку

  Взаємодоповнювані, не конкуруючі. PHP/Laravel володіє продуктом; Go — задачами, де важлива конкурентність на мегабайт. Якщо сервіс може бути cron-дружньою Laravel-командою — він лишається в Laravel; Go заробляє своє місце, коли навантаження переростає цю форму.
