content: |
  DigitalOcean хостив перші продакшн-версії моїх проєктів — дроплети, що навчили мене реального серверного оперування, доки флот не виріс настільки, що виділене залізо виграло за ціною.

  ## Як я використовував DigitalOcean

  - **Флот дроплетів** — ранні продукти й сервіси DigiSpace працювали на окремих дроплетах: по одному на навантаження, кожен з власними оновленнями, правилами фаєрвола й розкладом бекапів.
  - **«Managed»-основи вручну** — Ubuntu-сервери, nginx/Caddy, Let's Encrypt, тюнінг бази — та сама сисадмінська практика, що робить пізніші абстракції зрозумілими.
  - **Крива вартості** — чудова платформа, доки кілька always-on VM не почали означати оплату хмарних марж за обчислення, які виділений сервер дає дешевше.

  ## Чого навчила міграція

  Переїзд із дроплетів на виділений сервер Hetzner з Proxmox зменшив щомісячні витрати й консолідував флот — можливо, бо все вже було контейнеризоване. DigitalOcean був правильним першим кроком: швидке провізіонування, добра документація, полога крива входу. Лишається в інструментарії для навантажень, яким потрібна хмарна еластичність замість власного заліза.

  ## Коли я обрав би його знову

  Короткоживучі середовища, клієнтські проєкти, яким потрібна платформа без сисадміна, або будь-що, де погодинна оплата виграє у володіння потужностями. Мої сталі SaaS просто переросли цю цінову точку.
