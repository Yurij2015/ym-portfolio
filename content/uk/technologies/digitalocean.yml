content: |
  DigitalOcean — провайдер хмарної інфраструктури. Я використовував його віртуальні сервери Droplet для ранніх проєктів DigiSpace: самостійно налаштовував Linux і розгортав застосунки.

  ## Робота з Droplet

  Окремі віртуальні машини давали змогу незалежно налаштовувати й оновлювати сервіси. До роботи входили вебсервери, бази даних, мережеві правила, оновлення операційної системи та резервні копії. Droplet — сервер із самостійним адмініструванням: його легко створити, але підтримка програмного забезпечення залишається відповідальністю користувача.

  ## Перехід на виділений сервер

  Зі зростанням інфраструктури я переніс сервіси на орендований сервер Hetzner із Proxmox. Docker спростив перенесення середовищ застосунків. Водночас дані, зміни DNS і план відновлення потребували окремої підготовки.

  ## Як я порівнюю варіанти хостингу

  Враховую споживання ресурсів, час на адміністрування, зберігання резервних копій і вимоги до доступності. Хмарні машини зручні, коли середовища потрібно створювати чи змінювати незалежно. Виділений сервер може підійти для стабільного навантаження, але зосереджує сервіси на одному фізичному вузлі. Вигідніший варіант залежить від конкретного проєкту.
