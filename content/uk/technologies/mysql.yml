content: |
  MySQL — реляційна база даних, яку я використовую в Laravel-застосунках і WordPress-сайтах. У DigiSpace вона зберігає контент корпоративного сайту та CMS, а в DigiSpace Studio працює як частина WordPress-системи.

  ## Що входить у роботу з базою

  - **Структура даних** — зв'язки між сторінками, меню та іншими записами, ключі й обмеження цілісності.
  - **Аналіз запитів** — перевірка повільних запитів і планів виконання перед зміною індексів або збільшенням ресурсів.
  - **Міграції** — зміни структури з урахуванням наявних даних і порядку розгортання.

  ## MySQL у WordPress

  MySQL часто використовують із WordPress, але це не єдиний підтримуваний варіант: WordPress також працює з MariaDB. Вибір залежить від хостингу, наявних даних і досвіду підтримки. Перехід між системами потребує тестування сумісності.

  ## MySQL чи PostgreSQL?

  Я працюю з обома. Наявний MySQL-застосунок може не потребувати міграції, а іншому проєкту можуть підійти типи даних чи індекси PostgreSQL. Для обох систем якість запитів, резервні копії та перевірене відновлення важливіші за загальне твердження, що одна база завжди швидша.
