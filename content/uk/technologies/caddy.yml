content: |
  Caddy — це вебсервер і зворотне проксі, яке передає запити до потрібного застосунку. Я використовую його в інфраструктурі VetSpace, DigiPulse та інших сервісів, щоб з'єднати публічні домени із застосунками в Docker.

  ## Як я використовую Caddy

  - **Маршрутизація запитів** — спрямування трафіку до застосунку або контейнера, що обслуговує домен.
  - **HTTPS** — автоматичне отримання й поновлення сертифікатів для налаштованих доменів.
  - **Зрозуміла конфігурація** — правила проксування у Caddyfile, які можна переглядати разом зі змінами застосунку.

  ## Сертифікати та доступ до даних клінік

  Автоматичний HTTPS потребує коректного DNS, перевірки домену й постійного сховища сертифікатів. Помилки поновлення все одно потрібно відстежувати. Сам застосунок має визначати клініку та перевіряти права доступу: зворотне проксі не забезпечує ізоляцію клієнтських даних.

  ## Місце Caddy в інфраструктурі

  У моїх Docker-середовищах Caddy дає змогу керувати вхідними запитами без громіздкої конфігурації. Окремо потрібно налаштувати тайм-аути, заголовки проксі та журнали доступу. Це допомагає, наприклад, простежити невдалий запит на запис до клініки від проксі до Laravel API.
