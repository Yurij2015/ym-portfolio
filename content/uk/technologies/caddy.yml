content: |
  Caddy стоїть перед кожним сервісом моєї інфраструктури — автоматичний HTTPS, дворівневе проксування для мультитенантного роутингу й конфіги, що вміщаються на екран замість директорії nginx-сніпетів.

  ## Як я використовую Caddy

  - **Дворівневий reverse proxy** — edge-Caddy термінує TLS і роутить за хостнеймом; інстанси на VM проксують у потрібний контейнер. Мультитенантні домени потрапляють до правильного застосунку без ручних правок на кожен сайт.
  - **Автоматичні сертифікати** — Let's Encrypt працює мовчки: випуск, подовження, алерти про збої. TLS роками не є задачею.
  - **Внутрішня адресація** — чисті хостнейми між контейнерами й VM: застосунки адресують сервіси іменами, а не IP, які хтось колись записав.

  ## Продакшн-досвід

  Мультитенантність — місце, де Caddy заробляє собі місце: домени клінік резолвлять в один фронтенд VetSpace, а роутер мапить хост на тенанта без правки конфіга на кожну реєстрацію. Порівняно з nginx-конфігами, які я підтримував раніше, Caddyfile читається як документація наміру, а не як ритуал.

  ## Caddy vs nginx у моєму стеку

  nginx ще живе в легасі-кутках, але новий роутинг іде в Caddy — автоматичний TLS сам по собі прибирає цілий клас операційних задач, а поверхня конфіга достатньо мала, щоб переглянути її одним поглядом під час інциденту.
