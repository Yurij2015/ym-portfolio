content: |
  Tailwind CSS стилізує кожен інтерфейс, який я випустив за останні роки — адмін-панелі, SSR-каталоги й це портфоліо. Утилітарні класи тримають стилі локально в компоненті, а мертвий CSS — близько нуля.

  ## Як я використовую Tailwind

  - **Інтерфейси SaaS** — панель VetSpace і портал VetCard: адаптивні макети, компоненти з dark mode і теми під кожну клініку від одного кольорового токена.
  - **Це портфоліо** — Tailwind v4 через Vite-плагін поверх Nuxt UI: без конфіг-файла, тема в CSS, компоненти лишаються композованими.
  - **Теми адмінки** — Inertia-адмінка DigiSpace використовує Tailwind для бек-офісного UI поруч із публічною Blade-темою.
  - **Брендинг тенантів** — VetCard темізує сторінку кожної клініки з одного поля `color` — CSS-змінні плюс утиліти виграють у окремої таблиці стилів на тенанта.

  ## Продакшн-досвід

  Практичний виграш — підтримка: стиль живе в шаблоні поруч із розміткою, на яку впливає, тож зміна картки не може тихо зламати сторінку за три маршрути звідси. У парі з Nuxt UI як базою примітивів Tailwind покриває все — від маркетингової сторінки до букінг-флоу — без перемикання контексту.

  ## Utility-first без хаосу

  Правило, що тримає Tailwind здоровим: виноси компонент, коли той самий рядок утиліт з'явився утретє, — не раніше. Фреймворк найкращий, коли дублювання, яке він прибирає, реальне, а не передбачене.
