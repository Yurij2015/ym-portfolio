content: |
  Tailwind CSS — CSS-фреймворк із готовими утилітарними класами. Я використовую його для інтерфейсів застосунків і публічних сайтів, зокрема VetCard, VetSpace, DigiSpace та цього портфоліо.

  ## Стилізація на практиці

  У VetCard спільні компоненти задають структуру сторінок, а індивідуальні кольори зберігають впізнаваність клінік. У портфоліо Tailwind CSS v4 працює разом із Nuxt UI, а параметри теми визначено в CSS. DigiSpace також використовує Tailwind в адміністративному інтерфейсі.

  ## Як підтримувати узгоджений вигляд

  - **Адаптивні макети** — навігація, форми й картки для різних розмірів екрана.
  - **Спільні параметри дизайну** — кольори та відступи, узгоджені між компонентами.
  - **Повторне використання** — винесення схожих елементів у компоненти, коли вони мають спільне призначення.

  ## Чого не гарантують утилітарні класи

  Класи поряд із розміткою полегшують читання стилів, але зміни спільних компонентів чи теми можуть зачепити багато сторінок. Розмір CSS залежить від знайдених класів і власних стилів. Мобільний вигляд, фокус клавіатури та контраст кольорів потрібно перевіряти окремо — фреймворк не робить цього автоматично.
