content: |
  Symfony стоїть за моєю основною комерційною роботою — високонавантажена тікетинг-платформа, що продає місця на події Formula 1, MotoGP, EICMA та EuroLeague. Enterprise-масштаб, довгий життєвий цикл, нульова толерантність до неохайного коду.

  ## Як я використовую Symfony

  - **Checkout і платежі** — потік покупки: кошик, вибір місць, платіжні провайдери Stripe/Dalenys, підтвердження замовлення та доставка квитків.
  - **Облікові записи** — реєстрація, профілі, історія замовлень для тисяч відвідувачів подій.
  - **Адмін-дашборди** — внутрішні інструменти керування подіями, інвентарем і замовленнями.
  - **Інтеграції** — 3D seat-map рішення та сторонні API, вбудовані в шлях покупки.

  ## Продакшн-досвід

  Тікетинг — навантаження, де спайк і є сенс: тисячі одночасних покупців у момент відкриття продажів, і кожен запит б'є по інвентарю, який не має права oversell. Ця платформа навчила дисципліни, що переноситься на все інше: захисна обробка платежів, обережне кешування, читабельний код, який наступний розробник може безпечно змінювати під тиском.

  ## Symfony vs Laravel у моїй роботі

  Symfony пасує платформам, які живуть роками зі строгими конвенціями та явною архітектурою — тікетинг саме такий. Laravel виграє на швидкості продуктової ітерації. Обидва в моєму продакшні — вибираю за життєвим циклом проєкту, а не за вподобанням.
faq:
  - label: Якого масштабу Symfony-проєкти у вашому досвіді?
    content: Продакшн тікетинг-платформа для подій Formula 1, MotoGP, EICMA та EuroLeague — checkout, платежі й адмінка під реальними піковими навантаженнями.
  - label: Чи підхоплюєте існуючі Symfony-кодові бази?
    content: Так — це основа мого досвіду. Починаю з аудиту, стабілізую тестами там, де це важливо, далі розширюю фічі без зриву релізного циклу.
