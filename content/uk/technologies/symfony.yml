content: |
  Symfony — PHP-фреймворк, який я використовую в комерційній роботі над платформою продажу квитків на Formula 1, MotoGP, EICMA та EuroLeague. Працюю як із процесом покупки, так і з внутрішніми адміністративними інструментами.

  ## Над чим я працюю

  - **Оформлення замовлення** — кошик, вибір місць, підтвердження покупки й доставка квитків.
  - **Платежі** — інтеграції зі Stripe, Dalenys та іншими сервісами.
  - **Облікові записи й адміністрування** — профілі, історія замовлень, керування подіями та продажами.
  - **Зовнішні сервіси** — схеми вибору місць і сторонні API в процесі покупки.

  ## Особливості продажу квитків

  На початку продажів платформа має витримати зміну попиту й зберегти узгодженість замовлень та доступних місць. Тому особливо важливі транзакції, стани платежів і обробка помилок. Швидка сторінка корисна лише тоді, коли покупець може коректно завершити замовлення.

  ## Symfony та Laravel у моїй роботі

  Я працюю з обома фреймворками. Вибір залежить від наявної архітектури, підходів команди й інтеграцій, а не від жорсткого поділу на великі та малі продукти. У наявному Symfony-застосунку зосереджуюся на змінах, які можна перевірити, протестувати та підтримувати в наступних випусках.
faq:
  - label: З якими Symfony-проєктами ви працювали?
    content: "Мій комерційний досвід включає платформу продажу квитків на Formula 1, MotoGP, EICMA та EuroLeague: оформлення замовлень, платіжні інтеграції та адміністративні інструменти."
  - label: Чи можете ви долучитися до наявного Symfony-застосунку?
    content: Так. Спочатку вивчаю архітектуру й процес випусків, потім визначаю зміни та тести, потрібні для безпечного розвитку застосунку.
