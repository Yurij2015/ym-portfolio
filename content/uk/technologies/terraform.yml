content: |
  Terraform керує тими частинами моєї інфраструктури, які раніше жили в чиїйсь пам'яті — контейнери, мережі й конфігурація деплою, описані кодом і застосовані з workspace-ом на кожне середовище.

  ## Як я використовую Terraform

  - **Контейнери на VM** — інфраструктура DigiPulse розгортає Docker-сервіси на Proxmox-VM через Docker-провайдер по SSH: без прив'язки до хмари, просто декларативні контейнери на власному залізі.
  - **Розділення середовищ** — workspace-и та per-env tfvars ізолюють testing і production; один plan формує обидва, відрізняються лише змінні.
  - **Дисципліна стану** — переглянуті plan-и перед apply, секрети поза var-файлами й поза git.

  ## Продакшн-досвід

  Конкретний виграш: додати сервіс до DigiPulse стало `terraform apply` замість «зайти по SSH і сподіватися». Середовища перестали роз'їжджатися, бо код і є середовище. Для інфраструктури на одну людину це різниця між «я пам'ятаю, як воно з'єднане» і «репозиторій каже, як воно з'єднане».

  ## Як далеко заходить IaC у соло-сетапі

  Terraform покриває провізіонування та розкладку сервісів; деплої застосунків ідуть через CI/CD. Межа навмисна — зміни інфраструктури рідкісні й переглядаються, деплої часті й автоматизовані. Змішувати їх — псувати обидва.
