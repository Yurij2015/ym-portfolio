content: |
  Nuxt — фреймворк для Vue-застосунків із маршрутизацією та серверним рендерингом. Я використовую його для публічного каталогу VetCard і цього портфоліо, де відвідувачі й пошукові системи мають отримувати вміст сторінки вже у відповіді сервера.

  ## Приклади з моїх проєктів

  VetCard поєднує сторінки клінік з інтерактивним записом на прийом. Один застосунок обслуговує кілька клінік, підтримує мовні версії та індивідуальні кольори оформлення. Це портфоліо використовує Nuxt Content для перекладених YAML-файлів і генерує зображення для соціальних мереж під час роботи сервера.

  ## Що входить у роботу над SEO

  Серверний рендеринг віддає HTML-контент без очікування на виконання JavaScript у браузері. Окремо я налаштовую метадані, канонічні адреси, мовні альтернативи й карту сайту. Це допомагає пошуковим системам знаходити та розуміти сторінки, але не гарантує індексації чи позицій. Пошукові системи можуть виконувати JavaScript, проте це додає етап обробки.

  ## Рендеринг і розгортання

  Nuxt підтримує різні режими рендерингу. Вибір залежить від сторінки: інтерактивність сама по собі не вимагає вимикати серверний рендеринг. У цьому портфоліо налаштовано серверний рендеринг та ISR-кешування Vercel для визначених маршрутів; попередню генерацію сторінок у виробничій збірці вимкнено.
faq:
  - label: Навіщо використовувати Nuxt для публічного сайту?
    content: Серверний рендеринг робить контент доступним у початковій HTML-відповіді. Nuxt також дає інструменти маршрутизації та метаданих. Сайти на JavaScript можуть індексуватися, але серверний рендеринг зменшує залежність від виконання коду пошуковим роботом.
  - label: Яку версію Nuxt ви використовуєте?
    content: Це портфоліо й VetCard працюють на Nuxt 4. У портфоліо також є Nuxt Content, Nuxt Image, локалізація та генерування зображень для соціальних мереж під час роботи сервера. Набір модулів залежить від проєкту.
