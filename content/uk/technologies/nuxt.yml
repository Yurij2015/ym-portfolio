content: |
  Nuxt — мій спосіб будувати Vue-застосунки, які мають ранжуватися в пошуку: серверний рендеринг, маршрутизація по локалях, структурований контент і готовий до деплою вивід в одному фреймворку. Це портфоліо — застосунок на Nuxt 4; так само і публічний каталог VetCard.

  ## Як я використовую Nuxt

  - **SEO-перші публічні сайти** — каталог клінік VetCard рендериться на сервері з локалізованими URL, sitemap, hreflang і JSON-LD — це сторінки, що приводять клієнтів.
  - **Мультитенантний рендеринг** — один деплой VetCard обслуговує багато клінік: маршрутизація за слагом і теми під кожного тенанта.
  - **Контент-керовані сторінки** — це портфоліо працює на Nuxt Content із Zod-валідованими YAML для кожної локалі й OG-зображеннями, що генеруються в рантаймі.
  - **Гібридний рендеринг** — SSR для індексованих сторінок, `ssr: false` для клієнтських флоу на кшталт календаря букінгу — за маршрутом, а не застосунком.

  ## Продакшн-досвід

  Nuxt окупається там, де важливий органічний трафік. VetCard існує, щоб його знаходили в пошуку — кожна сторінка клініки відрендерена сервером, локалізована й розмічена, тоді як букінг лишається клієнтським, щоб уникнути проблем гідратації. Та сама дисципліна на цьому сайті: sitemap згенерований з контенту, canonical/hreflang на кожному маршруті, ISR-кеш на Vercel. Коли сторінка має і ранжуватися, і поводитися як застосунок — Nuxt найкоротший шлях із відомих мені.
faq:
  - label: Чому Nuxt, а не просто Vue SPA?
    content: SEO і перший рендер. SPA не може надійно ранжувати каталог чи контентну сторінку; Nuxt дає SSR, per-route правила рендерингу й контроль метаданих — а SPA-модель лишається там, де індексація не потрібна.
  - label: Яку версію Nuxt ви використовуєте?
    content: Nuxt 4 у продакшні — це портфоліо і VetCard працюють на ньому, з Nuxt Content, Nuxt Image, i18n та рантайм-генерацією OG-зображень.
