content: |
  GitHub Actions запускає автоматизовані процеси з репозиторію GitHub. Я використовую його для перевірки змін і автоматизації випусків, зберігаючи опис процесу поряд із кодом застосунку.

  ## Що перевіряється в цьому портфоліо

  Після надсилання змін у репозиторій запускаються ESLint, перевірка типів TypeScript, модульні тести, виробнича збірка та браузерні тести Playwright. Вони перевіряють різні речі: узгодженість коду, типові помилки, поведінку застосунку й роботу зібраного сайту.

  ## CI та розгортання — окремі процеси

  Це портфоліо розгортається через Git-інтеграцію Vercel. Невдала перевірка GitHub Actions сама по собі не блокує розгортання чи злиття змін: обов'язкові перевірки й умови випуску налаштовуються окремо. Наявність тестів у процесі CI ще не означає, що вони є умовою публікації.

  ## Мій підхід до автоматизації

  У Laravel-проєктах, зокрема DigiSpace, автоматичні тести допомагають перевіряти зміни перед випуском. Швидкі перевірки ставлю на початку, щоб раніше отримати зрозумілу помилку. Для розгортання також потрібні контроль доступу, корисні журнали й план відновлення.
