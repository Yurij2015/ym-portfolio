content: |
  GitHub Actions — пайплайн за кожним моїм пушем: lint, typecheck, юніт-тести, збірка й деплой автоматизовані так, що відправка змін — це git-операція, а не чеклист.

  ## Як я використовую GitHub Actions

  - **Повні CI-брами** — це портфоліо проганяє ESLint, vue-tsc, Vitest і 15 Playwright-спек на кожен пуш; червоний чек блокує мердж.
  - **Деплой-пайплайни** — платформа DigiSpace деплоїться по SSH з пуша: збірка на CI, PHPUnit-сьюта як брама, релизи через symlink із healthcheck-ами й зберіганням п'яти релізів для ролбека.
  - **Контентні й образні джоби** — scheduled і on-push воркфлоу тримають згенеровані артефакти та оновлення залежностей у русі без ручних запусків.

  ## Продакшн-досвід

  Дисципліна, що має значення: тести біжать у пайплайні, а не на чиємусь ноутбуці, де їх можна пропустити. Коли захардкоджена кількість проєктів зламала мій E2E-сьют після додавання двох нових, CI спіймав те, що локальні прогони пропустили, — пайплайн відпрацював своє найбуквальнішим чином.

  ## CI, що окупає свої хвилини

  Швидкий фідбек замість вичерпної церемонії: спочатку lint і typecheck (секунди), далі юніт-тести, E2E наприкінці. Швидке падіння тримає пайплайн чесним — сьют на двадцять хвилин ігнорують; той, що падає за дві, — латають.
