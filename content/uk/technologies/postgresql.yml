content: |
  PostgreSQL — моя реляційна база за замовчуванням для SaaS: рушій за мультитенантними схемами, моніторинговими часовими рядами й усім, де цілісність даних важливіша за зручність.

  ## Як я використовую PostgreSQL

  - **Мультитенантні дані** — DigiPulse зберігає монітори, результати перевірок та інциденти в Postgres; тенантні бази VetSpace працюють на тому самому рушії — окрема ізольована база на кожну клініку.
  - **Навантаження типу time-series** — результати перевірок доступності пишуться потоком: індекси по монітору й часу, агрегації для uptime-звітів без окремої TSDB.
  - **Транзакційна цілісність** — букінг і білінг, де частковий запис гірший за відмову.
  - **JSONB там, де пасує** — гнучкі колонки для вебхуків і відповідей провайдерів, з запитами без виходу з реляційної моделі.

  ## Продакшн-досвід

  Postgres заробляє на буденних гарантіях: констрейнти тримають, індекси поводяться передбачувано, а EXPLAIN справді пояснює. Для патерну «база на тенанта» це практичний вибір — ізоляція на рівні клініки, прямолінійний GDPR-експорт/видалення і жодного екзотичного інструментарію між мною та даними.

  ## PostgreSQL vs MySQL у моєму стеку

  Postgres — коли продукт мій і модель даних нетривіальна: JSONB, CTE й строгіша типізація окупаються. MySQL — коли екосистема вже говорить ним (WordPress, частина Laravel-спадщини). Обидві живуть у моїй інфраструктурі; вибір іде за проєктом, не за вподобанням.
