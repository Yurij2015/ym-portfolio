content: |
  PHP — моя основна мова серверної розробки. Маю понад вісім років комерційного досвіду з Laravel, Symfony та WordPress, коли він відповідає завданню. Зараз працюю з PHP 8.x; попередній досвід також охоплює старіші версії мови.

  ## Де я використовую PHP

  На Laravel працюють VetSpace, DigiPulse та NetPostPanel. Комерційна робота із Symfony охоплює платформу продажу квитків на події Formula 1, MotoGP, EICMA та EuroLeague. Мої завдання включають оформлення замовлень, облікові записи, адміністративні інструменти й зовнішні інтеграції.

  ## На чому зосереджуюся

  - **Бізнес-логіка** — зрозумілі процеси для записів, підписок і замовлень.
  - **API та платежі** — перевірка даних, авторизація й надійна обробка відповідей зовнішніх сервісів.
  - **Підтримка** — автоматичні тести та статичний аналіз для розвитку наявного коду.

  ## Вибір середовища виконання

  PHP-FPM підходить для звичайної обробки запитів. Процеси тривалої роботи, зокрема Octane із FrankenPHP, потребують іншого підходу до стану й пам'яті. Я обираю середовище під застосунок і перевіряю результат на характерному навантаженні. Сама мова чи фреймворк не гарантує швидкодії.
faq:
  - label: З якими версіями PHP ви працюєте?
    content: Зараз працюю з PHP 8.x. Під час оновлення старішого застосунку перевіряю вимоги фреймворку й залежностей та тестую поведінку, на яку впливає зміна версії.
  - label: Як ви обираєте між Laravel і Symfony?
    content: "Враховую наявний код, досвід команди, інтеграції та вимоги до підтримки. Обидва підходять для тривалого розвитку: Laravel використовую у власних SaaS, а Symfony — у комерційній платформі продажу квитків."
