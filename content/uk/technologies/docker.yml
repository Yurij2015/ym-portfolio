content: |
  Docker — спосіб, у який пакується все, що я запускаю: той самий образ на ноутбуці розробника, в CI та на продакшн-VM. Кожен проєкт має compose-файл, що перетворює «у мене працює» на нетему.

  ## Як я використовую Docker

  - **Продакшн-сервіси** — мої SaaS-проєкти працюють контейнерами на Proxmox-VM: застосунок, воркер, планувальник і база описані в compose, а CI підтягує й рестартує їх.
  - **Паритет середовищ** — локальні оточення дзеркалять продакшн-сервіси, тож баг відтворюється локально, а не лише під реальним трафіком.
  - **Multi-stage збірки** — легкі рантайм-образи: залежності й інструменти збірки лишаються в builder-стадії, продакшн-образ несе тільки те, що обслуговує запити.
  - **CI-пайплайни** — збірки й тести працюють у контейнерах на GitHub Actions: середовище CI — це репозиторій, а не сніжно-примарний раннер.

  ## Продакшн-досвід

  Операційний виграш проявився при переїзді з флоту дроплетів DigitalOcean на один сервер Hetzner: сервіси, що вже були контейнерами, переїхали як образи й compose-файли — міграція зайняла день, а не редизайн архітектури. Ця портативність і є весь аргумент на користь Docker для інфраструктури, що обслуговується соло.

  ## Docker без церемоній

  Один compose-файл на середовище, образи збираються в CI, healthcheck-и стоять на варті рестартів. Жодного оркестратора для жменьки VM — бюджет складності йде в продукт, а не в Kubernetes заради моди.
faq:
  - label: Docker Compose чи Kubernetes?
    content: Compose на VM для власних продуктів — жменька сервісів не виправдовує control plane. До Kubernetes дійду, коли навантаження реально потребуватиме розкладки по вузлах.
