content: |
  Docker пакує застосунок і його залежності в контейнерний образ. Я використовую його для Laravel- і Node.js-сервісів у DigiPulse, VetSpace та NetPostPanel — від локальної розробки до розгортання на віртуальних машинах.

  ## Як я організовую контейнери

  - **Docker Compose** — спільний опис застосунку, фонових обробників і допоміжних сервісів.
  - **Багатоетапні збірки** — відокремлення інструментів збірки від кінцевого образу для запуску.
  - **Постійне сховище** — зберігання файлів бази даних і завантажень поза контейнерами, які можна замінити.

  ## Що дає переносність

  Контейнери допомогли мені змінити провайдера хостингу без відтворення середовища застосунків із нуля. Проте на поведінку системи також впливають налаштування, архітектура процесора, мережа й дані. Сам факт використання Docker не гарантує, що виробнича помилка відтвориться локально.

  ## Перевірка стану та відновлення

  Health check показує стан контейнера. Політики перезапуску Docker реагують на завершення процесу; статус unhealthy сам по собі не запускає контейнер повторно. Цю різницю потрібно враховувати під час розгортання, особливо для фонових обробників і баз даних, де важливо зберегти незавершену роботу.
faq:
  - label: Коли ви обираєте Docker Compose замість Kubernetes?
    content: Використовую Compose для сервісів на окремих віртуальних машинах. Kubernetes розглядаю, коли проєкту потрібен розподіл завдань між вузлами й є ресурси для підтримки кластера.
