content: |
  Vite — шар збірки під кожним фронтендом, який я відправляю: миттєвий HMR у розробці та Rollup-бандли у продакшні — і всередині Nuxt, і як офіційний фронтенд-інструментарій Laravel.

  ## Як я використовую Vite

  - **Усередині Nuxt** — VetCard і це портфоліо збираються через Vite під капотом; Tailwind v4 під'єднаний як Vite-плагін.
  - **Laravel + Inertia** — адмінка DigiSpace збирається через `laravel-vite-plugin`: HMR проти працюючого бекенду, версійовані ассети на деплої.
  - **Бандли застосунків і бібліотек** — code-splitting точок входу, хешування ассетів і сучасний ESM-вивід без конфігурації епохи webpack.

  ## Продакшн-досвід

  Внесок Vite здебільшого непомітний — і в цьому сенс. Дев-сервери стартують за мілісекунди, правки відображаються раніше, ніж я дотягуюся до браузера, а продакшн-збірки малі й передбачувані. Єдиний випадок, коли я згадую про бандлер, — коли не використовую Vite.

  ## Що замінило що

  Vite витіснив webpack/Laravel Mix у всіх моїх проєктах. Міграція окупилася вже на часі циклу розробки; чистіший ESM-вивід і простіший конфіг стали бонусом. Кожен новий проєкт стартує на Vite за замовчуванням.
