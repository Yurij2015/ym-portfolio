content: |
  Vite — інструмент розробки та збірки фронтенду. Я використовую його через Nuxt у VetCard і цьому портфоліо, а також через інтеграцію з Laravel у DigiSpace.

  ## Під час розробки

  Сервер розробки підтримує гарячу заміну модулів — HMR. Завдяки цьому багато змін можна побачити без повного перезавантаження сторінки. Фактична швидкість залежить від проєкту, плагінів і комп'ютера, тому миттєве оновлення не є безумовною гарантією.

  ## Підготовка до розгортання

  Збірка готує файли фронтенду, зокрема назви з хешами й поділ коду на частини за відповідної конфігурації. Nuxt і Laravel додають власну інтеграцію навколо результату. Внутрішній збирач залежить від версії Vite, тому під час зміни налаштувань потрібно звірятися з установленими версіями інструментів.

  ## Що я перевіряю після збірки

  Успішна збірка ще не доводить, що всі сторінки працюють. Адреси файлів, змінні середовища, серверний рендеринг і поведінку браузера потрібно перевіряти в цільовому середовищі. Vite є частиною процесу випуску; браузерні тести й перевірки запущеного сайту охоплюють те, чого компіляція не перевіряє.
