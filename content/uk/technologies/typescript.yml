content: |
  TypeScript — стандарт для кожного фронтенду, який я будую: перевірка, що ловить дрейф API та невідповідності пропсів на етапі компіляції, а не в браузері клієнта.

  ## Як я використовую TypeScript

  - **Типізовані Nuxt-застосунки** — VetCard і це портфоліо на строгому TypeScript: типізовані відповіді API, сигнатури композаблів і схеми контенту.
  - **Контрактна безпека** — типи клінік, записів і букінгу, спільні для всієї кодової бази VetCard, тримають мультитенантний API чесним.
  - **Валідований схемами контент** — цей сайт валідує кожен YAML-файл контенту через Zod: відсутнє поле ламає збірку, а не сторінку.
  - **Інструментарій** — `vue-tsc` у CI поруч із lint і юніт-тестами; червоний typecheck блокує деплой так само, як впавший тест.

  ## Продакшн-досвід

  Цінність проявляється під час підтримки. Коли API VetSpace додав поле, помилка типу показала всіх фронтенд-споживачів за один прогін — без grep і без сюрпризів у рантаймі. У продукті, який підтримує одна людина, ця дисципліна — те, що не дає кодовій базі стати легасі, якого ніхто не хоче торкатися.

  ## Строгість, що окупається

  Тримаю `strict` увімкненим і чиню опір `any` — сенс не в чистоті, а в тому, що через рік компілятор досі пам'ятає контракт, який я забув. Типізовані межі між API, станом і шаблоном — різниця між рефакторингом і переписуванням.
