content: |
  TypeScript додає статичну перевірку типів до JavaScript. Я використовую його у Vue- і Nuxt-застосунках, зокрема VetCard та цьому портфоліо, щоб інтерфейси компонентів і моделі даних було простіше розуміти та змінювати.

  ## Що я типізую

  - **Компоненти** — вхідні параметри, події та спільний стан.
  - **Моделі API** — очікувану структуру даних клінік і записів на прийом.
  - **Повторно використовувану логіку** — параметри та результати composable-функцій.

  У цьому репозиторії також є перевірка типів у CI та схеми перекладеного контенту. Вони доповнюють одна одну, але виконують різні завдання.

  ## Де закінчується статична перевірка

  Типи TypeScript видаляються зі згенерованого JavaScript. Анотація типу не перевіряє фактичну відповідь API. Для зовнішніх даних потрібна перевірка під час виконання, а неузгоджена зміна бекенду не з'явиться автоматично як помилка компілятора.

  ## Зручніша підтримка

  Коли змінюється оголошена модель, перевірка типів може показати несумісні місця в коді. Це допомагає послідовно оновити форми й шаблони. Типізація доповнює тести та перевірку введених даних, а не усуває потребу в них.
