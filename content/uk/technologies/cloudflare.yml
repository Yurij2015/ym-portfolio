content: |
  Cloudflare стоїть на краю кожного мого публічного продукту — digipulse.cloud, vetcard.pro і vetspace.pro усі на ньому. DNS, CDN-кеш і захист від ботів поглинають ворожі частини інтернету до того, як вони досягнуть моїх серверів.

  ## Як я використовую Cloudflare

  - **DNS і CDN** — усі три продуктові домени на неймсерверах Cloudflare з проксі-кешем статики: edge-вузли віддають файли ближче до відвідувачів, ніж може мій єдиний сервер.
  - **Turnstile проти ботів** — букінг-флоу VetCard використовує Turnstile, щоб автоматичний спам не потрапляв у пайплайн записів — і без captcha-головоломок для реальних користувачів.
  - **TLS на краю** — сертифікати й сучасна TLS-термінація на edge з origin, замкненим на IP-діапазони Cloudflare.

  ## Продакшн-досвід

  Форма букінгу — чесний тест: публічний ендпоінт, що приймає записи, — магніт для спаму, і Turnstile відсіює автоматичні відправки без тертя, яке коштує реальних записів. Тим часом CDN тихо обслуговує ассети всіх трьох доменів з edge-кешів — інфраструктурний виграш, непомітний, доки не глянеш на трафік origin-а, і дашборд-аналітика, що показує тисячі унікальних відвідувачів на місяць, яких мій origin майже не відчуває.

  ## Edge-захист без enterprise-рахунку

  Безкоштовний тариф Cloudflare покриває DNS, CDN і Turnstile — відчутний захист для bootstrap-SaaS без інвойсу за WAF. Платні функції існують на випадок, коли трафік їх виправдає; безкоштовний шар поки ніс усе.
