content: |
  Cloudflare надає DNS, мережу доставки контенту та засоби захисту сайтів. Я використовую ці можливості для публічних SaaS-продуктів: налаштовую домени, кешування статичних файлів і захист форм від автоматичних надсилань.

  ## Де я використовую Cloudflare

  VetCard, VetSpace і DigiPulse поєднують публічні сторінки з функціями застосунку. Для них потрібні різні правила кешування: зображення можна віддавати зі спільного кешу, а дані запису на прийом чи облікового запису мають залишатися приватними. DigiPulse також використовує Turnstile у публічних формах.

  ## Кешування та захист форм

  - **Статичні файли** — кешування зображень, стилів і скриптів ближче до відвідувачів.
  - **Персональні дані** — виключення відповідей із приватною інформацією зі спільного кешу.
  - **Turnstile** — перевірка отриманого токена на сервері; самого віджета в браузері недостатньо.

  ## Що залишається на стороні застосунку

  Cloudflare доповнює перевірку введених даних, авторизацію й обмеження частоти запитів. Правила кешування та захищене з'єднання з основним сервером залишаються частиною налаштування інфраструктури. Доступні функції захисту й ліміти залежать від обраних сервісів і тарифу.
