content: |
  Proxmox — шар віртуалізації на моєму виділеному сервері: кожне навантаження отримує власну VM чи контейнер — ізольоване, зі снапшотами й одноразове, замість одного монолітного хоста на всіх.

  ## Як я використовую Proxmox

  - **VM під кожне навантаження** — продакшн-сервіси SaaS, стейджинг і внутрішні інструменти живуть у власних VM на Hetzner-машині.
  - **Снапшоти як страхівка** — знімки перед апгрейдами й міграціями перетворюють ризиковані операції на оборотні.
  - **Ресурсні межі** — ліміти CPU й пам'яті на VM не дають процесу в одному продукті з'їсти ресурси сусідів.
  - **Шаблони** — базові образи з Docker, агентами й харденінгом усередині, тож нове середовище — справа хвилин.

  ## Продакшн-досвід

  Proxmox — те, що робить «один сервер, багато продуктів» здоровим. Ізоляція на рівні VM дзеркалить database-per-tenant патерн у самих застосунках — та сама філософія на двох шарах. Коли VM падає чи апгрейд іде не так, лікування — відновлення зі снапшота, а не вікенд-ребілд. Цей запас безпеки — причина, чому я можу тримати продакшн-SaaS сам, без pager-команди.

  ## Чому не просто Docker на хості

  Контейнери ділять ядро й радіус ураження. Межі VM дають гарантії ресурсів на навантаження, незалежні ядра там, де треба, і чисте розділення між сервісами різних продуктів — це варте невеликого оверхеду заради спокійного продакшну.
