content: |
  Proxmox VE — платформа віртуалізації, яку я використовую на орендованому сервері Hetzner. Вона дає змогу керувати окремими середовищами для SaaS-застосунків і допоміжних сервісів, зокрема інфраструктурою DigiPulse.

  ## Як я організовую середовища

  Віртуальні машини мають окремі операційні системи та налаштування виділених ресурсів. Усередині них Docker запускає сервіси застосунку. Так зручніше оновлювати й діагностувати кожне середовище, ніж установлювати всі сервіси безпосередньо на фізичний сервер.

  ## Знімки стану та резервні копії

  Знімок стану може допомогти скасувати зміну залежно від сховища та стану застосунку. Він не замінює незалежної резервної копії й не захищає від втрати дисків основного сервера. Під час відновлення також потрібно враховувати узгодженість бази даних і порядок запуску сервісів.

  ## Обмеження одного фізичного вузла

  Віртуальні машини спільно використовують фізичні ресурси й залежать від доступності сервера. Ліміти допомагають розподіляти навантаження, але несправність диска чи вузла може зачепити кілька застосунків. Тому розділення середовищ, відновлення з копій і відмовостійкість потребують окремих рішень.
