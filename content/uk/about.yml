title: Про мене
description: "Про мій шлях від науки й фриланс-проєктів до роботи з PHP, платформами продажу квитків і власними SaaS-продуктами."
content: |
  Привіт, я **Yurii Mokryi**, Full-Stack PHP Developer. Живу в Познані й працюю над вебзастосунками: від серверної логіки та інтерфейсів до розгортання й подальшої підтримки.

  У 2010 році я працював науковим співробітником у науковій установі й створив свій [перший сайт](/about/first-website). Згодом зробив на WordPress сайт для своєї фриланс-діяльності; тоді ж уперше зіткнувся з PHP. З 2021 року працюю над застосунками в комерційних командах. Наукова робота залишила звичку перевіряти припущення: з’ясовувати, що відомо про проблему, і шукати спосіб перевірити можливе пояснення.

  ## Над чим працюю

  У клієнтських проєктах займаюся платформами продажу квитків на Symfony: оформленням замовлень, кабінетами користувачів, адміністративними інструментами та оплатами через Stripe і Dalenys. Працюю з Doctrine, MySQL, Redis і чергами, а інтерфейси розробляю на Vue.js.

  Паралельно розвиваю власні продукти в межах DigiSpace. VetSpace — це CRM для ветеринарних клінік, VetCard — їхні публічні сторінки й онлайн-запис. У DigiPulse працюю над моніторингом доступності сайтів, а в NetPostPanel — над пошуком джерел і підготовкою контенту за допомогою AI.

  Для цих продуктів використовую Laravel, Filament, Vue та Nuxt. Частину задач виконують окремі сервіси на Go. Зокрема, у DigiPulse такий сервіс перевіряє доступність сайтів, тоді як Laravel відповідає за керування моніторами й сповіщеннями.

  ## Від розробки до підтримки

  У власних продуктах займаюся також середовищами, розгортанням і роботою сервісів після запуску. Застосунки працюють у Docker, віртуальні машини налаштовую через Proxmox, а для проксування запитів використовую Caddy. У DigiPulse частина інфраструктури описана в Terraform, випуски автоматизовані через GitHub Actions.

  Ця робота пов’язана з розробкою щодня: після зміни коду потрібно врахувати міграції даних, фонові процеси й налаштування середовища. Тому, беручись за наявний застосунок, знайомлюся також із тим, як його запускають, перевіряють і оновлюють.

  ## Поза роботою

  Люблю відкривати нові місця, відвідувати кав’ярні Познані й подорожувати поїздом та літаком. З дітьми ходжу в кіно й ресторани. Також стежу за розвитком AI і хмарних технологій. Частину коду власних проєктів публікую на [GitHub](https://github.com/Yurij2015).

  Приклади роботи й технічні деталі зібрані в [проєктах](/projects). Якщо хочете обговорити свій застосунок, [напишіть мені](https://t.me/YuriiMokryi) й розкажіть, над чим працюєте.
