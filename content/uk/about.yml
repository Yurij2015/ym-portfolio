title: Про мене
description: Про мій досвід розробки на PHP, роботу над платформами продажу квитків і власними SaaS-продуктами.
content: |
  Привіт, я **Yurii Mokryi**, Senior Full-Stack PHP Developer з Познані, Польща. Маю 8+ років комерційної розробки: створюю та підтримую SaaS-продукти, CRM-системи, ticketing/e-commerce платформи та REST API.

  Основна робота — full-stack розробка високонавантаженої ticketing-платформи для великих спортивних подій (Formula 1, MotoGP, EICMA, EuroLeague): checkout, облік користувачів, адмін-дашборди, інтеграція Stripe/Dalenys та 3D seat-map рішень. Паралельно як засновник DigiSpace будую власні SaaS-продукти — DigiPulse (моніторинг доступності) та VetSpace (CRM для ветклінік).

  ## Мій стек

  На бекенді працюю з **Laravel** (Filament, Octane, FrankenPHP) та **Symfony**, на фронтенді — з Vue.js і Nuxt. У SaaS-проєктах займаюся розділенням даних клієнтів, підписками й інтеграціями зі Stripe, Revolut, Dalenys та іншими API. Для розгортання й підтримки використовую Linux/SSH, Docker, Caddy, CI/CD, Proxmox і Terraform.

  ## Як я працюю

  До розробки я кілька років працював у науці. Звідти залишилася звичка перевіряти припущення: спочатку з’ясувати, що відомо про проблему, потім обрати спосіб перевірки й зробити висновки. У роботі над застосунком починаю з того, що потрібно користувачу та як це працює зараз. Після цього пропоную зміни й узгоджую, як перевіримо їхній результат.

  ## За межами екрану

  Поза роботою люблю відкривати кав’ярні Познані, стежу за AI та хмарними технологіями й долучаюся до open-source проєктів.

  Якщо шукаєте розробника для нового чи наявного продукту, [розкажіть про задачу](https://t.me/YuriiMokryi). Обговоримо, що потрібно зробити та які матеріали знадобляться для оцінки. Приклади моєї роботи є в розділі [проєктів](/projects).
