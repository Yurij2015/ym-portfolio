title: "Перший сайт: як почався мій шлях у програмуванні"
description: У 2010 році я створив свій перший сайт на HTML. Згодом зробив сайт для своєї фриланс-діяльності на WordPress і вперше зіткнувся з PHP.
seo:
  title: Мій перший сайт на HTML у 2010 році — Yurii Mokryi
  description: Як перший сайт на HTML, фриланс-проєкт на WordPress і перше знайомство з PHP привели мене до веброзробки.
content: |
  Свій перший сайт я створив у 2010 році. Тоді веброзробка була для мене зовсім новою: я працював науковим співробітником у ветеринарній науковій установі, а моя освіта не була пов’язана з програмуванням.

  Усе здавалося новим, дивним і майже магічним. Я зібрав перший сайт на HTML — здається, тоді це була версія HTML4, хоча самі цифри для мене нічого не означали. Побачити текст на екрані вже було дивовижно. Це був навчальний проєкт, але мене швидко захопив сам процес.

  Наступним кроком став сайт для моєї фриланс-діяльності, яка тоді приносила додатковий дохід. Я зробив його на WordPress за уроками, які знаходив в інтернеті. Так я вперше зіткнувся з PHP — не вивчаючи мову напряму, а користуючись платформою, створеною на її основі.

  Світ програмування затягував мене дедалі сильніше. Так почався мій шлях у розробці: від перших HTML-сторінок і WordPress до вебзастосунків, над якими я працюю сьогодні.
