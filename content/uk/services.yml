indexable: false
title: Розробка й підтримка PHP-проєктів на Laravel і Symfony
description: "Розробка на Laravel і Symfony та підтримка наявних PHP-проєктів: оновлення, аудит, стабілізація. Для кожної послуги описано обсяг робіт, процес і ціну."
intro: "Додаю нові можливості до PHP-застосунків і допомагаю підтримувати ті, що вже працюють. Якщо потрібен новий продукт, модуль чи інтеграція, почніть із розділу розробки. Якщо потрібно виправити помилку, оновити залежності, розібратися зі швидкодією або організувати регулярний супровід, перегляньте підтримку. Ціни «від» стосуються описаного обсягу робіт; для невеликих задач можна обговорити погодинну роботу за ставкою від $35/год. Остаточну ставку обговорюємо з урахуванням складності задач, стану проєкту та формату співпраці."
