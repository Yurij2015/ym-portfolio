indexable: false
title: Розробка й підтримка PHP-проєктів на Laravel і Symfony
description: "Розробка на Laravel і Symfony та підтримка наявних PHP-проєктів: оновлення, аудит, стабілізація. Для кожної послуги описано обсяг робіт, процес і ціну."
intro: "Працюю у двох напрямах. У розробці це нові застосунки, SaaS, API, адмін-панелі та інтеграції на Laravel, Symfony чи PHP. У підтримці це робота з наявним кодом: оновлення версій, аудит, стабілізація, швидкодія та регулярний супровід. На сторінці кожної послуги написано, що я роблю, що ви отримуєте і від якої суми починається оцінка."
