    label: Розробка
    title: Розробка на PHP, Laravel і Symfony
    description: "Розробка застосунків на Laravel, Symfony та PHP: SaaS, API, адмін-панелі, платежі, AI-функції, фронтенд на Vue і Nuxt. Обсяг робіт, процес і ціни."
    intro: "Тут можна обрати розробку нового застосунку або нової функції в наявному продукті: кабінету, звіту, API, інтеграції чи підписок. Можу працювати над окремим модулем або долучитися до вашої команди. Якщо задача полягає у виправленні помилок, оновленні версій чи регулярному супроводі, перегляньте підтримку. Невеликі доопрацювання можна обговорити в погодинному форматі від $35/год. Ставку уточнюємо після обговорення функцій, наявного коду й тривалості співпраці."
