title: My first website in 2010
description: How my first website in HTML led to a WordPress site for my freelance work and my first contact with PHP.
seo:
  title: My First Website in HTML, 2010 — Yurii Mokryi
  description: I built my first website in HTML in 2010, then made a WordPress site for my freelance business and encountered PHP for the first time.
content: |
  I built my very first website in 2010. At the time, web development was completely new to me. I was working as a researcher at a veterinary science institute, and my degree had nothing to do with programming.

  Everything in coding felt new, fascinating and a little magical. I put the site together in HTML. As I recall, it was HTML4, though those numbers meant nothing to me then; simply seeing text appear on the screen felt like magic. It was a learning project, and I quickly realized how absorbing the process was.

  My next step was a website to support my freelance business, which was bringing in some extra income at the time. I built it on WordPress, following tutorials I found online. That was my first contact with PHP—not by studying the language directly, but by using a platform built on it.

  The world of programming kept pulling me in. That was the beginning of my journey: from my first HTML pages and WordPress to the web applications I work on today.
