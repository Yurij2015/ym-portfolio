content: |
  Stripe provides payment and subscription services. I integrate it into VetSpace through Laravel Cashier and work with card payment flows in a commercial ticketing platform.

  ## Subscription and checkout workflows

  The work includes trial periods, plan changes, payment confirmation and failed-payment handling. Cashier provides Laravel integration, while Stripe settings and application rules determine the billing behavior. The customer interface also needs clear pending, successful and failed states.

  ## Handling webhook events

  A checkout redirect is not proof of payment. Webhook handlers must verify signatures, tolerate duplicate or out-of-order events and use the Stripe API when reconciliation is needed. An idempotent handler avoids applying the same business action twice.

  ## Keeping payment logic maintainable

  My experience also includes Dalenys and Revolut integrations. I keep provider-specific behavior separate from order and subscription workflows where practical. Different payment providers have different capabilities, so adding one still requires testing its status transitions and failure cases. The goal is a traceable payment flow that can be investigated when a customer reports a problem.
faq:
  - label: Can you add Stripe subscriptions to an existing Laravel application?
    content: Yes. The work includes Cashier integration, Stripe products and prices, webhook handling and tests for the subscription lifecycle. Trial periods and failed-payment behavior are configured to match the product.
  - label: Do you work with other payment providers?
    content: I also have experience with Dalenys and Revolut. Each integration needs its own checks for payment states, authentication requirements and failure handling.
