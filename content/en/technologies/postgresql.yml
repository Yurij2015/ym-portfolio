content: |
  PostgreSQL is a relational database with support for transactions, structured queries and JSON data. I use it in DigiPulse to store monitoring data that the application turns into status views and incident history.

  ## Working with monitoring records

  Availability checks create data over time. Queries need to find results for a particular monitor and date range without reading unnecessary rows. Index selection, retention and aggregation all affect how that workload grows. Execution plans help show where a query spends its effort.

  ## Tenant isolation needs a precise design

  A database per tenant and a schema per tenant are different architectures. PostgreSQL supports both, but schemas share a database and require appropriate permissions and query scoping. Neither arrangement alone guarantees compliance or prevents every cross-tenant access mistake.

  ## How I choose a database

  PostgreSQL's relational constraints and JSONB type are useful when structured records and flexible payloads belong in the same application. MySQL is also a practical choice for established Laravel and WordPress projects. I compare the actual queries, data model and maintenance requirements before choosing an engine.
