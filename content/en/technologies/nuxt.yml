content: |
  Nuxt is a framework for building Vue applications with routing and server rendering. I use it for VetCard's public clinic catalog and this portfolio, where visitors and search engines need access to page content at the initial request.

  ## Examples from my projects

  VetCard combines clinic pages with interactive appointment booking. One application serves multiple clinics, with localized routes and clinic-specific branding. This portfolio uses Nuxt Content for translated YAML content and generates social sharing images at runtime.

  ## What SEO work includes

  Server rendering provides HTML content without waiting for client-side JavaScript. I also configure page metadata, canonical URLs, language alternatives and sitemaps. These help discovery and interpretation; they do not guarantee indexing or search positions. Search engines can render JavaScript, but relying on that adds a rendering step.

  ## Rendering and deployment

  Nuxt supports different rendering strategies. I choose them around the page's content and interaction needs rather than disabling server rendering for every interactive feature. This portfolio uses server rendering with Vercel ISR caching on configured routes; its production prerendering is disabled.
faq:
  - label: Why use Nuxt for a public website?
    content: Server rendering makes page content available in the initial HTML response. Nuxt also provides routing and metadata tools. JavaScript sites can be indexed, but server rendering reduces reliance on a crawler executing client-side code.
  - label: Which Nuxt version do you use?
    content: This portfolio and VetCard use Nuxt 4. This portfolio also uses Nuxt Content, Nuxt Image, localization and runtime social image generation; the module selection differs by project.
