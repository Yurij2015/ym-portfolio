content: |
  Proxmox VE is a virtualization platform that I use on my rented Hetzner server. It lets me manage separate environments for SaaS applications and supporting services, including the infrastructure behind DigiPulse.

  ## How I organize environments

  Virtual machines provide separate operating systems and configurable resource allocations. Docker then runs application services inside those environments. This gives me a useful boundary for updates and troubleshooting without installing every service directly on the physical host.

  ## Snapshots and backups serve different purposes

  A snapshot can help roll back a change, depending on the storage setup and application state. It does not replace an independent backup or protect against losing the host's storage. Database consistency and the recovery process still need attention when restoring an environment.

  ## The limits of a single host

  Virtual machines share the server's physical capacity and availability. Limits help manage resource use, but disk or host failures can affect multiple applications. I treat workload separation, backup recovery and high availability as separate concerns when deciding how an environment should be hosted.
