content: |
  Proxmox is the virtualization layer on my dedicated server — every workload gets its own VM or container, isolated, snapshotted and disposable, instead of sharing one monolithic host.

  ## How I use Proxmox

  - **VM per workload** — production SaaS services, staging environments and internal tools each live in their own VM on the Hetzner box.
  - **Snapshots as safety nets** — pre-upgrade and pre-migration snapshots turn risky operations into reversible ones.
  - **Resource boundaries** — CPU and memory limits per VM keep a runaway process in one product from starving the others.
  - **Templates** — base images with Docker, agents and hardening baked in, so a new environment is minutes of work.

  ## Production experience

  Proxmox is what makes "one server, many products" sane. Tenant isolation at the VM level mirrors the database-per-tenant pattern in the apps themselves — the same philosophy at two layers. When a VM dies or an upgrade goes sideways, the fix is a snapshot restore, not a weekend rebuild. That safety margin is why I can run production SaaS alone without a pager team.

  ## Why not just bare Docker on the host

  Containers share a kernel and a blast radius. VM boundaries give me per-workload resource guarantees, independent kernels where needed and clean separation between client-adjacent services — worth the small overhead for production peace of mind.
