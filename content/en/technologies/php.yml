content: |
  PHP is my main server-side programming language. I have more than eight years of commercial development experience, working with Laravel and Symfony as well as WordPress when it fits the project. My current work uses PHP 8.x; that experience also includes earlier PHP versions.

  ## Where I use PHP

  Laravel powers projects such as VetSpace, DigiPulse and NetPostPanel. My commercial Symfony work includes a ticketing platform for Formula 1, MotoGP, EICMA and EuroLeague events. The tasks span checkout, user accounts, administration tools and external integrations.

  ## What I focus on

  - **Business logic** — understandable workflows for bookings, subscriptions and orders.
  - **APIs and payments** — validation, authorization and reliable handling of external responses.
  - **Maintenance** — automated tests and static analysis to support changes in existing codebases.

  ## Runtime choices

  PHP-FPM remains useful for conventional request handling. Long-running workers, including applications served through Octane and FrankenPHP, introduce different state and memory considerations. I choose the runtime around the application and verify the result under representative load. A language or framework alone does not guarantee performance.
faq:
  - label: Which PHP versions do you work with?
    content: My current work uses PHP 8.x. When upgrading an older application, I check the framework and dependency requirements and test behavior affected by the version change.
  - label: How do you choose between Laravel and Symfony?
    content: I consider the existing codebase, team experience, integrations and maintenance needs. Both can support long-lived applications; I use Laravel for my SaaS projects and Symfony in commercial ticketing work.
