content: |
  Vite is a frontend development and build tool. I use it through Nuxt in VetCard and this portfolio, and with Laravel's frontend integration in DigiSpace.

  ## During development

  The development server updates supported modules through hot module replacement, so many edits can be reviewed without a full page reload. The actual feedback time depends on the project, plugins and machine; it is not an unconditional promise of instant updates.

  ## For production

  The build prepares frontend assets for deployment, including hashed filenames and code splitting where configured. Nuxt and Laravel supply their own integration around that output. The production bundler depends on the Vite version, so I check the installed toolchain when changing build configuration.

  ## What I verify after a build

  A successful build does not prove that every route works. Asset URLs, environment variables, server rendering and browser behavior need checks in the target setup. I treat Vite as one part of the application's delivery process, with browser tests and runtime checks covering behavior beyond compilation.
