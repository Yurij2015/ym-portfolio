content: |
  Go is a compiled programming language that I use for services running alongside Laravel applications. In my projects, it handles focused tasks that benefit from an independent process and deployment cycle.

  ## Go in DigiPulse and VetSpace

  DigiPulse uses a separate Go service for website availability checks. Laravel handles the application and administration interface, while the monitoring service makes HTTP requests and reports results. VetSpace uses a dedicated Go service for AI-assisted visit analysis.

  ## Designing a background service

  Goroutines make concurrent work convenient, but concurrency still needs limits. Timeouts, cancellation and bounded work queues help a monitoring service cope with slow or unavailable websites. The useful measure is whether it completes checks reliably within its resource budget, rather than a blanket performance comparison with PHP.

  ## Deployment and language choice

  Go applications can be deployed as compiled binaries. Whether a binary is fully self-contained depends on its build settings and native dependencies. I keep ordinary application workflows in Laravel and use Go when separating a service makes its operation and maintenance clearer.
