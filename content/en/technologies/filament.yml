content: |
  Filament is a Laravel toolkit for building administration panels and application interfaces. I use it to create forms, tables and dashboards while keeping business rules in the Laravel backend.

  ## Examples from my projects

  In DigiPulse, Filament supports the monitoring administration interface. In DigiSpace, it powers a content management panel alongside an older Inertia and Vue interface. This allows the administration tools to evolve without replacing the public website at the same time.

  ## What I build with Filament

  - **Resources** — screens for creating, editing and searching records.
  - **Forms and tables** — validation, filters and actions tailored to the workflow.
  - **Custom pages** — Livewire components for tasks that do not fit a standard record editor.

  ## Permissions and maintainability

  An admin panel still needs authorization rules and tests for sensitive actions. Hiding a button is not enough to restrict access to data. I use Filament where its components match the workflow, then add custom behavior where it makes the interface easier to use. Delivery time depends on the permissions, integrations and business rules involved.
faq:
  - label: When does Filament fit an admin panel?
    content: It works well for forms, tables and record management in Laravel. More specialized workflows can use custom pages and Livewire components within the panel.
