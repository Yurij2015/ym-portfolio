content: |
  Laravel is the PHP framework I use for SaaS products, APIs and administration tools. My projects include VetSpace, DigiPulse, NetPostPanel and the DigiSpace website, each with different business rules and integration needs.

  ## How I use Laravel

  - **VetSpace** — a shared API for the clinic catalog and CRM, with tenant-aware access and Stripe subscriptions through Cashier.
  - **DigiPulse** — the monitoring application and Filament administration interface, alongside a separate Go monitoring service.
  - **NetPostPanel** — background content generation workflows managed through queues and Horizon.
  - **DigiSpace** — a multilingual website with a custom CMS and Filament panel.

  ## The framework and its ecosystem

  Laravel provides routing, validation, database access and queue APIs. Filament, Cashier and Horizon are additional tools that I select and configure for the project. Billing, permissions and tenant isolation still require application-specific design and testing.

  ## Building for ongoing maintenance

  I aim to keep business logic separate from HTTP handling and administration screens. This makes it easier to reuse a workflow through an API or background job. Performance work starts with measurement; tools such as Octane can help suitable workloads, but do not replace query optimization or careful state management.
faq:
  - label: Do you build new Laravel applications or maintain existing ones?
    content: Both. My work includes new applications, audits, refactoring and extending existing products. The approach depends on the codebase and release requirements.
  - label: Which Laravel tools do you work with?
    content: Filament for administration, Cashier for Stripe subscriptions and Horizon for Redis queues. I also work with Octane and FrankenPHP where the application benefits from long-running workers.
  - label: Can you handle Laravel deployment and hosting?
    content: Yes. I work with Docker, Caddy, Proxmox and CI/CD, including deployments on a rented Hetzner dedicated server. The setup depends on the project’s availability and maintenance needs.
