content: |
  Hetzner provides the dedicated server I rent for SaaS workloads including DigiPulse, VetSpace and NetPostPanel. I manage the software stack, with Proxmox separating application environments into virtual machines.

  ## What I manage

  My responsibilities include the operating system, virtual machines, container deployments, network configuration and application recovery. Renting a dedicated server gives me control over how resources are allocated without making the hardware my property. Hardware faults and replacements are handled with the hosting provider.

  ## Why this setup fits my projects

  Several continuously running services can share the available capacity. That gives me a predictable base hosting cost and room to choose my own deployment tools. The full cost also includes storage, backups, administration time and any additional infrastructure.

  ## Availability is a separate decision

  Multiple virtual machines on one server still share a physical point of failure. Proxmox isolation does not make that host highly available. When a project's availability requirements increase, backup recovery time and redundancy need their own design rather than simply adding another VM on the same machine.
