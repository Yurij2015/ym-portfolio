content: |
  Hetzner dedicated hardware is where my SaaS products live — a physical server running Proxmox that replaced a growing fleet of cloud droplets once the math stopped making sense.

  ## How I use Hetzner

  - **Dedicated server** — one physical machine hosts the VMs that run DigiPulse, VetSpace, NetPostPanel and supporting services.
  - **Own virtualization layer** — Proxmox on bare metal: VMs and containers carved per workload, snapshotted and backed up under my control.
  - **Predictable economics** — fixed monthly cost for real cores and RAM instead of per-VM cloud pricing; the savings fund the redundancy headroom.

  ## Production experience

  Owning the metal means owning the incidents too — there's no support ticket for a failing disk or a misconfigured firewall, just a console and the responsibility to fix it. That's exactly the trade I wanted: full control over the stack from hypervisor to application, at a cost that makes bootstrapped SaaS sustainable. Everything production I run answers to this machine.

  ## Dedicated vs cloud in my stack

  Steady, always-on workloads belong on owned hardware; spiky or disposable ones belong in the cloud. My products are the former — predictable load, known neighbors (me), and no bill surprises when traffic grows.
