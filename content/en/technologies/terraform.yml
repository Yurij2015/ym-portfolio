content: |
  Terraform manages the parts of my infrastructure that used to live in someone's memory — containers, networks and deploy configuration declared in code, applied from a workspace per environment.

  ## How I use Terraform

  - **Containers on VMs** — DigiPulse's infrastructure provisions Docker services onto Proxmox VMs through the Docker provider over SSH: no cloud lock-in, just declarative containers on my own hardware.
  - **Environment separation** — workspaces and per-env tfvars keep testing and production isolated; the same plan file shapes both, with only variables differing.
  - **State discipline** — reviewed plans before applies, secrets kept out of var files and out of git.

  ## Production experience

  The concrete win: adding a service to DigiPulse became `terraform apply` instead of SSH-into-the-box-and-hope. Environments stopped drifting because the code is the environment. For a one-person infrastructure that's the difference between "I remember how it's wired" and "the repo says how it's wired".

  ## How far IaC goes in a solo setup

  Terraform covers provisioning and service layout; app deploys still run through CI/CD. The boundary is deliberate — infra changes are rare and reviewed, deploys are frequent and automated. Mixing them makes both worse.
