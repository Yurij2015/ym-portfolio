content: |
  Symfony is a PHP framework I use in my commercial work on a ticketing platform serving Formula 1, MotoGP, EICMA and EuroLeague events. My work covers both customer-facing purchase flows and internal administration tools.

  ## What I work on

  - **Checkout** — cart behavior, seat selection, order confirmation and ticket delivery.
  - **Payments** — integrations with providers such as Stripe and Dalenys.
  - **Accounts and administration** — customer profiles, order history and tools for managing events and orders.
  - **External services** — seat-map solutions and third-party APIs in the purchase flow.

  ## What ticketing demands

  When sales open, a platform must handle changes in demand while keeping orders and seat availability consistent. That makes transaction boundaries, payment states and error handling especially important. A fast page is useful only if the customer can complete the correct purchase.

  ## Symfony and Laravel in my work

  I work with both frameworks. Existing architecture, team conventions and integrations influence the choice more than a fixed division between enterprise and smaller products. On an established Symfony application, I focus on changes that can be tested, reviewed and maintained through future releases.
