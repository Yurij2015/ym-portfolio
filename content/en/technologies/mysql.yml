content: |
  MySQL is a relational database that I use with Laravel applications and WordPress websites. In DigiSpace, it stores the content behind the company website and CMS; DigiSpace Studio also uses it as part of its WordPress stack.

  ## What database work involves

  - **Schema design** — model pages, menus and related records with appropriate keys and constraints.
  - **Query analysis** — inspect slow queries and execution plans before changing indexes or adding resources.
  - **Migrations** — plan schema changes with existing data and deployment order in mind.

  ## MySQL and WordPress

  MySQL is a common WordPress database choice, but it is not the only supported engine: WordPress also supports MariaDB. Hosting compatibility, existing data and operational experience all influence the choice. Changing database engines needs testing rather than an assumption of identical behavior.

  ## MySQL or PostgreSQL?

  I work with both. An established MySQL application may have no reason to migrate, while another project may benefit from PostgreSQL's data types or indexing options. For either engine, sound queries, backups and tested recovery matter more than a general claim that one database is always faster.
