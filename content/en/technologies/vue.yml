content: |
  Vue.js is a JavaScript framework for building user interfaces. I use it for the VetSpace clinic panel, VetCard's public website and the administration interfaces in projects such as DigiSpace.

  ## Different interfaces, shared tools

  - **Application panels** — forms, lists and interactive workflows for signed-in users.
  - **Public websites** — Vue components within Nuxt pages rendered on the server.
  - **Laravel integration** — Inertia connects server-side routes with Vue pages without requiring a separate public API for those screens.

  ## A clinic page as an example

  VetCard needs both readable clinic information and an interactive booking interface. Nuxt handles the page's server rendering, while Vue manages user interactions. This lets the same site serve visitors reading about a clinic and those choosing an appointment.

  ## Keeping components maintainable

  The Composition API helps group related behavior, and TypeScript makes component contracts explicit. I separate data loading, reusable logic and presentation where that improves readability. Framework choice still depends on the existing codebase and team: Vue is my main tool, not a guarantee that every frontend problem needs the same architecture.
faq:
  - label: Do you use Vue with Nuxt or Laravel?
    content: Both. I use Nuxt for public websites such as VetCard, and Vue with Laravel or Inertia for application interfaces. The choice depends on routing, data access and rendering needs.
  - label: How would you approach a Vue 2 to Vue 3 migration?
    content: I would first review dependencies and incompatible APIs, then plan changes around components or routes where the architecture allows it. Tests and staged releases help manage the transition.
