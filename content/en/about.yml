title: About Me
content: |
  Hi, I'm **Yurii Mokryi**, a Senior Full-Stack PHP Developer based in Poznań, Poland. I have 8+ years of commercial development experience: building and maintaining SaaS products, CRM systems, ticketing/e-commerce platforms, and REST APIs.

  My primary role is full-stack development on a high-load ticketing platform for major sporting events (Formula 1, MotoGP, EICMA, EuroLeague): checkout, user accounts, admin dashboards, Stripe/Dalenys integration, and 3D seat-map solutions. In parallel, as the founder of DigiSpace, I build my own SaaS products — DigiPulse (uptime monitoring) and VetSpace (CRM for veterinary clinics).

  ## My Stack

  I work with **Laravel** (Filament, Octane, FrankenPHP) and **Symfony** on the backend, and Vue.js and Nuxt on the frontend. In SaaS projects, I handle customer data separation, subscriptions and integrations with Stripe, Revolut, Dalenys and other APIs. For deployment and maintenance, I use Linux/SSH, Docker, Caddy, CI/CD, Proxmox and Terraform.

  ## How I work

  Before becoming a developer, I spent several years working in science. That left me with a habit of testing assumptions: first establish what is known about a problem, then choose a way to test it and draw conclusions. When working on an application, I start by understanding what users need and how the system works now. I then propose changes and agree on how to check the result.

  ## Beyond the Screen

  Outside work, I enjoy exploring coffee shops in Poznań, following AI and cloud technologies, and contributing to open-source projects.

  If you need a developer for a new or existing product, [tell me about the task](https://t.me/YuriiMokryi). We can discuss what needs doing and what information I will need to estimate the work. You can find examples in my [projects](/projects).
