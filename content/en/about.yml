title: About Me
content: |
  Hi, I’m **Yurii Mokryi**, a Full-Stack PHP Developer based in Poznań. I work on web applications, from backend logic and interfaces to deployment and ongoing maintenance.

  In 2010, while working as a researcher at a veterinary science institute, I built my [first website](/en/about/first-website). Later, I made a WordPress site for my freelance business; that was my first contact with PHP. Since 2021, I have worked on applications in commercial software teams. Research also taught me to test assumptions: understand what is known about a problem and find a way to check a possible explanation.

  ## What I work on

  My client work includes Symfony ticketing platforms, where I develop checkout flows, user accounts, admin tools and payments through Stripe and Dalenys. I work with Doctrine, MySQL, Redis and queues, and build interfaces with Vue.js.

  Alongside that work, I develop my own products through DigiSpace. VetSpace is a CRM for veterinary clinics, while VetCard provides their public pages and online booking. In DigiPulse, I work on website uptime monitoring; in NetPostPanel, source discovery and AI-assisted content preparation.

  These products use Laravel, Filament, Vue and Nuxt, with separate Go services handling some tasks. In DigiPulse, for example, a Go service checks website availability while Laravel manages monitors and notifications.

  ## From development to maintenance

  For my own products, I also manage environments, deployment and the services running after launch. The applications run in Docker, I manage virtual machines with Proxmox, and Caddy handles reverse proxying. Part of DigiPulse’s infrastructure is defined in Terraform, with releases automated through GitHub Actions.

  This work is part of day-to-day development: a code change may also involve data migrations, background processes and environment settings. When joining an existing project, I therefore get to know how the application is run, tested and updated as well as the code itself.

  ## Outside work

  I enjoy visiting coffee shops in Poznań, exploring new places, and following developments in AI and cloud technologies. I publish some of my projects’ source code on [GitHub](https://github.com/Yurij2015).

  You can find examples and technical details in my [projects](/projects). If you would like to discuss your application, [send me a message](https://t.me/YuriiMokryi) and tell me what you are working on.
description: "My path from science and freelance projects to PHP development, ticketing platforms and my own SaaS products."
