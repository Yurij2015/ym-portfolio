content: |
  An AI content platform with multi-provider generation (Gemini/OpenAI behind a driver abstraction), semantic search on Qdrant, an RSS/news aggregation engine with auto-discovery and content scraping, and Langfuse tracing for LLM observability.

  ## Key Features

  - **Multi-provider AI** - Multi-provider generation (Gemini/OpenAI)
  - **Semantic search** - Semantic search on Qdrant
  - **RSS aggregation** - RSS/news aggregation engine
  - **Content scraping** - Auto-discovery and content scraping
  - **LLM observability** - Langfuse tracing
  - **Job queues** - Horizon for job processing
  - **Driver abstraction** - Driver abstraction for AI providers

  ## Tech Stack

  - **Backend**: Laravel
  - **AI**: Multi-provider (Gemini/OpenAI)
  - **Vector DB**: Qdrant for semantic search
  - **Observability**: Langfuse for LLM tracing
  - **Queue**: Laravel Horizon
  - **Architecture**: Driver abstraction pattern
