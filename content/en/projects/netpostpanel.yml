content: |
  An AI content platform with multi-provider generation (Gemini/OpenAI behind a driver abstraction), semantic search on Qdrant, an RSS/news aggregation engine with auto-discovery and content scraping, and Langfuse tracing for LLM observability.

  ## Key Features

  - **Provider-agnostic AI** - Gemini and OpenAI sit behind a driver abstraction, so swapping models is config, not refactoring
  - **Semantic pipeline** - Qdrant vector search deduplicates and clusters incoming stories before they reach generation
  - **Autonomous aggregation** - RSS auto-discovery plus scraping turns a bare topic into a self-feeding content source
  - **Observable LLM calls** - every generation is traced in Langfuse: tokens, latency, cost
  - **Queue-driven** - Laravel Horizon runs generation and scraping jobs with retries and backpressure

  ## Tech Stack

  - **Backend**: Laravel
  - **AI**: Multi-provider (Gemini/OpenAI)
  - **Vector DB**: Qdrant for semantic search
  - **Observability**: Langfuse for LLM tracing
  - **Queue**: Laravel Horizon
  - **Architecture**: Driver abstraction pattern
