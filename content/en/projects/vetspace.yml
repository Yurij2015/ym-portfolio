content: |
  A two-sided veterinary platform — an SEO clinic catalog and a subscription-based CRM with appointments and patient records. A public clinic catalog built for SEO-first customer acquisition, and a subscription-based CRM (appointments, visits, patient records) as separate Vue/Nuxt apps on top of a single Laravel API. Database-per-tenant architecture, Stripe subscriptions via Cashier, GraphQL + REST, and AI-assisted visit analysis through a dedicated Go microservice.

  ## Key Features

  - **Two-sided funnel** - an SEO-first public catalog acquires clinics; the subscription CRM (appointments, patient records) retains them
  - **True tenant isolation** - database-per-tenant keeps every clinic's data separate and makes GDPR export/delete a per-database operation
  - **Dual API surface** - GraphQL for complex catalog queries, REST for the CRM — one Laravel codebase
  - **Billing built-in** - Stripe subscriptions via Cashier: trials, plan changes, dunning
  - **AI where it helps** - visit analysis runs in a dedicated Go microservice, keeping the main API unburdened

  ## Tech Stack

  - **Backend**: Laravel (API)
  - **Frontend**: Vue/Nuxt (separate apps)
  - **Architecture**: Database-per-tenant multi-tenancy
  - **Payments**: Stripe via Cashier
  - **API**: GraphQL + REST
  - **AI**: Go microservice for visit analysis
