content: |
  VetSpace combines a public directory of veterinary clinics with a subscription CRM for appointments, visits and patient records. The directory and CRM run as separate Vue/Nuxt applications with a shared Laravel API. Each clinic has its own database, subscriptions use Stripe and Cashier, and a separate Go service handles AI-assisted visit analysis.

  ## My work on the project

  This is my product. I work on the Laravel API and clinic interface, data separation between clinics and Stripe subscriptions. I also develop integrations with the public VetCard pages and a separate Go service for AI-assisted visit analysis.

  ## Key Features

  - **Directory and CRM** — public clinic pages and a separate workspace for visits and patient records
  - **Separate databases** — each clinic’s data is stored in its own database
  - **GraphQL and REST** - GraphQL for complex catalog queries, REST for the CRM — one Laravel codebase
  - **Stripe subscriptions** - Stripe subscriptions via Cashier: trials, plan changes, dunning
  - **Visit analysis** — AI processing runs in a separate Go service

  ## Tech Stack

  - **Backend**: Laravel (API)
  - **Frontend**: Vue/Nuxt (separate apps)
  - **Architecture**: Database-per-tenant multi-tenancy
  - **Payments**: Stripe via Cashier
  - **API**: GraphQL + REST
  - **AI**: Go microservice for visit analysis
