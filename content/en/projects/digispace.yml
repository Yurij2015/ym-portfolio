content: |
  The production website behind digispace.pro — the agency's public site, admin panel and custom CMS in a single Laravel app, now fully multilingual (EN/UK/PL) with a Filament admin panel running alongside the legacy Inertia + Vue one. The same code that runs the live site is available on GitHub.

  ## Key Features

  - **Filament admin panel** - a parallel `/control` panel (24 resources) with a TipTap rich editor, straight-to-MinIO image uploads and content-first navigation, rolled out resource-by-resource next to the existing Inertia admin
  - **Multilingual by design** - both content and structural UI strings (menus, footer, buttons) are translated per locale, not just page text, with hreflang-aware localized routing
  - **SEO built in** - JSON-LD structured data, localized sitemaps and proper 404 handling across every locale
  - **Monolith done right** - public site and two admin surfaces live in one Laravel app, no separate API to maintain
  - **Self-managed content** - pages, services and portfolio entries are edited in the CMS — no deploy needed for a text or translation change
  - **Quality gates** - PHPUnit tests and PHPStan static analysis run in CI
  - **Source available** - the exact code serving digispace.pro is public on GitHub

  ## Tech Stack

  - **Backend**: Laravel
  - **Admin**: Filament 5 (`/control`) + legacy Inertia.js + Vue admin
  - **Frontend**: Vue.js, Vite
  - **Localization**: EN/UK/PL content and structure translations
  - **Architecture**: Custom CMS
