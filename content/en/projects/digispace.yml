content: |
  DigiSpace combines the agency’s public website, admin panel and custom CMS in one Laravel application. Content and interface text are available in English, Ukrainian and Polish. Admin screens are gradually moving to Filament, while the legacy Inertia and Vue panel continues to run alongside it. The application’s source code is available on GitHub.

  ## My work on the project

  I develop and maintain the Laravel website and CMS, including public pages, translations and admin tools. I am gradually moving admin screens from Inertia and Vue to Filament while keeping the existing site running.

  ## Key Features

  - **Filament admin panel** - a parallel `/control` panel (24 resources) with a TipTap rich editor, straight-to-MinIO image uploads and content-first navigation, rolled out resource-by-resource next to the existing Inertia admin
  - **Content and interface translations** - both content and structural UI strings (menus, footer, buttons) are translated per locale, not just page text, with hreflang-aware localized routing
  - **SEO configuration** - JSON-LD structured data, localized sitemaps and proper 404 handling across every locale
  - **Shared codebase** - public site and two admin surfaces live in one Laravel app, no separate API to maintain
  - **Content editing in the CMS** - pages, services and portfolio entries are edited in the CMS — no deploy needed for a text or translation change
  - **Code checks** - PHPUnit tests and PHPStan static analysis run in CI
  - **Source available** - the exact code serving digispace.pro is public on GitHub

  ## Tech Stack

  - **Backend**: Laravel
  - **Admin**: Filament 5+ (`/control`) + legacy Inertia.js + Vue admin
  - **Frontend**: Vue.js, Vite
  - **Localization**: EN/UK/PL content and structure translations
  - **Architecture**: Custom CMS
