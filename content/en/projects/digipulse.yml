content: |
  DigiPulse checks website availability and SSL certificate expiry. Users add monitors and contacts, configure alert rules and receive outage notifications through Telegram or email. Checks run every 60 seconds, and the dashboard updates as statuses change.

  ## My work on the project

  This is my product. I develop its Laravel backend, Filament panel and separate Go monitoring service. I also work on the MCP server that gives AI assistants access to monitoring data, and manage deployment and infrastructure.

  ## Key Features

  - **Separate monitoring service** — a Go service checks websites every 60 seconds, while Laravel manages monitors, contacts and notifications
  - **Real-time dashboard** - Reverb websockets push status changes to the UI live, no manual refresh
  - **Octane + Filament** - resident-memory Laravel with a full admin panel for monitors, contacts and alert rules
  - **MCP server** - monitors and incidents are queryable from AI assistants (Claude, Cursor) via the Model Context Protocol
  - **Google OAuth + Turnstile** - passwordless sign-in and bot protection on public forms
  - **Self-hosted** — deployed in a Proxmox environment where I administer virtual machines and services

  ## Tech Stack

  - **Backend**: Laravel (Octane, Reverb websockets)
  - **Admin Panel**: Filament
  - **Monitoring Engine**: Go (separate service)
  - **Database**: PostgreSQL
  - **AI Integration**: MCP server
  - **Infrastructure**: Self-hosted on Proxmox
