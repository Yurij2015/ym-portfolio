faq:
  - label: Do you need production access?
    content: A repository and problem description are usually enough to start. Logs, test data and environment access depend on the agreed scope.
  - label: Are fixes included?
    content: The audit delivers a report. Fixes can be agreed separately or handled by your team.
content: |-
  ## Where an audit starts

  First, we define the questions the review needs to answer: why payments fail, where access checks are missing or what makes a module hard to develop further. For a general review, we choose the most important parts of the system so the available time goes to them.

  That focus also shapes the report: I describe the areas reviewed and conclusions supported by the code or a reproduced error. For each issue, I explain its consequences and recommend a fix, keeping advice about code structure separate from defects. This gives the team both priorities and a clear view of the review's limits.

  To define the audit scope, send a short description of the application and the questions that concern you. We can then agree on the modules to review. Their analysis and the report start at $1,000.
