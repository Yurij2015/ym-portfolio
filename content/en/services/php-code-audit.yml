faq:
  - label: Do you need production access?
    content: A repository and problem description are usually enough to start. Logs, test data and environment access depend on the agreed scope.
  - label: Are fixes included?
    content: The audit delivers a report. Fixes can be agreed separately or handled by your team.
content: |-
  ## Where an audit starts

  First, we define the questions the review needs to answer: why payments fail, where access checks are missing or what makes a module hard to develop further. For a broader review, we agree on the most important areas to focus on within the available time.

  That focus also shapes the report: I describe the areas reviewed and conclusions supported by the code or a reproduced error. For each issue, I explain its consequences and recommend a fix, keeping advice about code structure separate from defects. Your team can then see what needs attention first and which areas the review covered.

  To define the audit scope, send a short description of the application and the questions that concern you. We can then agree on the modules to review. Reviewing the agreed modules and preparing the report starts at $1,000.
