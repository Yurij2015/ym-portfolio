faq:
  - label: Do you need production access?
    content: A repository and problem description are usually enough to start. Logs, test data and environment access depend on the agreed scope.
  - label: Are fixes included?
    content: The audit delivers a report. Fixes can be agreed separately or handled by your team.
content: |-
  ## A review with a defined purpose

  An audit should answer a question: why a payment fails, where access checks are missing or what makes a module difficult to extend. For a general review we first choose priority areas.

  The report states what was checked and which conclusions are supported by code or reproduced behavior. Structural recommendations are separate from defects. A limited review does not establish that no other issues exist.

  Share the application context and questions the audit should answer. The starting price of $1,000 is a guide for reviewing defined modules and producing a report. Implementing the findings is not included in the audit.
