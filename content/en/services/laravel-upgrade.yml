    content: That depends on infrastructure and database changes. We agree the deployment approach and any maintenance window beforehand.
content: |-
  ## What determines the scope

  The application's condition determines the complexity of an upgrade: whether its packages are still maintained, how much configuration has changed and which custom code needs adapting. The gap between the current and target versions is not enough to estimate the work, so I start by reviewing dependencies and how the application runs.

  The next question is how to check the system's behavior after the changes. In my Laravel products, VetSpace and DigiPulse, I work with subscriptions, queues and integrations where a successful application startup is only the beginning of testing. The operations themselves also need to run and return the correct results.

  To estimate your upgrade, send composer.json, composer.lock and a short description of how the application runs. An upgrade between agreed versions starts at $1,600. If abandoned packages need replacing or missing tests need writing, I include that work in the estimate.
