faq:
  - label: What if there are no tests?
    content: We agree which critical workflows need checks and test coverage before the upgrade. This work is included in the estimate.
  - label: Can the upgrade avoid downtime?
    content: That depends on infrastructure and database changes. We agree the deployment approach and any maintenance window beforehand.
content: |-
  ## What determines the scope

  The application's condition determines the complexity of an upgrade: whether its packages are still maintained, how much configuration has changed and which custom code needs adapting. The gap between the current and target versions is not enough to estimate the work, so I start by reviewing dependencies and how the application runs.

  Once the required changes are clear, I plan how to check that the system still works as expected. In my Laravel products, VetSpace and DigiPulse, I work with subscriptions, queues and integrations where a successful application startup is only the beginning of testing. I also test those workflows to check that they still produce the correct results.

  To estimate your upgrade, send composer.json, composer.lock and a short description of how the application runs. Upgrading to an agreed target version starts at $1,600. If abandoned packages need replacing or missing tests need writing, I include that work in the estimate.
