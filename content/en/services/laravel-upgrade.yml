    content: That depends on infrastructure and database changes. We agree the deployment approach and any maintenance window beforehand.
content: |-
  ## Before choosing the target version

  An upgrade may require replacing an abandoned package, changing configuration or adapting application code. The estimate depends on more than the number of versions involved.

  I work on my own Laravel products, VetSpace and DigiPulse, which involve subscriptions, queues and integrations. These workflows need separate checks during an upgrade: starting the application successfully does not verify them.

  For an estimate I need composer.json, composer.lock and the application setup. The starting price of $1,600 is a guide for an upgrade between defined versions. Replacing abandoned packages and adding missing tests affect the work required.
