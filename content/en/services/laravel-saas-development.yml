faq:
  - label: Does every customer need a separate database?
    content: It depends on data, backup and infrastructure requirements. We compare separate databases with a shared database and scoped access.
  - label: What does the starting price cover?
    content: An agreed development stage. Roles, integrations and features are defined before estimating; the price does not cover an unlimited MVP scope.
content: |-
  ## Experience from VetSpace

  In my own product VetSpace, I work with clinic accounts, veterinary CRM workflows and Stripe subscriptions. Clinic data is separated into individual databases. For a new product I choose isolation after reviewing requirements; this architecture is not necessary for every SaaS.

  Subscriptions need explicit rules too: when access starts, what happens after a failed payment and how plan changes work. We discuss these alongside first-release features.

  In a client marketplace, the purchased package set how many active listings and drafts a user could have.

  Describe your users, their main task and payment model. The starting price of $4,800 is a guide for a first release with a limited feature set. Billing, data imports and external integrations affect the estimate.
