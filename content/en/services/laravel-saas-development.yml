faq:
  - label: Does every customer need a separate database?
    content: It depends on data, backup and infrastructure requirements. We compare separate databases with a shared database where the application controls access to each customer’s data.
  - label: What does the starting price cover?
    content: The first agreed stage of SaaS development. Before estimating, we define the company accounts, roles, features and subscription workflows it includes, and what you will be able to use at the end of that stage.
content: |-
  ## Experience with VetSpace

  In VetSpace, each clinic has its own database, and subscriptions use Stripe and Cashier. For a new SaaS product, I choose how to separate customer data based on its access, backup and infrastructure requirements.

  Alongside data access, we need to define subscription rules: when users gain access, how they change plans and what happens after a failed payment. These rules affect the product's features. For example, in a client marketplace, the purchased package determined how many active listings and drafts a user could have.

  To get started, describe who will use your SaaS, what they need it to do and how you plan to charge for it. This will help us define the first stage and agree on its outcome.

  The first agreed stage of development starts at $4,800. Before work begins, the estimate sets out the features, billing workflows and integrations included in that stage.
