faq:
  - label: Do you maintain code written by others?
    content: Yes. I start by reviewing the project. If the application cannot run or credentials are missing, we assess stabilization before ongoing maintenance.
  - label: Is round-the-clock emergency support included?
    content: The hourly service does not include 24/7 on-call support. We agree on availability and response times before starting work.
content: |-
  ## What we agree on at the start

  A live product often needs fixes, dependency updates and small improvements at the same time. To decide what to tackle first, I review the application's condition, then work with you to agree on priorities, a budget and a maintenance schedule. Major upgrades and new modules receive separate estimates.

  The plan also covers how to respond to failures. My DigiPulse service can monitor website availability and send alerts through Telegram and email. Before work begins, we agree on who receives those messages and what happens next.

  **To discuss support for your product, tell me who maintains it now and which tasks are building up.** We can then agree on how often to run checks and how you will send me tasks. Work is billed hourly, starting at $35. The final rate depends on the application’s condition, the work needed and how regularly you need support. We discuss it before starting.
