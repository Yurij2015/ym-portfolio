faq:
  - label: Do you maintain code written by others?
    content: Yes. An initial review is needed first. If the application cannot run or credentials are missing, we assess stabilization before ongoing maintenance.
  - label: Is round-the-clock emergency support included?
    content: Continuous 24/7 coverage is not part of the base hourly service. Availability and response times must be separately agreed before the engagement.
content: |-
  ## What we agree at the start

  Maintenance can include fixes, dependency updates, backup checks and small product changes. These are different tasks, so we first set priorities and available time. Major upgrades and new modules receive separate estimates.

  My DigiPulse service can monitor availability and send Telegram and email notifications. Monitoring helps detect an outage; it does not replace an agreed response process.

  Tell me who currently maintains the product and which tasks are accumulating. The rate starts at $50 per working hour. We define check frequency, availability and request handling before starting; continuous on-call coverage is not part of the base service.
