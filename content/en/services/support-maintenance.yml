faq:
  - label: Do you maintain code written by others?
    content: Yes. An initial review is needed first. If the application cannot run or credentials are missing, we assess stabilization before ongoing maintenance.
  - label: Is round-the-clock emergency support included?
    content: Continuous 24/7 coverage is not part of the base hourly service. Availability and response times must be separately agreed before the engagement.
content: |-
  ## What we agree on at the start

  A live product often needs fixes, dependency updates and small improvements at the same time. To divide the time between them, I first review the application's condition, then work with you to agree on priorities, a budget and a maintenance schedule. Major upgrades and new modules receive separate estimates.

  The plan also covers how to respond to failures. My DigiPulse service can monitor website availability and send alerts through Telegram and email. Before work begins, we agree on who receives those messages and what happens next.

  To discuss support for your product, tell me who maintains it now and which tasks are building up. This will help us define the frequency of checks and how to submit requests. Work is billed hourly, starting at $50.
