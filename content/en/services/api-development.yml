faq:
  - label: Can you extend an existing API?
    content: Yes. I review its contract and consumers first, then plan compatible changes or a new version.
  - label: Does it have to be REST?
    content: No. We choose the format for the consumers and operations. A suitable existing REST API does not need replacement just to adopt another approach.
content: |-
  ## An API for its consumers

  In VetSpace, APIs serve the public directory and CRM. NetPostPanel exposes content generation and translation to other applications. These workflows have different access rules, execution times and ways of returning results.

  For a client marketplace I wrote a REST API with Sanctum authentication and Swagger documentation. It serves listings, orders, chat and support tickets.

  Before implementation I clarify who calls the API, which data they may access and what an error response should contain. For long operations we discuss background execution and status checks.

  For an estimate, share the operations and sample data. Include documentation if an API already exists. The starting price of $1,800 is a guide for a related set of operations with documentation and tests.
