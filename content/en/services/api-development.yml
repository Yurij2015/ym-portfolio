faq:
  - label: Can you extend an existing API?
    content: Yes. I review its contract and consumers first, then plan compatible changes or a new version.
  - label: Does it have to be REST?
    content: No. We choose the format for the consumers and operations. A suitable existing REST API does not need replacement just to adopt another approach.
content: |-
  ## APIs built around their clients

  In VetSpace, one Laravel API serves two parts of the product: the public directory through GraphQL and the CRM through REST. In NetPostPanel, other applications can request content generation and translation, receiving the result immediately or through a callback. These examples show why it is worth defining who will call an API and how long its operations will take before development begins.

  Another example is a client marketplace where I built a REST API with Sanctum authentication and Swagger documentation. It supports listings, orders, chat and support tickets, making access rules and error handling part of each workflow.

  I therefore start by defining the operations, available data and responses the client application should receive. For long-running tasks, I plan background execution and a way to retrieve the result. This becomes the basis for the implementation, documentation and tests.

  To estimate your task, describe the operations you need and include sample data. If an API already exists, its current documentation will also help. A group of related operations with documentation and tests starts at $1,800.
