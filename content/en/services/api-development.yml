faq:
  - label: Can you extend an existing API?
    content: Yes. I first review the API contract and the applications using it, then plan compatible changes or a new version.
  - label: Does it have to be REST?
    content: No. The right format depends on the applications using the API and the operations they need. If an existing REST API meets those needs, there is no reason to replace it.
content: |-
  ## APIs designed for the applications that use them

  In VetSpace, one Laravel API serves two parts of the product: the public directory through GraphQL and the CRM through REST. In NetPostPanel, other applications can request content generation and translation, receiving the result immediately or through a callback. These examples show why it is worth defining who will call an API and how long its operations will take before development begins.

  Another example is a client marketplace where I built a REST API with Sanctum authentication and Swagger documentation. It supports listings, orders, chat and support tickets, making access rules and error handling part of each workflow.

  With those requirements in mind, I define which operations the API will support, what data each client can access and how it should handle responses and errors. For long-running tasks, I plan background execution and a way to retrieve the result. This becomes the basis for the implementation, documentation and tests.

  To estimate your task, describe the operations you need and include sample data. If an API already exists, its current documentation will also help. Development of a set of related API operations, including documentation and tests, starts at $1,800.
