faq:
  - label: Do we need a larger server?
    content: Possibly. First we need to identify the limiting resource and whether application changes can reduce the load.
  - label: Is the database schema enough?
    content: It helps explain structure, but performance analysis may also need query plans, statistics and representative test data.
content: |-
  ## Measure a specific workflow

  A slow report and a slow booking action can have different causes. I start with a reproducible operation, checking response time, data volume and external dependencies. Then we can choose a change and measure its effect.

  DigiPulse runs network checks in a separate Go service rather than Laravel. This is task-specific workload separation, not a general recommendation to rewrite PHP in another language.

  Share the slow page or operation, conditions that trigger the delay and available logs. The starting price of $1,200 is a guide for diagnosis and work on a specific bottleneck. Measurable improvement can only be assessed after taking a baseline.
