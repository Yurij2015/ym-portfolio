faq:
  - label: Do we need a larger server?
    content: Possibly. First we need to identify the limiting resource and whether application changes can reduce the load.
  - label: Is the database schema enough?
    content: It helps explain structure, but performance analysis may also need query plans, statistics and representative test data.
content: |-
  ## Measuring a specific operation

  A slow report and a slow appointment booking may have different causes, so the first step is to reproduce the delay users experience. I measure response times, check data volumes and examine external dependencies. Once the source of the delay is clear, we can choose a change and agree on the measurements used to assess it.

  After the fix, I repeat the same operation with a comparable amount of data and compare execution time and resource usage. I also check that the response is correct, since a faster report still needs to return the same data.

  To get started, show me the page or operation people are waiting for and describe when the delay occurs. Any logs or measurements you already have will help with diagnosis. Diagnosis and work on one specific cause start at $1,200.
