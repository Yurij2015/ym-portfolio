content: |-
  ## Experience building and maintaining products

  I work on ticket shops built with Symfony, MySQL, Redis and Vue.js, with Stripe and Dalenys payments. In my own VetSpace product, I develop a veterinary CRM with separate clinic data and Stripe subscriptions. DigiPulse involves Laravel, Go and monitoring; NetPostPanel involves queues and AI integrations.

  I can take a feature or part of your backlog: review the relevant code, propose an implementation, write tests and prepare a pull request. I also review changes from other developers. I raise questions and dependencies that affect the implementation as they arise.

  Share your stack and two or three backlog tasks you would like me to take on. This helps define my role and the time needed. My hourly rate starts at $50; hours and start date depend on availability.
