    content: I work from Poznań, Poland. We agree working hours and overlap with your team separately. I communicate in Ukrainian and English.
content: |-
  ## What I work on

  I work on ticketing websites built with Symfony, MySQL, Redis and Vue.js, with payments through Stripe and Dalenys. Alongside this, I develop my own products: VetSpace, a veterinary clinic CRM with separate databases and Stripe subscriptions; DigiPulse, built with Laravel and Go; and NetPostPanel, with queues and AI integrations.

  I draw on this experience when taking on a feature or part of a team's backlog. I start by reviewing the related code and proposing an implementation, then prepare the changes with tests and submit a pull request for review. I also review colleagues' code and raise questions or dependencies as soon as they affect the solution.

  To discuss your needs, send me the stack and two or three backlog items you would like to hand over. We can use them to define my role and how many hours you need. My rate starts at $50 per hour; we agree on the hours and start date based on my availability.
