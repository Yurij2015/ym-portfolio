faq:
  - label: Filament, Flowbite or AdminLTE?
    content: Filament works well for Laravel applications that need standard admin screens with lists, forms, filters and user roles. I use Flowbite when the panel needs a custom design or more specialized screens, or when the frontend is a separate Vue or Nuxt application. AdminLTE makes sense when the project already uses Bootstrap or has an AdminLTE panel that needs extending.
  - label: Can Filament be added to an existing Laravel app?
    content: Yes, after checking version, model and authentication compatibility. Resources can be introduced one at a time without touching the rest of the application.
  - label: What if the backend is not Laravel?
    content: Then Filament is not an option. A Flowbite or AdminLTE panel can be built into the existing PHP application or run separately and read data through an API. The second route adds integration work.
content: |-
  ## Examples from my projects

  In DigiSpace, I am gradually moving screens from the old Inertia and Vue admin panel to Filament. The two panels run side by side, and the new one already lets users edit content, translations and SEO metadata. I also use Filament in DigiPulse to manage monitors, contacts and notification rules.

  I also work with Flowbite. It powers NetPostPanel and the VetSpace clinic panel, as well as client projects: a marketplace admin panel with users, listings and orders, and a service for photographers with galleries and service packages.

  I have also built two admin panels for Laravel applications using AdminLTE. One fetches data from an external API on a schedule, letting an agency view and export statistics and expenses. The other manages the collection and filtering of social network data through job queues.

  In each case, the scope depends on how the team works day to day: which records they create and edit, how they find them, and which actions need confirmation. **To estimate the panel, show me the current screens or spreadsheets and tell me what the team still does manually.**

  Development of a set of related screens starts at $1,600. If you need imports, reports or custom operations, I factor their complexity into the overall estimate.
