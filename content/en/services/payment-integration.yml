faq:
  - label: Which payment systems have you worked with?
    content: Stripe in my own VetSpace product (subscriptions through Cashier) and in ticket shops that also use Dalenys. In a client marketplace I set up Stripe Connect. I have integrated Revolut as well. For another provider I review its documentation before estimating.
  - label: Can subscriptions be added to an existing product?
    content: Yes. We need rules for plans, access after payment, plan changes, cancellation and failed payments.
content: |-
  ## Agreeing the complete workflow

  A payment success page is only part of the integration. We need to define how the application confirms an operation, what it shows during a delay and how it handles repeated provider events.

  In VetSpace I work with Stripe subscriptions. In NetPostPanel, external integrations are part of a background content workflow. Both need error handling and an understandable operation status.

  In a marketplace I built for a client in Laravel, payments run through Stripe Connect. Sellers connect their own Stripe account, buyers pay through Checkout, the platform keeps a fee and affiliates receive their commission as a transfer. Webhooks from the platform and from connected accounts update order status.

  For payments, share the provider and required operations: one-off charges, subscriptions or refunds. For another API, share its documentation and the data to exchange. The price starts at $1,600 as an integration budget guide; provider fees are separate.
