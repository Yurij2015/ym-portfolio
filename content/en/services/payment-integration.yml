faq:
  - label: Which payment systems have you worked with?
    content: Stripe in my own VetSpace product (subscriptions through Cashier) and in ticket shops that also use Dalenys. In a client marketplace I set up Stripe Connect. I have integrated Revolut as well. For another provider I review its documentation before estimating.
  - label: Can subscriptions be added to an existing product?
    content: Yes. We need rules for plans, access after payment, plan changes, cancellation and failed payments.
content: |-
  ## What an integration includes

  After a payment, the application needs to confirm the transaction on its side and update its status. If the provider's response is delayed or a webhook arrives more than once, the system needs to handle those events correctly and show the user a clear status. The integration therefore covers the full process, including errors and repeated messages.

  I work with Stripe subscriptions in my own product, VetSpace. For a client Laravel marketplace, I implemented a more complex payment flow using Stripe Connect: sellers connect their own accounts, the buyer pays through Checkout and the platform retains its commission. Affiliate program participants also receive their commission, while webhooks from the platform and connected accounts update order statuses.

  I also handle errors and track operation status when integrating other external services. In NetPostPanel, for example, API calls run as background content preparation jobs, so the application needs to track whether each job succeeds or fails after the initial request has ended.

  **To estimate a payment integration, tell me which provider you have chosen and which operations you need: one-off payments, subscriptions or refunds.** For another API, include its documentation and describe the data exchange. Integrations start at $1,600, with provider fees paid separately.
