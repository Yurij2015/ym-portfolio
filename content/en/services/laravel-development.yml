title: Laravel development
content: |-
  ## Examples from my projects

  In VetSpace, I develop the CRM, including clinic data management and Stripe subscriptions. In DigiPulse, Laravel manages monitors and notifications, while a separate Go service runs network checks. In both products, new modules need to work with the existing logic.

  My client work includes a Laravel marketplace with listings and paid packages. Alongside its core features, I worked on chat, LiveKit video calls, Meilisearch-powered search and support tickets that can also be created from incoming email.

  Adding a similar feature to an existing application starts with understanding its data structures, dependencies and deployment process. With that context, I can plan changes and checks so the new module works with the rest of the system.

  We can start with a description of what the user should be able to do and a look at the current application or mockups. From there, I will propose an implementation with a time and cost estimate.
deliverables:
  - A working module, such as role-based user accounts, order processing or an external service integration
  - Access checks and tests for the main scenarios
  - Repository changes and documentation for setup and maintenance
description: New modules, user accounts and integrations in Laravel. I work on new products and existing applications.
faq:
  - label: What does “from $2,400” mean?
    content: It is the starting budget for a module such as role-based user accounts or order processing, or for an integration. It includes tests and preparation for release. Before work begins, we agree on the module’s features, acceptance criteria and cost.
  - label: Do we need a separate frontend?
    content: I use Filament for internal admin panels and tools such as Inertia and Vue for user portals. For public pages, Nuxt can be a good fit, as it is in VetCard. The choice depends on the interface you need and who will maintain it.
