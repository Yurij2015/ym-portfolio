faq:
  - label: Do you work with custom PHP code?
    content: Yes. I first need to understand its structure, dependencies and setup before estimating changes.
  - label: Does the application need a framework migration?
    content: Not for every task. We discuss a migration when it makes future work easier and justifies the cost.
content: |-
  ## Changes to an existing system

  An integration, calculation change or bug fix can affect several parts of an application. Before implementation I review the related workflows and decide how to verify the result. Rewriting the application is not a required part of this service.

  In DigiSpace, I work on a Laravel codebase combining the public website, content and admin panels. That experience is useful when a change needs to fit existing behavior.

  Share the task and PHP version. For an error, reproduction steps and logs help; for a new feature, show the expected result. The starting price of $1,800 is a budget guide for a self-contained piece of development.
