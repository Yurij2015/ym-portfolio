faq:
  - label: Do you work with custom PHP code?
    content: Yes. I first need to understand its structure, dependencies and setup before estimating changes.
  - label: Does the application need a framework migration?
    content: Not for every task. We discuss a migration when it makes future work easier and justifies the cost.
content: |-
  ## Changes to a working system

  Even a small change can affect several parts of an application. A new integration, for example, affects data exchange, while a calculation change can affect related reports. Before starting, I establish these connections and decide how to check the result in the existing system.

  In DigiSpace, for example, the public website, content and admin panels share a Laravel codebase. Changes to one feature need to fit the rest of the logic, and I use the same approach in client applications.

  To get started, describe the task and include your PHP version. For an error, reproduction steps and log messages help; for a new feature, an example of the expected result is useful. These materials let me identify which code needs reviewing and estimate the work.

  An agreed piece of work, such as adding a report or connecting the application to another service, starts at $1,800, including checks and deployment instructions.
