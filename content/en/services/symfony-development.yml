content: |-
  ## Working on Symfony applications

  This service covers orders, integrations, APIs and background workflows. I work on multi-tenant ticket shops selling tickets for football, basketball, motorcycle and car racing, as well as museums, exhibitions and festivals. They run on Symfony with Doctrine, MySQL, Redis and queues, with a Vue.js interface and Stripe and Dalenys payments.

  For each integration I clarify what should happen when a response is delayed, a message is repeated or a supplier is unavailable. We include these conditions in the agreed testing scope.

  Describe the workflow to add or change and share the Symfony and PHP versions. The starting price of $3,200 is a guide for a module with tests; dependencies and external integrations affect the estimate.
