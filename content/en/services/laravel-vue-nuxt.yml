faq:
  - label: Inertia or a separate Nuxt application?
    content: Inertia supports Vue within Laravel. A separate Nuxt application may suit public pages needing server rendering. The requirements determine the choice.
  - label: Do I need a finished design?
    content: I can work from a design or an agreed component library. Creating a separate visual identity needs to be included in the scope.
content: |-
  ## An example from VetCard

  VetCard uses Nuxt for public clinic pages and a Laravel API for data and appointment booking. Both parts must work together: users need current information, a booking form and a clear result.

  For public pages I configure metadata and server rendering as required. This helps make content accessible to search engines but does not promise rankings or indexing.

  Share the screens, designs if available and required actions. The starting price of $2,400 is a guide for a defined part of an application with frontend and backend work, not a product of any size.
