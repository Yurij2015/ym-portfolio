faq:
  - label: Inertia or a separate Nuxt application?
    content: Inertia supports Vue within Laravel. A separate Nuxt application may suit public pages needing server rendering. The requirements determine the choice.
  - label: Do I need a finished design?
    content: I can work from a design or an agreed component library. If you need a custom visual design, we include that work in the scope.
content: |-
  ## The VetCard example

  In VetCard, public clinic pages run on Nuxt and get information and online booking data from a Laravel API. The frontend and backend work together throughout the booking, loading available appointment times, processing the form and confirming the result to the user.

  When testing a feature like this, I check the page layout as well as the feedback users receive: loading states, error messages and confirmation of completed actions. For public pages, I also configure metadata and server rendering so the main content is included in the server's HTML response.

  **To estimate a similar task, send a list of the screens and actions users need, along with any mockups you have.** I can use these to define the changes needed in both parts of the application. A feature covering both frontend and backend starts at $2,400.
