faq:
  - label: Inertia or a separate Nuxt application?
    content: Inertia supports Vue within Laravel. A separate Nuxt application may suit public pages needing server rendering. The requirements determine the choice.
  - label: Do I need a finished design?
    content: I can work from a design or an agreed component library. Creating a separate visual identity needs to be included in the scope.
content: |-
  ## The VetCard example

  In VetCard, public clinic pages run on Nuxt and get information and online booking data from a Laravel API. For a user to choose an appointment time and receive confirmation, the interface and backend need to handle the whole booking together, from loading available data to responding to the submitted form.

  During development, I therefore check both the page layout and what people see as they use it: loading states, error messages and confirmation of completed actions. For public pages, I also configure metadata and server rendering so the main content is included in the server's HTML response.

  To discuss a similar task, send a list of screens and actions users need, along with mockups if you have them. We can use these to define the changes needed in both parts of the application. A section of an application with an interface and backend starts at $2,400.
