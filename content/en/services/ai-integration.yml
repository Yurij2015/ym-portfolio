faq:
  - label: Do we need RAG?
    content: Retrieving relevant passages can help when answers must use your documents. Classification or field extraction may not need a separate knowledge base.
  - label: What about privacy and cost?
    content: Before launch I check provider data processing and retention terms. Costs are estimated from the model and request volume; API usage is billed separately.
content: |-
  ## Experience from NetPostPanel and DigiPulse

  NetPostPanel connects source discovery, content generation and Qdrant through Horizon queues. Langfuse tracks model calls. In DigiPulse, an MCP server exposes monitoring data to AI assistants.

  These are different integration patterns. For your task we first need to test whether a model produces a useful result. Document retrieval and structured output do not eliminate mistakes, so we agree how results should be reviewed.

  Share sample inputs and desired outputs, request volume and data restrictions. The starting price of $2,200 is a budget guide for one integrated AI feature; model API usage is billed separately.
