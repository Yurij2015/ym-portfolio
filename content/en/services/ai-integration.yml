faq:
  - label: Do we need RAG?
    content: Retrieving relevant passages can help when answers must use your documents. Classification or field extraction may not need a separate knowledge base.
  - label: What about privacy and cost?
    content: Before launch I check provider data processing and retention terms. Costs are estimated from the model and request volume; API usage is billed separately.
content: |-
  ## Experience with NetPostPanel and DigiPulse

  In NetPostPanel, I work with source discovery, content generation and vector search in Qdrant. These operations run through Horizon queues, with model calls tracked in Langfuse. DigiPulse uses a different approach: its MCP server gives AI assistants access to monitoring data.

  Choosing an integration starts with testing the task itself: whether the model produces useful results from your data and where it makes mistakes. When answers need to draw on documents, I add retrieval of relevant passages; when code will process them, I define a structured output format. Since mistakes remain possible with either approach, we agree on how to review answers before launch.

  This testing needs a few examples of inputs and desired outputs. Together with the expected request volume and data restrictions, they help me estimate the integration. One AI feature integrated into your application starts at $2,200.
