faq:
  - label: Which Symfony version should we choose?
    content: We compare support, PHP requirements and package compatibility. The newest version is not automatically the right target.
  - label: Can you migrate custom PHP?
    content: That requires a separate plan covering routes, data and the parts of the old system that remain in use.
content: |-
  ## An upgrade planned around your application

  My work on ticketing websites has spanned several versions of Symfony and PHP. Moving between versions can affect configuration, third-party bundles and custom code, so I start the estimate by reviewing them.

  Deprecation warnings help identify some of the changes needed, while dependency compatibility and API changes need separate checks. If a bundle is no longer maintained, I propose a replacement or discuss adapting the feature that depends on it. I then test the integrations and business workflows affected by the upgrade.

  **To estimate the upgrade, send your Symfony and PHP versions, dependency files and the reason for upgrading.** These let me define the scope of the move to your target version, starting at $1,800. Migrating a custom PHP application to Symfony is estimated separately.
