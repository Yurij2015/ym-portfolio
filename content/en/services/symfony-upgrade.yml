faq:
  - label: Which Symfony version should we choose?
    content: We compare support, PHP requirements and package compatibility. The newest version is not automatically the right target.
  - label: Can you migrate custom PHP?
    content: That requires a separate plan covering routes, data and the parts of the old system that remain in use.
content: |-
  ## The application determines the upgrade

  In the ticket shops I work on, I have dealt with several generations of Symfony and PHP. That experience informs checks around configuration, integrations and business workflows, beyond installing newer packages.

  Deprecation notices provide part of the upgrade plan. Third-party bundles, API changes and custom code also need review. If a package is no longer maintained, I propose a replacement or discuss changing the affected feature.

  Share Symfony and PHP versions, dependency files and the reason for upgrading. The starting price of $1,800 is a guide for an upgrade with a defined target. Moving a custom system to Symfony is separate work.
