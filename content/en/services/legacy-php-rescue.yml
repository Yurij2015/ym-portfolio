faq:
  - label: What if server access is missing?
    content: We need to identify the account owner and provider recovery process. I can assist technically, but recovery depends on ownership rights and available materials.
  - label: Does the project need a rewrite?
    content: We assess this after diagnosis, starting with what can be maintained and what changes are needed to keep it working.
content: |-
  ## Establishing what is available

  Missing setup instructions, unknown dependencies and untested backups make even small changes difficult. The first stage gathers that information and establishes a work order. It may uncover further constraints.

  Docker, deployment automation or a PHP upgrade can be part of the solution, but the scope depends on the project. A full recovery timeline cannot be established from an error description alone.

  Describe what stopped working and which code, credentials and backups remain available. The starting price of $1,800 is a guide for an initial investigation and defined stabilization work.
