faq:
  - label: What if server access is missing?
    content: We need to identify the account owner and provider recovery process. I can assist technically, but recovery depends on ownership rights and available materials.
  - label: Does the project need a rewrite?
    content: We assess this after diagnosis, starting with what can be maintained and what changes are needed to keep it working.
content: |-
  ## First, establish what is available

  When setup instructions are missing, dependencies are unclear and backups have not been tested, even a small change is hard to estimate. I therefore begin by gathering information about the code and infrastructure, working out how to run a copy of the project and checking whether its data can be restored.

  This provides a basis for the first fixes and a longer-term plan. After investigating the problem, I document the current state, make the agreed initial fixes and set out the next steps. If further environment setup, data recovery or deployment changes are needed, I prepare a separate scope and estimate for them.

  We can start with a description of what stopped working and whatever you still have available: source code, access to the system, backups or error messages. These help identify where recovery should begin. The initial investigation and agreed stabilization work start at $1,800.
