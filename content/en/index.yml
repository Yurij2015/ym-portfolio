  title: Yurii Mokryi - Senior Full-Stack PHP Developer
  description: Senior Full-Stack developer with 10+ years of commercial experience. Laravel, Filament, Symfony, Vue/Nuxt. SaaS products, high-load ticketing platforms, AI integrations.
