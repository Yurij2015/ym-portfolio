title: Hi, I'm Yurii Mokryi — Senior Full-Stack PHP Developer
about:
  title: About Me
  description: |
    Full-Stack developer with 10+ years of commercial experience. I build and maintain SaaS products, CRM systems, ticketing/e-commerce platforms, and REST APIs.
    Deep expertise in Laravel (Filament, Octane, FrankenPHP) and Symfony, as well as Vue.js/Nuxt, multi-tenant architectures, and payment system integrations.
description: "10+ years of commercial development: SaaS, CRM and high-load ticketing platforms for Formula 1, MotoGP, EICMA and EuroLeague. Laravel/Symfony + Vue/Nuxt, AI integrations. I take products from empty repo to paying users."
