title: Hi, I'm Yurii Mokryi — Senior Full-Stack PHP Developer
about:
  title: About Me
  description: |
    I work on my own products and contribute to client projects. In VetSpace, I develop a CRM for veterinary clinics; in DigiPulse, website uptime monitoring; and in NetPostPanel, AI-assisted content preparation.
    These products involve Laravel, Filament, queues and APIs. I use Vue and Nuxt for interfaces and Go for separate services. The projects below include examples and technical details.
description: "I have more than 8 years of experience with PHP. I develop SaaS products, CRM systems and ticketing platforms with Laravel and Symfony, with interfaces built in Vue and Nuxt. My work covers user portals, payments, subscriptions and integrations with other services. I also set up deployment and maintain applications after launch."
