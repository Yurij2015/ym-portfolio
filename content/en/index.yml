faq:
  title: Frequently asked questions
  description: The short version on process, technologies and collaboration.
  categories:
    - title: Working together
      questions:
        - label: Do you take over existing projects?
          content: "Yes. Much of my work involves developing and maintaining applications after launch, including code reviews, refactoring and new features. Before making changes, I get to know the project and its release process."
        - label: What does the collaboration process look like?
          content: "We start by discussing the task and reviewing the available materials. I then propose a work plan with a time and cost estimate. During development, I share working changes; we agree together on demo frequency and the release process."
        - label: What happens after the release?
          content: "I can continue working on the product, fixing bugs, reviewing monitoring alerts and adding features. We agree separately on the scope of support and my availability."
    - title: Technologies
      questions:
        - label: What technologies do you work with?
          content: "I use PHP, Laravel and Symfony on the backend, and Vue and Nuxt on the frontend. My own products also use Filament, Redis, Go and integrations with AI providers. For each task, I choose tools that fit the existing project."
        - label: Can you work with our in-house team?
          content: "Yes. I work with the team’s backlog, prepare pull requests and take part in code reviews and technical discussions. We agree on reports and demos at the start of the collaboration."
        - label: What timezone do you work in?
          content: "I work from Poznań, Poland. We discuss communication hours and overlap with your team at the start of the collaboration."
