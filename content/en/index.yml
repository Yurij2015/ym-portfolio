faq:
  title: Frequently asked questions
  description: The short version on process, technologies and collaboration.
  categories:
    - title: Working together
      questions:
        - label: Do you take over existing projects?
          content: "Yes. Most of my work is developing and maintaining production products: codebase audits, refactoring and new features without stopping releases."
        - label: What does the collaboration process look like?
          content: A short brief → estimate with deadlines → development with demos every 1–2 weeks → deployment and support.
        - label: What happens after the release?
          content: Monitoring, bug fixes and product evolution — I stay on support for as long as you need.
    - title: Technologies
      questions:
        - label: What technologies do you work with?
          content: Laravel (Filament, Octane, FrankenPHP) and Symfony on the backend, Vue.js/Nuxt on the frontend, Docker, Terraform, CI/CD, payment integrations and AI.
        - label: Can you work with our in-house team?
          content: "Yes, I integrate comfortably into existing teams: code reviews, shared pipeline, documentation and regular demos."
        - label: What timezone do you work in?
          content: CET (Poznań, Poland), with flexible overlap for Europe and the US.
