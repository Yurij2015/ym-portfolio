title: O mnie
description: "Moja droga od nauki i zleceń freelancerskich do pracy z PHP, platformami sprzedaży biletów i własnymi produktami SaaS."
content: |
  Cześć, jestem **Yurii Mokryi**, Full-Stack PHP Developer. Mieszkam w Poznaniu i pracuję nad aplikacjami internetowymi: od logiki serwerowej i interfejsów po wdrożenie i dalsze utrzymanie.

  W 2010 roku pracowałem jako pracownik naukowy w instytucji naukowej i stworzyłem swoją [pierwszą stronę internetową](/pl/about/first-website). Później zbudowałem stronę na WordPressie dla swojej działalności freelancerskiej; wtedy po raz pierwszy zetknąłem się z PHP. Od 2021 roku pracuję nad aplikacjami w zespołach komercyjnych. Praca naukowa nauczyła mnie weryfikować założenia: ustalać, co wiadomo o problemie, i szukać sposobu na sprawdzenie możliwego wyjaśnienia.

  ## Nad czym pracuję

  W projektach klientów rozwijam platformy sprzedaży biletów w Symfony. Zajmuję się składaniem zamówień, kontami użytkowników, narzędziami administracyjnymi i płatnościami przez Stripe oraz Dalenys. Pracuję z Doctrine, MySQL, Redis i kolejkami, a interfejsy tworzę w Vue.js.

  Równolegle rozwijam własne produkty w ramach DigiSpace. VetSpace to CRM dla klinik weterynaryjnych, a VetCard udostępnia ich publiczne strony i rezerwację wizyt online. W DigiPulse pracuję nad monitoringiem dostępności stron, a w NetPostPanel nad wyszukiwaniem źródeł i przygotowywaniem treści z pomocą AI.

  W tych produktach korzystam z Laravela, Filament, Vue i Nuxt. Część zadań wykonują osobne serwisy Go. Na przykład w DigiPulse taki serwis sprawdza dostępność stron, a Laravel odpowiada za zarządzanie monitorami i powiadomieniami.

  ## Od rozwoju do utrzymania

  We własnych produktach zajmuję się też środowiskami, wdrażaniem i działaniem usług po uruchomieniu. Aplikacje działają w Dockerze, maszynami wirtualnymi zarządzam przez Proxmox, a Caddy pełni rolę reverse proxy. Część infrastruktury DigiPulse jest opisana w Terraform, natomiast kolejne wersje wdrażam automatycznie przez GitHub Actions.

  Ta praca łączy się z codziennym programowaniem: zmiana kodu może wymagać migracji danych, uwzględnienia procesów w tle i konfiguracji środowiska. Dlatego poznając istniejący projekt, sprawdzam również, jak aplikacja jest uruchamiana, testowana i aktualizowana.

  ## Po pracy

  Lubię odkrywać nowe miejsca, odwiedzać poznańskie kawiarnie i podróżować pociągiem oraz samolotem. Z dziećmi chętnie chodzę do kina i restauracji. Śledzę również rozwój AI i technologii chmurowych, a część kodu własnych projektów publikuję na [GitHub](https://github.com/Yurij2015).

  Przykłady i szczegóły techniczne znajdziesz w [projektach](/projects). Jeśli chcesz porozmawiać o swojej aplikacji, [napisz do mnie](https://t.me/YuriiMokryi) i opowiedz, nad czym pracujesz.
