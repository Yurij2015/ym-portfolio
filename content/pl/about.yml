title: O mnie
description: "Moje doświadczenie w programowaniu w PHP, pracy nad platformami sprzedaży biletów i rozwijaniu własnych produktów SaaS."
content: |
  Cześć, jestem **Yurii Mokryi**, Senior Full-Stack PHP Developer z Poznania. Mam ponad 8 lat komercyjnego doświadczenia: buduję i utrzymuję produkty SaaS, systemy CRM, platformy ticketingowe/e-commerce oraz REST API.

  Moja główna praca to full-stack development platformy ticketingowej o wysokim obciążeniu dla dużych wydarzeń sportowych (Formula 1, MotoGP, EICMA, EuroLeague): checkout, konta użytkowników, panele administracyjne, integracja Stripe/Dalenys oraz rozwiązania 3D seat-map. Równolegle, jako założyciel DigiSpace, buduję własne produkty SaaS — DigiPulse (monitorowanie dostępności) i VetSpace (CRM dla klinik weterynaryjnych).

  ## Mój stos technologiczny

  Na backendzie pracuję z **Laravelem** (Filament, Octane, FrankenPHP) i **Symfony**, a na frontendzie z Vue.js i Nuxt. W projektach SaaS zajmuję się oddzieleniem danych klientów, subskrypcjami oraz integracjami ze Stripe, Revolut, Dalenys i innymi API. Do wdrażania i utrzymania wykorzystuję Linux/SSH, Docker, Caddy, CI/CD, Proxmox i Terraform.

  ## Jak pracuję

  Zanim zająłem się programowaniem, przez kilka lat pracowałem w nauce. Został mi z tego nawyk sprawdzania założeń: najpierw ustalam, co wiadomo o problemie, potem wybieram sposób weryfikacji i wyciągam wnioski. Przy pracy nad aplikacją zaczynam od potrzeb użytkowników i poznania obecnego działania systemu. Następnie proponuję zmiany i uzgadniam, jak sprawdzimy ich efekt.

  ## Poza ekranem

  Po pracy lubię odkrywać kawiarnie w Poznaniu, śledzę rozwój AI i technologii chmurowych oraz uczestniczę w projektach open source.

  Jeśli szukasz programisty do nowego lub istniejącego produktu, [opisz zadanie](https://t.me/YuriiMokryi). Omówimy, co trzeba zrobić i jakie informacje będą potrzebne do wyceny. Przykłady mojej pracy znajdziesz w [projektach](/projects).
