faq:
  - label: Inertia czy osobny Nuxt?
    content: Inertia pozwala używać Vue wewnątrz Laravela. Osobny Nuxt może pasować do publicznych stron renderowanych na serwerze. Wybór zależy od wymagań.
  - label: Czy potrzebny jest gotowy projekt graficzny?
    content: Mogę pracować z makietą lub uzgodnioną biblioteką komponentów. Opracowanie osobnego stylu wizualnego trzeba uwzględnić w zakresie.
content: |-
  ## Przykład VetCard

  W VetCard publiczne strony klinik działają na Nuxt, a informacje i dane do rezerwacji online pobierają z API na Laravel. Aby użytkownik mógł wybrać termin wizyty i otrzymać potwierdzenie, interfejs oraz backend muszą wspólnie obsłużyć całą rezerwację — od pobrania dostępnych danych po odpowiedź na wysłany formularz.

  Dlatego podczas prac sprawdzam zarówno wygląd strony, jak i to, co użytkownik widzi w trakcie korzystania z niej: stan ładowania, komunikaty o błędach i potwierdzenie wykonanej operacji. Dla stron publicznych dodatkowo konfiguruję metadane oraz renderowanie serwerowe, aby główna treść znajdowała się w odpowiedzi HTML serwera.

  Aby omówić podobne zadanie, prześlij listę ekranów i działań dostępnych dla użytkownika oraz makiety, jeśli je masz. Na tej podstawie określimy zmiany potrzebne w obu częściach aplikacji. Koszt osobnej części z interfejsem i backendem zaczyna się od $2 400.
