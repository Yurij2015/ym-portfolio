faq:
  - label: Inertia czy osobny Nuxt?
    content: Inertia pozwala używać Vue wewnątrz Laravela. Osobna aplikacja Nuxt
      dobrze sprawdza się przy stronach publicznych wymagających renderowania na
      serwerze. Wybór zależy od wymagań.
  - label: Czy potrzebny jest gotowy projekt graficzny?
    content: Mogę pracować z makietą lub uzgodnioną biblioteką komponentów. Jeśli
      potrzebny jest indywidualny projekt graficzny, uwzględniamy go w zakresie
      prac.
content: |-
  ## Przykład VetCard

  W VetCard publiczne strony klinik działają na Nuxt, a informacje i dane do rezerwacji online pobierają z API w Laravelu. Frontend i backend współpracują na każdym etapie rezerwacji: od pobrania wolnych terminów, przez obsługę formularza, po potwierdzenie wizyty.

  Dlatego podczas prac sprawdzam zarówno wygląd strony, jak i to, co użytkownik widzi w trakcie korzystania z niej: stan ładowania, komunikaty o błędach i potwierdzenie wykonanej operacji. Dla stron publicznych dodatkowo konfiguruję metadane oraz renderowanie serwerowe, aby główna treść znajdowała się w odpowiedzi HTML serwera.

  **Aby wycenić podobną funkcję, prześlij listę ekranów i opisz, co użytkownik ma na nich robić.** Dołącz makiety, jeśli je masz. Wspólnie określimy zmiany po stronie frontendu i backendu. Taka funkcja kosztuje od 9600 zł.
