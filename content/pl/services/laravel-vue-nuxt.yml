faq:
  - label: Inertia czy osobny Nuxt?
    content: Inertia pozwala używać Vue wewnątrz Laravela. Osobny Nuxt może pasować do publicznych stron renderowanych na serwerze. Wybór zależy od wymagań.
  - label: Czy potrzebny jest gotowy projekt graficzny?
    content: Mogę pracować z makietą lub uzgodnioną biblioteką komponentów. Opracowanie osobnego stylu wizualnego trzeba uwzględnić w zakresie.
content: |-
  ## Przykład VetCard

  VetCard korzysta z Nuxt dla publicznych stron klinik oraz Laravel API do danych i rezerwacji wizyt. Obie części muszą współpracować: użytkownik potrzebuje aktualnych informacji, formularza rezerwacji i czytelnego wyniku.

  Dla stron publicznych konfiguruję metadane i renderowanie serwerowe zgodnie z zadaniem. Ułatwia to dostęp do treści wyszukiwarkom, ale nie gwarantuje pozycji ani indeksowania.

  Prześlij ekrany, makiety, jeśli są dostępne, i potrzebne działania. Cena od $2 400 jest orientacyjnym budżetem na określoną część aplikacji z frontendem i backendem, a nie produkt dowolnej wielkości.
