faq:
  - label: Czy potrzebujesz dostępu do produkcji?
    content: Na początek zwykle wystarcza repozytorium i opis problemu. Logi, dane testowe i środowisko dobieramy do zakresu.
  - label: Czy poprawki są w cenie?
    content: Wynikiem audytu jest raport. Poprawki możemy uzgodnić osobno lub przekazać Twojemu zespołowi.
content: |-
  ## Przegląd z określonym celem

  Audyt powinien odpowiadać na pytanie: dlaczego nie działa płatność, gdzie brakuje kontroli dostępu lub co utrudnia rozwój modułu. Przy ogólnym przeglądzie najpierw wybieramy obszary priorytetowe.

  Raport opisuje sprawdzony zakres i wnioski potwierdzone kodem lub odtworzeniem błędu. Zalecenia dotyczące struktury oddzielam od defektów. Ograniczony przegląd nie potwierdza braku innych problemów.

  Prześlij opis aplikacji i pytania, na które ma odpowiedzieć audyt. Cena od $1 000 jest orientacyjnym budżetem przeglądu określonych modułów z raportem. Wdrażanie poprawek nie jest częścią audytu.
