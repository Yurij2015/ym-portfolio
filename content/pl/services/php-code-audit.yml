faq:
  - label: Czy potrzebujesz dostępu do produkcji?
    content: Na początek zwykle wystarcza repozytorium i opis problemu. W zależności od zakresu mogą być też potrzebne logi, dane testowe lub dostęp do środowiska.
  - label: Czy poprawki są w cenie?
    content: Wynikiem audytu jest raport. Poprawki możemy uzgodnić osobno lub przekazać Twojemu zespołowi.
content: |-
  ## Od czego zaczyna się audyt

  Najpierw określamy, na jakie pytania ma odpowiedzieć przegląd: dlaczego płatność nie przechodzi, gdzie brakuje kontroli dostępu lub co utrudnia rozwój modułu. Jeśli potrzebny jest ogólny przegląd, ustalamy, którym częściom systemu poświęcić najwięcej uwagi.

  Ten zakres wyznacza również zawartość raportu: opisuję w nim sprawdzone obszary i wnioski potwierdzone kodem lub odtworzonym błędem. Przy każdym problemie opisuję jego skutki i proponuję rozwiązanie, a sugestie dotyczące struktury kodu oddzielam od błędów. Dzięki temu zespół wie, co naprawić najpierw i jakie obszary zostały sprawdzone.

  Aby określić zakres audytu, prześlij krótki opis aplikacji oraz kwestie, które chcesz wyjaśnić. Na tej podstawie uzgodnimy moduły do sprawdzenia. Koszt ich analizy i przygotowania raportu zaczyna się od $1 000.
