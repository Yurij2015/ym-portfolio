faq:
  - label: Czy potrzebujesz dostępu do produkcji?
    content: Na początek zwykle wystarcza repozytorium i opis problemu. Logi, dane testowe i środowisko dobieramy do zakresu.
  - label: Czy poprawki są w cenie?
    content: Wynikiem audytu jest raport. Poprawki możemy uzgodnić osobno lub przekazać Twojemu zespołowi.
content: |-
  ## Od czego zaczyna się audyt

  Najpierw określamy pytania, na które ma odpowiedzieć przegląd: dlaczego płatność nie przechodzi, gdzie brakuje kontroli dostępu lub co utrudnia rozwój modułu. Jeśli potrzebny jest ogólny przegląd, wybieramy najważniejsze części systemu, aby poświęcić czas właśnie im.

  Ten zakres wyznacza również zawartość raportu: opisuję w nim sprawdzone obszary i wnioski potwierdzone kodem lub odtworzonym błędem. Dla każdego problemu wyjaśniam konsekwencje i zalecam poprawkę, a uwagi dotyczące struktury kodu przedstawiam osobno od defektów. Dzięki temu zespół widzi zarówno priorytety, jak i granice przeprowadzonej analizy.

  Aby określić zakres audytu, prześlij krótki opis aplikacji oraz pytania, które Cię niepokoją. Na tej podstawie uzgodnimy moduły do sprawdzenia. Koszt ich analizy i przygotowania raportu zaczyna się od $1 000.
