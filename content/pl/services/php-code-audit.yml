faq:
  - label: Czy potrzebujesz dostępu do produkcji?
    content: Na początek zwykle wystarcza repozytorium i opis problemu. W zależności
      od zakresu mogą być też potrzebne logi, dane testowe lub dostęp do
      środowiska.
  - label: Czy poprawki są w cenie?
    content: Wynikiem audytu jest raport. Poprawki możemy uzgodnić osobno lub
      przekazać Twojemu zespołowi.
content: |-
  ## Od czego zaczyna się audyt

  Najpierw określamy, na jakie pytania ma odpowiedzieć przegląd: dlaczego płatność nie przechodzi, gdzie brakuje kontroli dostępu lub co utrudnia rozwój modułu. Jeśli potrzebny jest ogólny przegląd, ustalamy, którym częściom systemu poświęcić najwięcej uwagi.

  W raporcie zaznaczam, które obszary sprawdziłem i jakie wnioski potwierdza kod lub odtworzony błąd. Przy każdym problemie wyjaśniam jego skutki i proponuję rozwiązanie, a sugestie dotyczące struktury kodu oddzielam od błędów. Dzięki temu zespół wie, co naprawić najpierw i jakie obszary zostały sprawdzone.

  **Aby ustalić zakres audytu, prześlij krótki opis aplikacji i pytania, na które chcesz uzyskać odpowiedź.** Pozwoli mi to wybrać moduły do sprawdzenia. Analiza wraz z raportem kosztuje od 4000 zł.
