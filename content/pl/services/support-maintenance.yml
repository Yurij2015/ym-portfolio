faq:
  - label: Czy utrzymujesz kod innych programistów?
    content: Tak. Najpierw potrzebny jest przegląd. Jeśli aplikacji nie da się uruchomić lub brakuje dostępów, najpierw wyceniamy stabilizację.
  - label: Czy obejmuje to całodobową obsługę awarii?
    content: Stały dyżur 24/7 nie jest częścią podstawowej usługi godzinowej. Dostępność i czas reakcji wymagają osobnego uzgodnienia przed współpracą.
content: |-
  ## Ustalenia na początku współpracy

  Utrzymanie może obejmować poprawki, aktualizacje zależności, kontrolę kopii i drobne zmiany produktu. To różne zadania, dlatego najpierw określamy priorytety i dostępny czas. Duże aktualizacje oraz nowe moduły wyceniam osobno.

  Do monitorowania dostępności można wykorzystać mój DigiPulse z powiadomieniami Telegram i email. Monitoring pomaga wykryć awarię, ale nie zastępuje ustalonego procesu reagowania.

  Napisz, kto obecnie utrzymuje produkt i jakie zadania się zbierają. Stawka zaczyna się od $50 za godzinę pracy. Częstotliwość kontroli, dostępność i obsługę zgłoszeń ustalamy przed rozpoczęciem; stały dyżur nie jest częścią podstawowej usługi.
