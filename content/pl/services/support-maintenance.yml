faq:
  - label: Czy utrzymujesz kod innych programistów?
    content: Tak. Najpierw potrzebny jest przegląd. Jeśli aplikacji nie da się uruchomić lub brakuje dostępów, najpierw wyceniamy stabilizację.
  - label: Czy obejmuje to całodobową obsługę awarii?
    content: Stały dyżur 24/7 nie jest częścią podstawowej usługi godzinowej. Dostępność i czas reakcji wymagają osobnego uzgodnienia przed współpracą.
content: |-
  ## Co ustalamy na początku

  Działający produkt często potrzebuje jednocześnie poprawek, aktualizacji zależności i niewielkich zmian. Aby podzielić czas między te zadania, najpierw przeglądam stan aplikacji, a następnie wspólnie ustalamy priorytety, budżet i harmonogram utrzymania. Duże aktualizacje oraz nowe moduły wyceniam osobno.

  Plan obejmuje też sposób reagowania na awarie. Dostępność strony można śledzić przez mój serwis DigiPulse z powiadomieniami w Telegram i email. Przed rozpoczęciem prac uzgadniamy, kto otrzymuje te wiadomości i jakie działania podejmuje dalej.

  Aby omówić utrzymanie Twojego produktu, opowiedz, kto zajmuje się nim obecnie i jakie zadania się gromadzą. Pomoże to ustalić częstotliwość kontroli oraz sposób zgłaszania potrzeb. Praca jest rozliczana godzinowo, według stawki od $50.
