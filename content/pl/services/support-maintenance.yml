faq:
  - label: Czy utrzymujesz kod innych programistów?
    content: Tak. Najpierw potrzebny jest przegląd. Jeśli aplikacji nie da się
      uruchomić lub brakuje dostępu do systemu, zaczynamy od ustalenia prac
      potrzebnych do przywrócenia jej działania.
  - label: Czy obejmuje to całodobową obsługę awarii?
    content: Usługa godzinowa nie obejmuje dyżuru 24/7. Dostępność i czas reakcji
      ustalamy przed rozpoczęciem współpracy.
content: |-
  ## Co ustalamy na początku

  Działający produkt często potrzebuje jednocześnie poprawek, aktualizacji zależności i niewielkich zmian. Zaczynam od przeglądu aplikacji, a potem wspólnie ustalamy, czym zająć się najpierw, jaki mamy budżet i jak często potrzebne będzie wsparcie. Duże aktualizacje oraz nowe moduły wyceniam osobno.

  Plan obejmuje też sposób reagowania na awarie. Dostępność strony można śledzić przez mój serwis DigiPulse wysyłający powiadomienia przez Telegram i email. Przed rozpoczęciem prac uzgadniamy, kto otrzymuje te wiadomości i jakie działania podejmuje dalej.

  **Aby omówić utrzymanie Twojego produktu, opowiedz, kto zajmuje się nim obecnie i jakie zadania czekają na realizację.** Ustalimy, jak często sprawdzać aplikację i w jaki sposób zgłaszać zadania. Rozliczam się godzinowo, a stawka zaczyna się od 140 zł za godzinę. Ostateczną stawkę omawiamy przed rozpoczęciem współpracy.
