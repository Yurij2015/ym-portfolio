faq:
  - label: Co jeśli brakuje dostępu do serwera?
    content: Trzeba ustalić właściciela konta i procedurę odzyskania u dostawcy. Pomogę technicznie, ale wynik zależy od uprawnień i materiałów.
  - label: Czy projekt trzeba przepisać?
    content: Oceniamy to po diagnozie. Najpierw sprawdzamy, co można utrzymywać i jakie zmiany są potrzebne do działania.
content: |-
  ## Najpierw ustalić, co jest dostępne

  Gdy brakuje instrukcji uruchomienia, zależności są nieznane, a kopii zapasowych nie sprawdzano, trudno wycenić nawet niewielką zmianę. Dlatego najpierw zbieram informacje o kodzie i infrastrukturze, ustalam sposób uruchomienia kopii projektu oraz sprawdzam możliwość odtworzenia danych.

  Daje to podstawę do pierwszych poprawek i dalszego planu. Po diagnozie opisuję obecny stan, usuwam uzgodnione problemy blokujące pracę i określam kolejne kroki. Jeśli potrzebne są dodatkowa konfiguracja środowiska, odzyskanie danych lub zmiana wdrażania, przygotowuję dla nich osobny zakres i wycenę.

  Możemy zacząć od opisu tego, co przestało działać, i materiałów, które pozostały: kodu, dostępów, kopii zapasowych czy komunikatów o błędach. Pomogą one ustalić, od czego rozpocząć przywracanie projektu. Koszt diagnozy i pierwszych uzgodnionych prac stabilizacyjnych zaczyna się od $1 800.
