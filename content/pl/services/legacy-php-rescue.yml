faq:
  - label: Co jeśli brakuje dostępu do serwera?
    content: Trzeba ustalić właściciela konta i procedurę odzyskania u dostawcy. Pomogę technicznie, ale wynik zależy od uprawnień i materiałów.
  - label: Czy projekt trzeba przepisać?
    content: Oceniamy to po diagnozie. Najpierw sprawdzamy, co można utrzymywać i jakie zmiany są potrzebne do działania.
content: |-
  ## Najpierw ustalenie dostępnych materiałów

  Brak instrukcji uruchomienia, nieznane zależności i niesprawdzone kopie utrudniają nawet drobne zmiany. Pierwszy etap zbiera te informacje i określa kolejność działań. Może też ujawnić dodatkowe ograniczenia.

  Docker, automatyzacja wdrożeń lub aktualizacja PHP mogą być częścią rozwiązania, ale zakres zależy od projektu. Terminu pełnego przywrócenia nie da się ustalić wyłącznie z opisu błędu.

  Opisz, co przestało działać i jakie kod, dostępy oraz kopie pozostały. Cena od $1 800 jest orientacyjnym budżetem wstępnej analizy i określonych prac stabilizacyjnych.
