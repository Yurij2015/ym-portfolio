faq:
  - label: Co jeśli brakuje dostępu do serwera?
    content: Trzeba ustalić właściciela konta i procedurę odzyskania u dostawcy.
      Mogę pomóc od strony technicznej, ale możliwość odzyskania dostępu zależy
      od uprawnień właściciela i tego, co udało się zachować.
  - label: Czy projekt trzeba przepisać?
    content: Oceniamy to po diagnozie. Najpierw sprawdzamy, co można utrzymywać i
      jakie zmiany są potrzebne do działania.
content: |-
  ## Najpierw ustalić, co jest dostępne

  Gdy brakuje instrukcji uruchomienia, nie wiadomo, od czego zależy aplikacja, a kopie zapasowe nie były sprawdzane, trudno wycenić nawet niewielką zmianę. Dlatego najpierw zbieram informacje o kodzie i infrastrukturze, ustalam sposób uruchomienia kopii projektu oraz sprawdzam możliwość odtworzenia danych.

  Po tej analizie opisuję stan projektu i usuwam uzgodnione problemy, które blokują pracę. Pozostałe ustalenia zbieram w planie dalszych działań. Jeśli dalsze prace wymagają konfiguracji środowiska, odzyskania danych lub zmiany sposobu wdrażania, wyceniam je osobno.

  **Opisz, co przestało działać, i daj znać, czy masz kod, dostęp do systemu, kopie zapasowe lub komunikaty o błędach.** To wystarczy, żeby ustalić punkt wyjścia. Diagnoza i pierwsze uzgodnione prace nad przywróceniem projektu do działania kosztują od 7200 zł.
