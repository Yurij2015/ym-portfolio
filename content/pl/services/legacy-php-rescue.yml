faq:
  - label: Co jeśli brakuje dostępu do serwera?
    content: Trzeba ustalić właściciela konta i procedurę odzyskania u dostawcy. Mogę pomóc od strony technicznej, ale możliwość odzyskania dostępu zależy od uprawnień właściciela i tego, co udało się zachować.
  - label: Czy projekt trzeba przepisać?
    content: Oceniamy to po diagnozie. Najpierw sprawdzamy, co można utrzymywać i jakie zmiany są potrzebne do działania.
content: |-
  ## Najpierw ustalić, co jest dostępne

  Gdy brakuje instrukcji uruchomienia, nie wiadomo, od czego zależy aplikacja, a kopie zapasowe nie były sprawdzane, trudno wycenić nawet niewielką zmianę. Dlatego najpierw zbieram informacje o kodzie i infrastrukturze, ustalam sposób uruchomienia kopii projektu oraz sprawdzam możliwość odtworzenia danych.

  Na tej podstawie mogę zaplanować pierwsze poprawki i kolejne etapy prac. Po diagnozie opisuję obecny stan, usuwam uzgodnione problemy blokujące pracę i określam kolejne kroki. Jeśli potrzebne są dodatkowa konfiguracja środowiska, odzyskanie danych lub zmiana wdrażania, przygotowuję dla nich osobny zakres i wycenę.

  Możemy zacząć od opisu tego, co przestało działać, i informacji o tym, co jest dostępne: kodzie, dostępie do systemu, kopiach zapasowych czy komunikatach o błędach. Pomogą one ustalić, od czego rozpocząć przywracanie projektu. Koszt diagnozy i pierwszych uzgodnionych prac stabilizacyjnych zaczyna się od $1 800.
