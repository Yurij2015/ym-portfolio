faq:
  - label: Którą wersję Symfony wybrać?
    content: Porównamy okres wsparcia, wymagania PHP i zgodność pakietów. Najnowsza wersja nie zawsze będzie właściwym celem.
  - label: Czy można przenieść autorski PHP?
    content: Taka migracja wymaga osobnego planu tras, danych i części starego systemu pozostających w użyciu.
content: |-
  ## Zakres aktualizacji zależy od aplikacji

  W sklepach biletowych, nad którymi pracuję, miałem do czynienia z różnymi generacjami Symfony i PHP. To doświadczenie pomaga sprawdzać konfigurację, integracje i procesy biznesowe, a nie tylko instalować nowsze pakiety.

  Ostrzeżenia o przestarzałych wywołaniach dają część informacji potrzebnych do przejścia. Osobno analizuję zewnętrzne bundle, zmiany API i własny kod. Dla nieutrzymywanego pakietu proponuję zamiennik lub zmianę danej funkcji.

  Prześlij wersje Symfony i PHP, pliki zależności i powód aktualizacji. Cena od $1 800 jest orientacyjnym budżetem przejścia na określoną wersję. Migracja autorskiego systemu do Symfony to osobna praca.
