faq:
  - label: Którą wersję Symfony wybrać?
    content: Porównamy okres wsparcia, wymagania PHP i zgodność pakietów. Najnowsza wersja nie zawsze będzie właściwym celem.
  - label: Czy można przenieść autorską aplikację PHP do Symfony?
    content: Taka migracja wymaga osobnego planu tras, danych i części starego systemu pozostających w użyciu.
content: |-
  ## Aktualizacja dopasowana do aplikacji

  W pracy nad sklepami biletowymi miałem do czynienia z różnymi wersjami Symfony i PHP. Przejście między wersjami może wymagać zmian w konfiguracji, zewnętrznych bundlach i własnym kodzie, dlatego wycenę zaczynam od ich przeglądu.

  Ostrzeżenia o przestarzałych wywołaniach pomagają znaleźć część potrzebnych zmian, natomiast zgodność zależności i zmiany API sprawdzam osobno. Jeśli bundle nie jest już utrzymywany, proponuję zamiennik lub ustalamy, jak zmienić funkcję, która z niego korzysta. Następnie sprawdzam integracje i scenariusze biznesowe, których dotyczyła aktualizacja.

  Na początek prześlij wersje Symfony i PHP, pliki zależności oraz powód aktualizacji. Na ich podstawie określę zakres aktualizacji do docelowej wersji. Koszt prac zaczyna się od $1 800. Jeśli potrzebna jest migracja autorskiego systemu PHP do Symfony, przygotowuję osobną wycenę.
