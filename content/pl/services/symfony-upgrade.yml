faq:
  - label: Którą wersję Symfony wybrać?
    content: Porównamy okres wsparcia, wymagania PHP i zgodność pakietów. Najnowsza
      wersja nie zawsze będzie właściwym celem.
  - label: Czy można przenieść autorską aplikację PHP do Symfony?
    content: Taka migracja wymaga osobnego planu tras, danych i części starego
      systemu pozostających w użyciu.
content: |-
  ## Aktualizacja dopasowana do aplikacji

  W pracy nad sklepami biletowymi miałem do czynienia z różnymi wersjami Symfony i PHP. Przejście między wersjami może wymagać zmian w konfiguracji, zewnętrznych bundlach i własnym kodzie, dlatego wycenę zaczynam od ich przeglądu.

  Ostrzeżenia o przestarzałych wywołaniach wskazują część miejsc do poprawy. Osobno sprawdzam zgodność zależności i zmiany w API. Jeśli bundle nie jest już utrzymywany, proponuję zamiennik lub ustalamy, jak zmienić funkcję, która z niego korzysta. Następnie sprawdzam integracje i scenariusze biznesowe, których dotyczyła aktualizacja.

  Na początek prześlij wersje Symfony i PHP, pliki zależności oraz powód aktualizacji. Pozwolą mi one ocenić, co trzeba zmienić, aby przejść na docelową wersję. Aktualizacja kosztuje od 7200 zł. Jeśli potrzebna jest migracja autorskiego systemu PHP do Symfony, przygotowuję osobną wycenę.
