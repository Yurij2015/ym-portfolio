faq:
  - label: Którą wersję Symfony wybrać?
    content: Porównamy okres wsparcia, wymagania PHP i zgodność pakietów. Najnowsza wersja nie zawsze będzie właściwym celem.
  - label: Czy można przenieść autorski PHP?
    content: Taka migracja wymaga osobnego planu tras, danych i części starego systemu pozostających w użyciu.
content: |-
  ## Aktualizacja dopasowana do aplikacji

  W pracy nad sklepami biletowymi miałem do czynienia z różnymi generacjami Symfony i PHP. Przejście między wersjami może wymagać zmian w konfiguracji, zewnętrznych bundlach i własnym kodzie, dlatego wycenę zaczynam od ich przeglądu.

  Ostrzeżenia o przestarzałych wywołaniach pomagają znaleźć część potrzebnych zmian, natomiast zgodność zależności i zmiany API sprawdzam osobno. Jeśli bundle nie jest już utrzymywany, proponuję zamiennik lub omawiam dostosowanie zależnej funkcji. Następnie sprawdzam integracje i scenariusze biznesowe, których dotyczyła aktualizacja.

  Na początek prześlij wersje Symfony i PHP, pliki zależności oraz powód aktualizacji. Pozwolą mi one określić zakres przejścia do docelowej wersji, którego koszt zaczyna się od $1 800. Jeśli potrzebne jest przeniesienie własnego systemu na Symfony, przygotowuję osobną wycenę.
