faq:
  - label: Czy można zacząć od krótkiego zadania?
    content: Tak. Pierwsze płatne zadanie pozwala sprawdzić współpracę i poznać
      projekt. Zakres oraz warunki ustalamy wcześniej.
  - label: W jakiej strefie czasowej pracujesz?
    content: Pracuję w Poznaniu. Na początku ustalamy godziny pracy i ich pokrycie z
      godzinami Twojego zespołu. Komunikuję się po ukraińsku i angielsku.
content: |-
  ## Nad czym pracuję

  Pracuję nad sklepami biletowymi opartymi na Symfony, MySQL, Redis i Vue.js, z płatnościami przez Stripe i Dalenys. Równolegle rozwijam własne produkty: VetSpace — CRM dla klinik weterynaryjnych z oddzielnymi bazami danych i subskrypcjami Stripe, DigiPulse na Laravel i Go oraz NetPostPanel z kolejkami i integracjami AI.

  Z tego doświadczenia korzystam również w pracy zespołowej, gdy biorę na siebie rozwój konkretnej funkcji lub część zadań z backlogu. Najpierw poznaję powiązany kod i proponuję rozwiązanie, a następnie przygotowuję zmiany z testami i przekazuję je do przeglądu przez pull request. Sprawdzam też kod innych programistów i od razu zgłaszam pytania lub zależności wpływające na rozwiązanie.

  **Aby omówić współpracę, prześlij stos technologiczny i dwa lub trzy zadania, które chcesz mi przekazać.** Na ich przykładzie ustalimy moją rolę w zespole i potrzebną liczbę godzin. Pracuję według stawki od 140 zł za godzinę; wymiar współpracy i termin rozpoczęcia zależą od mojej dostępności. Ostateczną stawkę ustalamy wspólnie, biorąc pod uwagę zadania i planowaną długość współpracy.
