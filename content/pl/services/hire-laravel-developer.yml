faq:
  - label: Czy można zacząć od krótkiego zadania?
    content: Tak. Pierwsze płatne zadanie pozwala sprawdzić współpracę i poznać projekt. Zakres oraz warunki ustalamy wcześniej.
  - label: W jakiej strefie czasowej pracujesz?
    content: Pracuję z Poznania. Godziny pracy i czas wspólny z zespołem uzgadniamy osobno. Komunikuję się po ukraińsku i angielsku.
content: |-
  ## Nad czym pracuję

  Pracuję nad sklepami biletowymi opartymi na Symfony, MySQL, Redis i Vue.js, z płatnościami przez Stripe i Dalenys. Równolegle rozwijam własne produkty: VetSpace — CRM dla klinik weterynaryjnych z osobnymi bazami danych i subskrypcjami Stripe, DigiPulse na Laravel i Go oraz NetPostPanel z kolejkami i integracjami AI.

  Z tego doświadczenia korzystam również w pracy zespołowej, gdy przejmuję osobną funkcję lub część backlogu. Najpierw poznaję powiązany kod i proponuję rozwiązanie, a następnie przygotowuję zmiany z testami i przekazuję je do przeglądu przez pull request. Sprawdzam też kod innych programistów i od razu zgłaszam pytania lub zależności wpływające na rozwiązanie.

  Na początek prześlij stos technologiczny i dwa lub trzy zadania z backlogu, które chcesz przekazać. Na ich przykładzie ustalimy moją rolę i potrzebny wymiar czasu. Stawka zaczyna się od $50 za godzinę, a liczbę godzin i termin rozpoczęcia uzgadniamy z uwzględnieniem mojej dostępności.
