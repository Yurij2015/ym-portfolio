faq:
  - label: Czy można zacząć od krótkiego zadania?
    content: Tak. Pierwsze płatne zadanie pozwala sprawdzić współpracę i poznać projekt. Zakres oraz warunki ustalamy wcześniej.
  - label: W jakiej strefie czasowej pracujesz?
    content: Pracuję z Poznania. Godziny pracy i czas wspólny z zespołem uzgadniamy osobno. Komunikuję się po ukraińsku i angielsku.
content: |-
  ## Doświadczenie w rozwoju i utrzymaniu produktów

  Pracuję nad sklepami biletowymi opartymi na Symfony, MySQL, Redis i Vue.js, z płatnościami Stripe i Dalenys. We własnym VetSpace rozwijam CRM weterynaryjny z oddzielnymi danymi klinik i subskrypcjami Stripe. W DigiPulse pracuję z Laravelem, Go i monitoringiem, a w NetPostPanel z kolejkami i integracjami AI.

  Mogę przejąć funkcję lub część backlogu: przeanalizować powiązany kod, zaproponować implementację, napisać testy i przygotować pull request. Prowadzę też przeglądy zmian innych programistów. Pytania i zależności wpływające na realizację zgłaszam w trakcie pracy.

  Prześlij technologie i dwa lub trzy zadania z backlogu, które chcesz przekazać. Pomoże to określić moją rolę i potrzebny czas. Stawka godzinowa zaczyna się od $50; liczbę godzin i termin rozpoczęcia ustalamy według dostępności.
