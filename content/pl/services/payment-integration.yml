faq:
  - label: Z jakimi płatnościami pracowałeś?
    content: Stripe we własnym VetSpace (subskrypcje przez Cashier) oraz w sklepach biletowych, które korzystają też z Dalenys. W marketplace klienta wdrażałem Stripe Connect. Integrowałem również Revolut. Innego dostawcę sprawdzę najpierw w dokumentacji.
  - label: Czy można dodać subskrypcje do istniejącego produktu?
    content: Tak. Ustalamy plany, dostęp po opłaceniu, zmianę taryfy, anulowanie i zachowanie po nieudanej płatności.
content: |-
  ## Uzgodnienie całego procesu

  Strona udanej płatności to tylko część integracji. Trzeba określić potwierdzanie operacji, komunikat przy opóźnieniu i obsługę ponowionego zdarzenia od dostawcy.

  W VetSpace pracuję z subskrypcjami Stripe. W NetPostPanel integracje z usługami zewnętrznymi są częścią przetwarzania treści w tle. W obu przypadkach potrzebna jest obsługa błędów i czytelny stan operacji.

  W marketplace, który tworzyłem dla klienta w Laravelu, płatności działają przez Stripe Connect. Sprzedawcy podłączają własne konto Stripe, kupujący płaci przez Checkout, platforma pobiera prowizję, a uczestnicy programu partnerskiego otrzymują swoją prowizję przelewem. Status zamówień aktualizują webhooki platformy i podłączonych kont.

  Dla płatności podaj dostawcę i potrzebne operacje: płatność jednorazową, subskrypcje lub zwroty. Dla innego API prześlij dokumentację i dane do wymiany. Cena od $1 600 jest orientacyjnym budżetem integracji; prowizje dostawcy są osobnym kosztem.
