faq:
  - label: Z jakimi płatnościami pracowałeś?
    content: Stripe we własnym VetSpace (subskrypcje przez Cashier) oraz w sklepach biletowych, które korzystają też z Dalenys. W marketplace klienta wdrażałem Stripe Connect. Integrowałem również Revolut. Innego dostawcę sprawdzę najpierw w dokumentacji.
  - label: Czy można dodać subskrypcje do istniejącego produktu?
    content: Tak. Ustalamy plany, dostęp po opłaceniu, zmianę taryfy, anulowanie i zachowanie po nieudanej płatności.
content: |-
  ## Co obejmuje integracja

  Po płatności aplikacja musi potwierdzić transakcję po swojej stronie i zaktualizować jej status. Jeśli odpowiedź dostawcy się opóźnia lub webhook dociera ponownie, system powinien prawidłowo obsłużyć te zdarzenia i pokazać użytkownikowi zrozumiały stan. Dlatego integracja obejmuje cały proces, wraz z błędami i powtórzonymi komunikatami.

  Z subskrypcjami Stripe pracuję we własnym VetSpace. Bardziej złożony podział płatności wdrożyłem przez Stripe Connect w marketplace klienta na Laravel: sprzedawcy podłączają własne konta, kupujący płaci przez Checkout, a platforma zatrzymuje swoją prowizję. Uczestnicy programu partnerskiego również otrzymują prowizję, natomiast statusy zamówień aktualizują webhooki platformy i podłączonych kont.

  Podobnej uwagi do błędów i statusów wymagają inne usługi zewnętrzne. Na przykład w NetPostPanel ich API są wywoływane w zadaniach przygotowania treści wykonywanych w tle, gdzie wynik musi być czytelny również po zakończeniu samego zapytania.

  Do wyceny integracji płatności podaj wybranego dostawcę i potrzebne operacje: płatności jednorazowe, subskrypcje lub zwroty. W przypadku innego API przydadzą się dokumentacja i opis wymienianych danych. Koszt integracji zaczyna się od $1 600, a opłaty dostawcy są rozliczane osobno.
