faq:
  - label: Jakie systemy płatności integrowałeś?
    content: Pracowałem ze Stripe we własnym VetSpace, gdzie subskrypcje obsługuje
      Cashier, oraz w sklepach biletowych korzystających również z Dalenys. W
      marketplace klienta wdrażałem Stripe Connect. Integrowałem również
      Revolut. W przypadku nowego dostawcy najpierw zapoznaję się z jego
      dokumentacją.
  - label: Czy można dodać subskrypcje do istniejącego produktu?
    content: Tak. Ustalamy plany, dostęp po opłaceniu, zmianę taryfy, anulowanie i
      zachowanie po nieudanej płatności.
content: |-
  ## Co obejmuje integracja

  Po płatności aplikacja musi potwierdzić transakcję po swojej stronie i zaktualizować jej status. Jeśli odpowiedź dostawcy się opóźnia lub webhook dociera ponownie, system powinien prawidłowo obsłużyć te zdarzenia i pokazać użytkownikowi, na jakim etapie jest płatność. Dlatego integracja obejmuje cały proces, wraz z błędami i powtórzonymi komunikatami.

  Z subskrypcjami Stripe pracuję we własnym VetSpace. Na platformie marketplace jednego z klientów wdrożyłem bardziej złożony podział płatności, korzystając z Laravela i Stripe Connect: sprzedawcy podłączają własne konta, kupujący płaci przez Checkout, a platforma zatrzymuje swoją prowizję. Uczestnicy programu partnerskiego również otrzymują prowizję, natomiast statusy zamówień aktualizują webhooki platformy i podłączonych kont.

  Przy integracji innych usług zewnętrznych również dbam o obsługę błędów i śledzenie statusu operacji. W NetPostPanel wywołania API są częścią zadań przygotowania treści wykonywanych w tle. Aplikacja musi więc zapisać, czy zadanie się powiodło, także po zakończeniu pierwotnego zapytania.

  Jeśli potrzebujesz integracji płatności, podaj wybranego dostawcę i opisz potrzebne operacje: płatności jednorazowe, subskrypcje lub zwroty. W przypadku innego API przydadzą się dokumentacja i opis wymienianych danych. Integracja kosztuje od 6400 zł. Opłaty dostawcy są rozliczane osobno.
