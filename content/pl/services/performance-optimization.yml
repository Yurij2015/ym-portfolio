faq:
  - label: Czy potrzebny jest mocniejszy serwer?
    content: Być może. Najpierw ustalamy ograniczający zasób i możliwość zmniejszenia obciążenia przez zmiany aplikacji.
  - label: Czy wystarczy schemat bazy?
    content: Pomaga zrozumieć strukturę, ale analiza wydajności może wymagać planów zapytań, statystyk i reprezentatywnych danych testowych.
content: |-
  ## Pomiar konkretnej operacji

  Wolny raport i powolna rezerwacja wizyty mogą mieć różne przyczyny, dlatego najpierw trzeba odtworzyć opóźnienie odczuwane przez użytkowników. W tym celu mierzę czas odpowiedzi, sprawdzam ilość danych i zależności zewnętrzne. Kiedy wiadomo już, gdzie powstaje opóźnienie, można wybrać zmianę i uzgodnić wskaźniki oceny wyniku.

  Po poprawce powtarzam tę samą operację z porównywalną ilością danych i zestawiam czas wykonania oraz zużycie zasobów. Jednocześnie sprawdzam poprawność odpowiedzi, ponieważ szybszy raport nadal musi zwracać te same dane.

  Na początek pokaż stronę lub operację, na którą trzeba czekać, i opisz, kiedy pojawia się opóźnienie. Jeśli masz już logi lub pomiary, pomogą one w diagnozie. Koszt diagnozy i pracy nad jedną konkretną przyczyną zaczyna się od $1 200.
