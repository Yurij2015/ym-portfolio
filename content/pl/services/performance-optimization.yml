faq:
  - label: Czy potrzebny jest mocniejszy serwer?
    content: Być może. Najpierw sprawdzam, którego zasobu brakuje i czy zmiany w
      aplikacji mogą zmniejszyć obciążenie.
  - label: Czy wystarczy schemat bazy?
    content: Pomaga zrozumieć strukturę, ale analiza wydajności może wymagać planów
      zapytań, statystyk i reprezentatywnych danych testowych.
content: |-
  ## Pomiar konkretnej operacji

  Raport może generować się zbyt długo z innego powodu niż zapis na wizytę. Dlatego najpierw odtwarzam operację, przy której użytkownicy zauważają opóźnienie. W tym celu mierzę czas odpowiedzi, sprawdzam ilość danych i zależności zewnętrzne. Kiedy wiadomo już, gdzie powstaje opóźnienie, możemy uzgodnić poprawkę i sposób zmierzenia jej efektu.

  Po poprawce powtarzam tę samą operację z porównywalną ilością danych i zestawiam czas wykonania oraz zużycie zasobów. Jednocześnie sprawdzam poprawność odpowiedzi, ponieważ szybszy raport nadal musi zwracać te same dane.

  **Aby wycenić pracę, pokaż stronę lub operację, na którą trzeba czekać, i opisz, kiedy pojawia się opóźnienie.** Dołącz dostępne logi lub pomiary. Diagnoza i prace nad rozwiązaniem wskazanego problemu kosztują od 4800 zł; zakres obejmuje jedną zidentyfikowaną przyczynę opóźnienia.
