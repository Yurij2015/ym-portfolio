faq:
  - label: Czy potrzebny jest mocniejszy serwer?
    content: Być może. Najpierw ustalamy ograniczający zasób i możliwość zmniejszenia obciążenia przez zmiany aplikacji.
  - label: Czy wystarczy schemat bazy?
    content: Pomaga zrozumieć strukturę, ale analiza wydajności może wymagać planów zapytań, statystyk i reprezentatywnych danych testowych.
content: |-
  ## Pomiar konkretnego procesu

  Wolny raport i wolna rezerwacja mogą mieć różne przyczyny. Zaczynam od operacji, którą da się odtworzyć: sprawdzam czas, ilość danych i zależności zewnętrzne. Następnie można wybrać zmianę i zmierzyć jej efekt.

  W DigiPulse testy sieciowe wykonuje osobny serwis Go zamiast Laravela. To podział pracy pod konkretny cel, a nie ogólne zalecenie przepisywania PHP na inny język.

  Prześlij wolną stronę lub operację, warunki występowania opóźnienia i dostępne logi. Cena od $1 200 jest orientacyjnym budżetem diagnozy oraz pracy nad konkretnym ograniczeniem. Wynik liczbowy można ocenić dopiero po pomiarze początkowym.
