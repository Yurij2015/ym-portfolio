faq:
  - label: Filament, Flowbite czy AdminLTE?
    content: Filament pasuje do aplikacji w Laravelu, w której panel składa się z
      typowych ekranów z listami, formularzami, filtrami i rolami. Po Flowbite
      sięgam, gdy panel ma mieć własny wygląd lub nietypowe ekrany albo gdy
      frontend jest osobną aplikacją w Vue lub Nuxt. AdminLTE ma sens, jeśli
      projekt korzysta już z Bootstrapa lub ma administrację na AdminLTE, którą
      trzeba rozwinąć.
  - label: Czy można dodać Filament do istniejącej aplikacji Laravel?
    content: Tak, po sprawdzeniu zgodności wersji, modeli i uwierzytelniania. Zasoby
      można wprowadzać pojedynczo, bez zmian w reszcie aplikacji.
  - label: Co jeśli backend nie korzysta z Laravela?
    content: Wtedy Filament odpada. Panel na Flowbite lub AdminLTE można wbudować w
      istniejącą aplikację PHP albo uruchomić osobno, z dostępem do danych przez
      API. Druga droga oznacza dodatkową pracę integracyjną.
content: |-
  ## Przykłady z moich projektów

  W DigiSpace stopniowo przenoszę ekrany ze starego panelu opartego na Inertia i Vue do Filament. Oba panele działają równolegle. W nowym można już edytować treści, tłumaczenia i metadane SEO. Z Filament korzystam również w DigiPulse, gdzie służy do zarządzania monitorami, kontaktami i regułami powiadomień.

  Korzystam też z Flowbite, między innymi w NetPostPanel i panelu kliniki VetSpace. Z tej biblioteki korzystałem również w projektach dla klientów: panel platformy marketplace do zarządzania użytkownikami, ogłoszeniami i zamówieniami oraz serwis dla fotografów z galeriami i pakietami usług.

  Mam też doświadczenie z AdminLTE, na którym zbudowałem dwa panele do aplikacji Laravel. Jeden pobiera dane z zewnętrznego API według harmonogramu i pozwala agencji przeglądać oraz eksportować statystyki i wydatki. Drugi zarządza zbieraniem i filtrowaniem danych z serwisu społecznościowego przez kolejki zadań.

  W każdym z tych przypadków zakres prac zależy od tego, jakie dane zespół tworzy i edytuje, jak je wyszukuje oraz które operacje wymagają potwierdzenia. Dlatego do wyceny przydadzą się obecne ekrany lub arkusze oraz opis czynności, które zespół nadal wykonuje ręcznie.

  Koszt przygotowania zestawu powiązanych ekranów zaczyna się od 6400 zł. Jeśli potrzebne są importy, raporty lub niestandardowe operacje, uwzględniam je w wycenie zależnie od stopnia złożoności.
