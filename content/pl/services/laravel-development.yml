faq:
  - label: Co oznacza cena od 9600 zł?
    content: To budżet początkowy na moduł, taki jak panel użytkownika z rolami lub
      obsługa zamówień, albo na integrację. Obejmuje testy i przygotowanie do
      wdrożenia. Przed rozpoczęciem prac uzgadniamy funkcje modułu, kryteria
      odbioru i koszt.
  - label: Czy potrzebny jest osobny frontend?
    content: Do paneli wewnętrznych wykorzystuję Filament, a do paneli użytkowników
      między innymi Inertia i Vue. Nuxt może obsługiwać strony publiczne, jak w
      VetCard. Wybór zależy od interfejsu i dalszego utrzymania.
content: |-
  ## Przykłady z moich projektów

  W VetSpace rozwijam CRM dla klinik, w tym obsługę ich danych i subskrypcji Stripe. W DigiPulse Laravel odpowiada za zarządzanie monitorami i powiadomieniami, a osobny serwis Go wykonuje kontrole sieciowe. W obu produktach nowe moduły muszą współpracować z istniejącą logiką.

  Dla jednego z klientów rozwijałem platformę marketplace w Laravelu, z ogłoszeniami i płatnymi pakietami. Oprócz podstawowych funkcji rozwijałem czat, rozmowy wideo przez LiveKit, wyszukiwanie w Meilisearch oraz obsługę zgłoszeń do pomocy technicznej, tworzonych również z wiadomości email.

  Dodanie podobnej funkcji do istniejącej aplikacji wymaga najpierw poznania jej struktury danych, zależności i sposobu wdrażania. Znając te elementy, mogę zaplanować zmiany i testy tak, żeby nowy moduł współpracował z resztą systemu.

  **Opisz, co użytkownik ma robić w aplikacji, i pokaż obecną wersję lub makiety.** Na tej podstawie zaproponuję sposób realizacji, wycenę i przewidywany czas prac.
