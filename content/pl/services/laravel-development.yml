faq:
  - label: Co oznacza cena od $2 400?
    content: To początkowy budżet na osobny moduł lub integrację z testami i przygotowaniem wdrożenia. Przykładem są konta użytkowników z rolami albo obsługa zamówień; nie są to gotowe pakiety w tej samej cenie. Drobna poprawka i nowy produkt wymagają różnych wycen.
  - label: Czy potrzebny jest osobny frontend?
    content: Do paneli wewnętrznych wykorzystuję Filament, a do kont użytkowników między innymi Inertia i Vue. Nuxt może obsługiwać strony publiczne, jak w VetCard. Wybór zależy od interfejsu i dalszego utrzymania.
content: |-
  ## Przykłady z projektów

  W VetSpace pracuję z procesami CRM weterynaryjnego, danymi klinik i subskrypcjami Stripe. W DigiPulse Laravel zarządza monitorami i powiadomieniami, a osobny serwis Go wykonuje testy sieciowe. Dobór rozwiązania zależy od konkretnego procesu.

  Dla klienta tworzyłem w Laravelu marketplace z ogłoszeniami i płatnymi pakietami. Ma czat, rozmowy wideo przez LiveKit, wyszukiwanie w Meilisearch oraz zgłoszenia do wsparcia tworzone także z wiadomości e-mail.

  W istniejącej aplikacji najpierw przeglądam zależności, strukturę danych i wdrażanie. Nowa funkcja musi współpracować z tą logiką i zostać sprawdzona razem z powiązanymi procesami.

  Opisz działania użytkownika i pokaż obecną aplikację lub makiety. Przeanalizuję część techniczną i zaproponuję realizację z wyceną oraz szacowanym czasem.
