faq:
  - label: Co oznacza cena od $2 400?
    content: To początkowy budżet na osobny moduł lub integrację z testami i przygotowaniem wdrożenia, na przykład konta użytkowników z rolami albo obsługę zamówień. Przed rozpoczęciem prac uzgadniamy funkcje modułu, kryteria odbioru i koszt.
  - label: Czy potrzebny jest osobny frontend?
    content: Do paneli wewnętrznych wykorzystuję Filament, a do kont użytkowników między innymi Inertia i Vue. Nuxt może obsługiwać strony publiczne, jak w VetCard. Wybór zależy od interfejsu i dalszego utrzymania.
content: |-
  ## Przykłady z moich projektów

  W VetSpace rozwijam CRM dla klinik, pracując z ich danymi i subskrypcjami Stripe. W DigiPulse Laravel odpowiada za zarządzanie monitorami i powiadomieniami, a osobny serwis Go wykonuje kontrole sieciowe. W obu produktach nowe moduły muszą współpracować z istniejącą logiką.

  Wśród projektów klienckich jest marketplace na Laravel z ogłoszeniami i płatnymi pakietami. Oprócz podstawowych funkcji pracowałem w nim nad czatem, rozmowami wideo przez LiveKit, wyszukiwaniem w Meilisearch oraz zgłoszeniami do pomocy technicznej, które powstają również z wiadomości email.

  Dodanie podobnej funkcji do istniejącej aplikacji wymaga najpierw poznania jej struktury danych, zależności i sposobu wdrażania. Dopiero na tej podstawie można zaplanować zmiany i testy tak, aby nowy moduł współpracował z resztą systemu.

  Możemy zacząć od opisu tego, co użytkownik ma móc zrobić, oraz obejrzenia obecnej aplikacji lub makiet. Na tej podstawie zaproponuję realizację z wyceną i szacowanym czasem prac.
