faq:
  - label: Czy potrzebujemy RAG?
    content: Wyszukiwanie fragmentów może pomóc, gdy odpowiedź ma korzystać z Twoich dokumentów. Klasyfikacja lub odczyt pól może nie wymagać osobnej bazy wiedzy.
  - label: Co z prywatnością i kosztami?
    content: Przed uruchomieniem sprawdzam zasady przetwarzania i przechowywania danych dostawcy. Koszty szacuję z modelu i liczby zapytań; użycie API jest opłacane osobno.
content: |-
  ## Doświadczenie z NetPostPanel i DigiPulse

  W NetPostPanel wyszukiwanie źródeł, generowanie treści i Qdrant łączą się przez kolejki Horizon. Langfuse rejestruje wywołania modeli. W DigiPulse serwer MCP udostępnia asystentom AI dane monitoringu.

  To różne sposoby integracji. Dla Twojego zadania najpierw sprawdzamy, czy model daje przydatny wynik. Wyszukiwanie dokumentów i uporządkowany format odpowiedzi nie eliminują błędów, dlatego osobno uzgadniamy kontrolę wyników.

  Prześlij przykładowe dane i oczekiwane wyniki, liczbę zapytań oraz ograniczenia dotyczące danych. Cena od $2 200 jest orientacyjnym budżetem osobnej funkcji AI z integracją; użycie API modelu jest opłacane oddzielnie.
