faq:
  - label: Czy potrzebujemy RAG?
    content: Wyszukiwanie fragmentów może pomóc, gdy odpowiedź ma korzystać z Twoich
      dokumentów. Klasyfikacja lub odczyt pól może nie wymagać osobnej bazy
      wiedzy.
  - label: Co z prywatnością i kosztami?
    content: Przed uruchomieniem sprawdzam zasady, na jakich dostawca przetwarza i
      przechowuje dane. Koszty szacuję na podstawie wybranego modelu i liczby
      zapytań. Opłaty za korzystanie z API są rozliczane osobno.
content: |-
  ## Doświadczenie z NetPostPanel i DigiPulse

  W NetPostPanel pracuję z wyszukiwaniem źródeł, generowaniem treści i wyszukiwaniem wektorowym w Qdrant. Te zadania wykonują się w kolejkach obsługiwanych przez Horizon, a wywołania modeli śledzę w Langfuse. W DigiPulse integracja wygląda inaczej: serwer MCP udostępnia asystentom AI dane z monitoringu.

  Zanim wybiorę sposób integracji, sprawdzam, czy model daje użyteczne wyniki na Twoich danych i w jakich przypadkach się myli. Jeśli odpowiedzi mają opierać się na dokumentach, dodaję wyszukiwanie odpowiednich fragmentów; jeśli ma je przetwarzać aplikacja, określam format odpowiedzi. Takie rozwiązania nie eliminują wszystkich błędów, dlatego jeszcze przed uruchomieniem ustalamy, jak sprawdzać odpowiedzi.

  Do testów potrzebuję kilku przykładów danych wejściowych i oczekiwanych odpowiedzi. Do wyceny przydadzą się też przewidywana liczba zapytań i wymagania dotyczące przetwarzania danych. Wdrożenie jednej funkcji AI w aplikacji kosztuje od 8800 zł.
