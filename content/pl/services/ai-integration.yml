faq:
  - label: Czy potrzebujemy RAG?
    content: Wyszukiwanie fragmentów może pomóc, gdy odpowiedź ma korzystać z Twoich dokumentów. Klasyfikacja lub odczyt pól może nie wymagać osobnej bazy wiedzy.
  - label: Co z prywatnością i kosztami?
    content: Przed uruchomieniem sprawdzam zasady przetwarzania i przechowywania danych dostawcy. Koszty szacuję z modelu i liczby zapytań; użycie API jest opłacane osobno.
content: |-
  ## Doświadczenie z NetPostPanel i DigiPulse

  W NetPostPanel pracuję z wyszukiwaniem źródeł, generowaniem treści i wyszukiwaniem wektorowym w Qdrant. Operacje te działają przez kolejki Horizon, a wywołania modeli są śledzone w Langfuse. Inny sposób współpracy wykorzystuję w DigiPulse, gdzie serwer MCP daje asystentom AI dostęp do danych monitoringu.

  Wybór integracji zaczyna się od sprawdzenia samego zadania: czy model daje użyteczny wynik na Twoich danych i gdzie się myli. Jeśli odpowiedzi mają opierać się na dokumentach, dodaję wyszukiwanie odpowiednich fragmentów; jeśli będą przetwarzane przez kod, określam ich strukturę. Ponieważ błędy są możliwe także przy takich ustawieniach, sposób weryfikacji odpowiedzi uzgadniamy przed uruchomieniem.

  Do tej próby potrzebnych jest kilka przykładów danych wejściowych i oczekiwanych odpowiedzi. Wraz z przewidywaną liczbą zapytań i ograniczeniami dotyczącymi danych pomogą one wycenić integrację. Koszt jednej funkcji AI połączonej z aplikacją zaczyna się od $2 200.
