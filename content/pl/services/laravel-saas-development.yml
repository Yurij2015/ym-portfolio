  - label: Czy każdy klient potrzebuje osobnej bazy?
    content: Zależy to od wymagań dotyczących danych, kopii zapasowych i infrastruktury. Porównamy osobne bazy ze wspólną bazą i kontrolą dostępu.
  - label: Co obejmuje cena początkowa?
    content: Pierwszy uzgodniony etap rozwoju SaaS. Przed wyceną określamy, jakie konta firmowe, role, funkcje i scenariusze subskrypcji obejmuje i z czego będzie można korzystać po jego zakończeniu.
content: |-
  ## Doświadczenie z VetSpace

  W VetSpace każda klinika ma własną bazę danych, a subskrypcje działają przez Stripe i Cashier. W nowym produkcie SaaS sposób oddzielenia danych klientów dobieram do wymagań dotyczących dostępu, kopii zapasowych i infrastruktury.

  Obok dostępu do danych trzeba przemyśleć reguły subskrypcji: kiedy użytkownik otrzymuje dostęp, jak zmienia plan i co dzieje się po nieudanej płatności. Od tych zasad zależą funkcje produktu. Na przykład na platformie marketplace jednego z klientów zakupiony pakiet określał, ile aktywnych ogłoszeń i wersji roboczych może mieć użytkownik.

  Na początek wystarczy więc opisać, kto będzie korzystać z Twojego SaaS, w czym produkt ma pomagać i jak planujesz pobierać opłaty. Pomoże to wyznaczyć pierwszy etap i uzgodnić jego rezultat.

  Koszt pierwszego uzgodnionego etapu prac zaczyna się od $4 800. Przed rozpoczęciem zapisujemy w wycenie, jakie funkcje, zasady rozliczeń i integracje obejmuje ten etap.
