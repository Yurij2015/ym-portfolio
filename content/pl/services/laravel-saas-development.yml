  - label: Co obejmuje cena początkowa?
    content: Pierwszy uzgodniony etap rozwoju SaaS. Przed wyceną określamy, jakie konta firmowe, role, funkcje i scenariusze subskrypcji obejmuje oraz jaki działający rezultat otrzymasz na koniec etapu.
content: |-
  ## Doświadczenie z VetSpace

  W VetSpace każda klinika ma własną bazę danych, a subskrypcje działają przez Stripe i Cashier. W tym produkcie dane są rozdzielone właśnie w ten sposób; w nowym SaaS wybieram sposób izolacji na podstawie wymagań dotyczących dostępu, kopii zapasowych i infrastruktury.

  Obok dostępu do danych trzeba przemyśleć reguły subskrypcji: kiedy użytkownik otrzymuje dostęp, jak zmienia plan i co dzieje się po nieudanej płatności. Od tych zasad zależą funkcje produktu. Na przykład w marketplace klienta zakupiony pakiet określał liczbę aktywnych ogłoszeń i wersji roboczych, które mógł mieć użytkownik.

  Na początek wystarczy więc opisać, kto będzie korzystać z Twojego SaaS, jakie główne zadanie ma on rozwiązywać i jak planujesz pobierać opłaty. Pomoże to wyznaczyć pierwszy etap i uzgodnić jego rezultat.

  Budżet początkowy od $4 800 dotyczy pierwszego uzgodnionego etapu rozwoju. Objęte nim funkcje, scenariusze rozliczeń i integracje zapisujemy w wycenie przed rozpoczęciem prac.
