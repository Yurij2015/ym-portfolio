content: |-
  ## Doświadczenie z VetSpace

  W VetSpace każda klinika ma własną bazę danych, a subskrypcje działają przez Stripe i Cashier. W nowym produkcie SaaS sposób oddzielenia danych klientów dobieram do wymagań dotyczących dostępu, kopii zapasowych i infrastruktury.

  Razem z dostępem do danych ustalamy zasady subskrypcji: kiedy użytkownik otrzymuje dostęp, jak zmienia plan i co dzieje się po nieudanej płatności. Od tych zasad zależą funkcje produktu. Na przykład na platformie marketplace jednego z klientów zakupiony pakiet określał, ile aktywnych ogłoszeń i wersji roboczych może mieć użytkownik.

  Na początek wystarczy więc opisać, kto będzie korzystać z Twojego SaaS, w czym produkt ma pomagać i jak planujesz pobierać opłaty. W ten sposób ustalimy, co zbudować w pierwszym etapie i co będzie gotowe po jego zakończeniu.

  Pierwszy uzgodniony etap prac kosztuje od 19 200 zł. Wycena określa, jakie funkcje, scenariusze rozliczeń i integracje obejmuje, zanim zaczniemy pisać kod.
