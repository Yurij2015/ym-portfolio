faq:
  - label: Czy każdy klient potrzebuje osobnej bazy?
    content: Zależy to od wymagań dotyczących danych, kopii zapasowych i infrastruktury. Porównamy osobne bazy ze wspólną bazą i kontrolą dostępu.
  - label: Co obejmuje cena początkowa?
    content: Uzgodniony etap prac. Role, integracje i funkcje określamy przed wyceną; cena nie oznacza nieograniczonego zakresu MVP.
content: |-
  ## Doświadczenie z VetSpace

  We własnym produkcie VetSpace pracuję z kontami klinik, procesami CRM weterynaryjnego i subskrypcjami Stripe. Dane klinik są przechowywane w osobnych bazach. W nowym produkcie wybieram izolację po analizie wymagań; nie każdy SaaS potrzebuje tej architektury.

  Subskrypcje wymagają jasnych zasad: kiedy otwierany jest dostęp, co dzieje się po nieudanej płatności i jak zmienia się plan. Omawiamy to razem z funkcjami pierwszej wersji.

  W marketplace klienta wykupiony pakiet określał, ile aktywnych ogłoszeń i szkiców może mieć użytkownik.

  Opisz użytkowników, ich główne zadanie i sposób płatności. Cena od $4 800 jest orientacyjnym budżetem pierwszej wersji z ograniczonym zestawem funkcji. Rozliczenia, import danych i integracje wpływają na wycenę.
