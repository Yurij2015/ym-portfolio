faq:
  - label: Co jeśli aplikacja nie ma testów?
    content: Ustalimy, które krytyczne procesy trzeba sprawdzić i objąć testami przed aktualizacją. Uwzględniam to w wycenie.
  - label: Czy można uniknąć przestoju?
    content: Zależy to od infrastruktury i zmian bazy danych. Sposób wdrożenia oraz ewentualne okno serwisowe uzgadniamy wcześniej.
content: |-
  ## Przed wyborem wersji docelowej

  Aktualizacja może wymagać wymiany porzuconego pakietu, zmiany konfiguracji lub dostosowania kodu aplikacji. Wycenę określa więc więcej niż liczba wersji do przejścia.

  Rozwijam własne produkty Laravel, VetSpace i DigiPulse, z subskrypcjami, kolejkami oraz integracjami. Przy aktualizacji te procesy wymagają osobnych testów: samo uruchomienie aplikacji nie potwierdza ich działania.

  Do wyceny potrzebuję composer.json, composer.lock i opisu uruchamiania aplikacji. Cena od $1 600 jest orientacyjnym budżetem przejścia między określonymi wersjami. Wymiana porzuconych pakietów i dodanie brakujących testów wpływają na zakres pracy.
