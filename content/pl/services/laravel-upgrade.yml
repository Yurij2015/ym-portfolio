faq:
  - label: Co jeśli aplikacja nie ma testów?
    content: Ustalimy, które krytyczne procesy trzeba sprawdzić i objąć testami
      przed aktualizacją. Uwzględniam to w wycenie.
  - label: Czy można uniknąć przestoju?
    content: Zależy to od infrastruktury i zmian bazy danych. Sposób wdrożenia oraz
      ewentualne okno serwisowe uzgadniamy wcześniej.
content: |-
  ## Od czego zależy zakres

  O złożoności aktualizacji decyduje stan aplikacji: czy jej pakiety są nadal utrzymywane, jak bardzo zmieniła się konfiguracja i którą część własnego kodu trzeba dostosować. Sama różnica między obecną a docelową wersją nie wystarcza do wyceny, dlatego zaczynam od przeglądu zależności i sposobu uruchamiania.

  Gdy wiem już, co trzeba zmienić, ustalam, jak sprawdzić działanie systemu po aktualizacji. We własnych produktach opartych na Laravelu, VetSpace i DigiPulse, pracuję z subskrypcjami, kolejkami oraz integracjami, dla których uruchomienie aplikacji jest dopiero początkiem testów. Trzeba również wykonać same operacje i upewnić się, że nadal zwracają prawidłowe wyniki.

  **Aby wycenić aktualizację, prześlij composer.json, composer.lock i krótki opis uruchamiania aplikacji.** Koszt aktualizacji do uzgodnionej wersji zaczyna się od 6400 zł. W wycenie uwzględniam też wymianę porzuconych pakietów i napisanie brakujących testów, jeśli okażą się potrzebne.
