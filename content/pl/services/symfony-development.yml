faq:
  - label: Czy pracujesz z istniejącymi projektami Symfony?
    content: Tak. Potrzebuję opisu zadania, wersji zależności i dostępu do przeglądu kodu.
  - label: Czy Messenger jest zawsze potrzebny?
    content: Nie. Kolejka służy procesom wymagającym działania asynchronicznego. Ustalamy to podczas analizy zadania.
content: |-
  ## Praca z aplikacjami Symfony

  Usługa obejmuje zamówienia, integracje, API i operacje w tle. Pracuję nad multi-tenantowymi sklepami biletowymi, w których sprzedawane są bilety na mecze piłki nożnej i koszykówki, wyścigi motocyklowe i samochodowe, a także do muzeów, na wystawy i festiwale. Działają na Symfony z Doctrine, MySQL, Redis i kolejkach, z interfejsem Vue.js oraz płatnościami Stripe i Dalenys.

  Przy integracji ustalam zachowanie aplikacji przy opóźnionej odpowiedzi, ponowionym komunikacie lub niedostępności dostawcy. Uwzględniamy te sytuacje w zakresie testów.

  Opisz proces do dodania lub zmiany i podaj wersje Symfony oraz PHP. Cena od $3 200 jest orientacyjnym budżetem na moduł z testami; zależności i integracje wpływają na wycenę.
