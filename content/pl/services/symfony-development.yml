faq:
  - label: Czy pracujesz z istniejącymi projektami Symfony?
    content: Tak. Potrzebuję opisu zadania, wersji zależności i dostępu do przeglądu kodu.
  - label: Czy Messenger jest zawsze potrzebny?
    content: Nie. Kolejka służy procesom wymagającym działania asynchronicznego. Ustalamy to podczas analizy zadania.
content: |-
  ## Serwisy sprzedaży biletów oparte na Symfony

  Pracuję nad serwisami sprzedaży biletów w architekturze multi-tenant. Oferują one bilety na mecze piłki nożnej i koszykówki, wyścigi motocyklowe i samochodowe, a także do muzeów, na wystawy i festiwale. Backend jest oparty na Symfony z Doctrine, MySQL, Redis i kolejkami, interfejs na Vue.js, a płatności obsługują Stripe i Dalenys.

  W tych projektach pracuję z zamówieniami, płatnościami i wymianą danych z usługami zewnętrznymi. Gdy trzeba zmienić jeden z tych procesów, najpierw sprawdzam jego działanie i powiązania z pozostałymi częściami aplikacji. Pomaga to zaplanować prace i przetestować je razem z powiązaną logiką.

  Do wyceny zadania opisz proces, który chcesz dodać lub zmienić, i podaj wersje Symfony oraz PHP. Pomoże to określić powiązane moduły i zależności zewnętrzne. Koszt przygotowania modułu z testami zaczyna się od $3 200, a potrzebne integracje uwzględniam w łącznej wycenie.
