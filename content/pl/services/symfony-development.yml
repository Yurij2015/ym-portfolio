content: |-
  ## Serwisy sprzedaży biletów oparte na Symfony

  Pracuję nad serwisami sprzedaży biletów w architekturze multi-tenant. Oferują one bilety na mecze piłki nożnej i koszykówki, wyścigi motocyklowe i samochodowe, a także do muzeów, na wystawy i festiwale. Backend jest oparty na Symfony z Doctrine, MySQL, Redis i kolejkami, interfejs na Vue.js, a płatności obsługują Stripe i Dalenys.

  W tych projektach pracuję z zamówieniami, płatnościami i wymianą danych z usługami zewnętrznymi. Gdy trzeba zmienić jeden z tych procesów, najpierw sprawdzam jego działanie i powiązania z pozostałymi częściami aplikacji. Dzięki temu mogę zaplanować zmiany i przetestować cały proces po ich wprowadzeniu.

  Opisz proces, który chcesz dodać lub zmienić, i podaj wersje Symfony oraz PHP. Sprawdzę, jakich modułów i usług zewnętrznych dotyczy zadanie. Przygotowanie modułu z testami kosztuje od 12 800 zł; potrzebne integracje uwzględniam w wycenie.
