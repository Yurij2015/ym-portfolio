faq:
  - label: Czy pracujesz z autorskim kodem PHP?
    content: Tak. Przed wyceną potrzebuję poznać strukturę kodu, zależności i sposób uruchomienia.
  - label: Czy trzeba przejść na framework?
    content: Nie przy każdym zadaniu. Rozważamy migrację, jeśli ułatwi dalszą pracę i uzasadni poniesione koszty.
content: |-
  ## Zmiany w działającym systemie

  Nawet niewielka zmiana może dotyczyć kilku części aplikacji. Nowa integracja wpływa na przykład na wymianę danych, a zmiana obliczeń — na powiązane raporty. Dlatego przed rozpoczęciem prac ustalam te zależności i sposób sprawdzenia wyniku w istniejącym systemie.

  Z takimi powiązaniami pracuję między innymi w DigiSpace, gdzie publiczna strona, treści i panele administracyjne rozwijają się w jednej bazie kodu na Laravel. Zmiany w pojedynczej funkcji trzeba tu uzgadniać z resztą logiki — to samo podejście stosuję w aplikacjach klientów.

  Na początek opisz zadanie i podaj wersję PHP. W przypadku błędu przydadzą się kroki odtworzenia oraz komunikaty z logów, a dla nowej funkcji — przykład oczekiwanego wyniku. Dzięki tym materiałom mogę określić, jaki kod trzeba przejrzeć, i wycenić pracę.

  Budżet początkowy od $1 800 dotyczy uzgodnionego rozszerzenia lub poprawki, na przykład raportu albo wymiany danych, wraz z testami i instrukcją wdrożenia.
