faq:
  - label: Czy pracujesz z autorskim kodem PHP?
    content: Tak. Przed wyceną potrzebuję poznać strukturę kodu, zależności i sposób uruchomienia.
  - label: Czy trzeba przejść na framework?
    content: Nie przy każdym zadaniu. Rozważamy migrację, jeśli ułatwi dalszą pracę i uzasadni poniesione koszty.
content: |-
  ## Zmiany w działającym systemie

  Integracja, zmiana obliczeń lub poprawka błędu może dotyczyć kilku części aplikacji. Przed wdrożeniem analizuję powiązane procesy i sposób sprawdzenia wyniku. Przepisanie aplikacji nie jest obowiązkową częścią tej usługi.

  W DigiSpace rozwijam aplikację Laravel łączącą publiczną stronę, treści i panele administracyjne. To doświadczenie przydaje się przy zmianach, które muszą współpracować z istniejącą logiką.

  Prześlij zadanie i wersję PHP. Przy błędzie pomogą kroki odtworzenia i logi; przy nowej funkcji — przykład wyniku. Cena od $1 800 jest orientacyjnym budżetem na samodzielny zakres prac programistycznych.
