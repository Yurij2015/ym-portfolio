faq:
  - label: Czy rozwijasz istniejące API?
    content: Tak. Najpierw analizuję kontrakt i odbiorców, potem planuję zgodne zmiany lub nową wersję.
  - label: Czy zawsze potrzebny jest REST?
    content: Nie. Format dobieramy do odbiorców i operacji. Jeśli istniejący REST spełnia potrzeby, nie trzeba go zastępować innym podejściem.
content: |-
  ## API dopasowane do odbiorcy

  W VetSpace API obsługuje publiczny katalog i CRM. NetPostPanel udostępnia innym aplikacjom generowanie oraz tłumaczenie treści. Te procesy różnią się uprawnieniami, czasem wykonania i sposobem zwracania wyniku.

  Dla marketplace klienta napisałem REST API z uwierzytelnianiem Sanctum i dokumentacją Swagger. Obsługuje ogłoszenia, zamówienia, czat i zgłoszenia do wsparcia.

  Przed implementacją ustalam, kto wywołuje API, jakie dane może zobaczyć i co powinien otrzymać przy błędzie. Dla długich operacji omawiamy wykonanie w tle oraz sprawdzanie statusu.

  Do wyceny prześlij operacje i przykładowe dane. Jeśli API już istnieje, dodaj dokumentację. Cena od $1 800 jest orientacyjnym budżetem na powiązaną grupę operacji z dokumentacją oraz testami.
