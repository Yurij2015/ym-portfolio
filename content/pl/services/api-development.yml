faq:
  - label: Czy rozwijasz istniejące API?
    content: Tak. Najpierw sprawdzam kontrakt API i aplikacje, które z niego korzystają. Następnie planuję zmiany zachowujące zgodność albo przygotowanie nowej wersji.
  - label: Czy zawsze potrzebny jest REST?
    content: Nie. Format dobieramy do potrzeb aplikacji korzystających z API i wykonywanych operacji. Jeśli istniejący REST spełnia potrzeby, nie trzeba go zastępować innym podejściem.
content: |-
  ## API dopasowane do aplikacji klienckich

  W VetSpace jedno API w Laravelu obsługuje dwie części produktu: publiczny katalog przez GraphQL i CRM przez REST. W NetPostPanel inne aplikacje mogą zlecić generowanie oraz tłumaczenie treści i otrzymać wynik od razu lub przez callback. Dlatego przed rozpoczęciem prac ustalam, jakie aplikacje będą korzystać z API i jak długo mogą trwać poszczególne operacje.

  Dla platformy marketplace jednego z klientów przygotowałem z kolei REST API z uwierzytelnianiem przez Sanctum i dokumentacją Swagger. Obsługuje ono ogłoszenia, zamówienia, czat i zgłoszenia do pomocy technicznej, dlatego reguły dostępu i obsługa błędów są częścią każdego scenariusza.

  Pracę zaczynam więc od określenia operacji, dostępnych danych i odpowiedzi, które powinna otrzymywać aplikacja kliencka. Przy dłuższych zadaniach planuję wykonanie w tle i sposób odebrania wyniku. Zgodnie z tymi ustaleniami piszę kod, dokumentację i testy.

  Aby wycenić zadanie, opisz potrzebne operacje i dołącz przykładowe dane. Jeśli API już istnieje, przyda się również jego aktualna dokumentacja. Wdrożenie zestawu powiązanych operacji API, wraz z dokumentacją i testami, kosztuje od $1 800.
