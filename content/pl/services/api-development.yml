faq:
  - label: Czy rozwijasz istniejące API?
    content: Tak. Najpierw analizuję kontrakt i odbiorców, potem planuję zgodne zmiany lub nową wersję.
  - label: Czy zawsze potrzebny jest REST?
    content: Nie. Format dobieramy do odbiorców i operacji. Jeśli istniejący REST spełnia potrzeby, nie trzeba go zastępować innym podejściem.
content: |-
  ## API dopasowane do aplikacji klienckich

  W VetSpace jedno API na Laravel obsługuje dwie części produktu: publiczny katalog przez GraphQL i CRM przez REST. W NetPostPanel inne aplikacje mogą zlecić generowanie oraz tłumaczenie treści i otrzymać wynik od razu lub przez callback. Te przykłady pokazują, dlaczego przed rozpoczęciem prac warto ustalić, kto będzie wywoływać API i ile czasu zajmą jego operacje.

  Osobnym przykładem jest marketplace klienta, dla którego pisałem REST API z uwierzytelnianiem przez Sanctum i dokumentacją Swagger. Obsługuje ono ogłoszenia, zamówienia, czat i zgłoszenia do pomocy technicznej, dlatego reguły dostępu i obsługa błędów są częścią każdego scenariusza.

  Pracę zaczynam więc od określenia operacji, dostępnych danych i odpowiedzi, które powinna otrzymywać aplikacja kliencka. Dla długich zadań przewiduję wykonanie w tle i sposób odebrania wyniku. Na tej podstawie przygotowuję implementację, dokumentację oraz testy.

  Aby wycenić zadanie, opisz potrzebne operacje i dołącz przykładowe dane. Jeśli API już istnieje, przyda się również jego aktualna dokumentacja. Koszt grupy powiązanych operacji z dokumentacją i testami zaczyna się od $1 800.
