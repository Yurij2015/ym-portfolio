about:
  title: "O mnie"
  description: |
    Full-Stack developer z ponad 8-letnim doświadczeniem komercyjnym. Buduję i utrzymuję produkty SaaS, systemy CRM, platformy ticketingowe/e-commerce oraz REST API.
    Głęboka znajomość Laravel (Filament, Octane, FrankenPHP) oraz Symfony, a także Vue.js/Nuxt, architektur wielotenancyjnych i integracji systemów płatności.
