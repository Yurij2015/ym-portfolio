  description: "Programista PHP z ponad 8-letnim doświadczeniem. Laravel, Symfony, Vue i Nuxt: SaaS, CRM, płatności, API i utrzymanie istniejących aplikacji."
title: "Cześć, jestem Yurii Mokryi — Senior Full-Stack PHP Developer"
description: "Mam ponad 8 lat doświadczenia w pracy z PHP. Rozwijam produkty SaaS, systemy CRM i platformy sprzedaży biletów w Laravelu i Symfony, a ich interfejsy tworzę w Vue i Nuxt. Zajmuję się panelami użytkowników, płatnościami, subskrypcjami i integracjami z innymi usługami. Przygotowuję też wdrożenia i utrzymuję aplikacje po uruchomieniu."
