about:
  title: "O mnie"
  description: |
    Rozwijam własne produkty i pracuję przy projektach klientów. W VetSpace zajmuję się CRM dla klinik weterynaryjnych, w DigiPulse monitoringiem dostępności stron, a w NetPostPanel przygotowywaniem treści z pomocą AI.
    W tych produktach korzystam z Laravela, Filament, kolejek i API. Interfejsy tworzę w Vue i Nuxt, a osobne serwisy w Go. Przykłady i szczegóły techniczne znajdziesz poniżej w projektach.
