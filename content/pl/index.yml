testimonials:
  - quote: "Yurii to maszyna do kodowania. Od momentu, gdy zgłosił się do kontraktu, było jasne, że jest człowiekiem niewielu słów, ale rozmowa poszła świetnie i został zatrudniony. Zaprojektował bazę danych, ustawił architekturę kodu i zaplanował przyszłe wydania. Pracuje samodzielnie, robi review i debuguje kod, stale proponuje ulepszenia i wychwytuje logiczne błędy w systemie. Pracuję z freelancerami od 2012 roku i on jest jedynym na Upwork, kto naprawdę poradził sobie z trudnymi zadaniami i wniósł realną wartość do projektu. Zasługuje na stawkę seniora. Zawsze był dostępny, gdy projekt tego potrzebował, nigdy nie szuka wymówek i komunikuje się jasno."
    rating: 5
    author:
      name: 'Upwork'
      description: 'Opinia klienta na Upwork'
      to: 'https://www.upwork.com/freelancers/~012af578c90561eb11'
  - quote: "Gorąco polecam Yuriia jako niezawodnego, proaktywnego i zorientowanego na rezultaty profesjonalistę. Yurii to odpowiedzialny specjalista, który potrafi autonomicznie pracować nad szerokim zakresem zadań. Ma solidną ekspertyzę w PHP (Symfony, Laravel) i frameworkach JavaScript (Vue.js, Angular) — samodzielnie bada złożone problemy, znajduje ich pierwotne przyczyny i wdraża skuteczne rozwiązania."
    author:
      name: 'LinkedIn'
      description: 'Rekomendacja na LinkedIn'
      to: 'https://www.linkedin.com/in/yurii-mokryi/details/recommendations/'
  - quote: "Możesz zgłosić się z pojedynczym zadaniem lub zaprosić mnie do pracy nad produktem. Na początek wystarczy opisać, co trzeba zrobić, i pokazać aplikację lub materiały, które już masz."
    author:
      name: 'Yurii Mokryi'
      description: 'Senior Full-Stack PHP Developer • 8+ lat • Poznań'
      avatar:
        src: '/images/avatar-3.jpeg'
        alt: 'Yurii Mokryi'
faq:
  title: "Często zadawane pytania"
  description: "W skrócie o procesie, technologiach i współpracy."
  categories:
    - title: "Współpraca"
      questions:
        - label: "Czy przejmujesz istniejące projekty?"
          content: "Tak. Duża część mojej pracy to rozwój i utrzymanie aplikacji po uruchomieniu: przegląd kodu, refaktoryzacja i nowe funkcje. Zanim wprowadzę zmiany, poznaję projekt i sposób przygotowywania kolejnych wydań."
        - label: "Jak wygląda proces współpracy?"
          content: "Zaczynamy od rozmowy o zadaniu i przeglądu dostępnych materiałów. Następnie proponuję plan prac z wyceną i szacowanym czasem realizacji. W trakcie rozwoju pokazuję działające zmiany; częstotliwość prezentacji i sposób wdrożenia ustalamy wspólnie."
        - label: "Co po wdrożeniu?"
          content: "Mogę dalej pracować nad produktem: naprawiać błędy, sprawdzać powiadomienia z monitoringu i dodawać funkcje. Zakres wsparcia i moją dostępność ustalamy osobno."
    - title: "Technologie"
      questions:
        - label: "Z jakich technologii korzystasz?"
          content: "Na backendzie pracuję z PHP, Laravelem i Symfony, a na frontendzie z Vue i Nuxt. We własnych produktach korzystam też z Filament, Redis, Go i integracji z dostawcami AI. Narzędzia do konkretnego zadania dobieram do istniejącego projektu."
        - label: "Czy pracujesz z zespołem klienta?"
          content: "Tak. Realizuję zadania z backlogu zespołu, przygotowuję pull requesty i uczestniczę w przeglądach kodu oraz rozmowach o rozwiązaniach. Sposób raportowania i prezentacji postępów ustalamy na początku współpracy."
        - label: "W jakiej strefie czasowej pracujesz?"
          content: "Pracuję w Poznaniu. Na początku współpracy ustalamy godziny kontaktu i czas wspólnej pracy z Twoim zespołem."
