testimonials:
  - quote: "Yurii to maszyna do kodowania. Od momentu, gdy zgłosił się do kontraktu, było jasne, że jest człowiekiem niewielu słów, ale rozmowa poszła świetnie i został zatrudniony. Zaprojektował bazę danych, ustawił architekturę kodu i zaplanował przyszłe wydania. Pracuje samodzielnie, robi review i debuguje kod, stale proponuje ulepszenia i wychwytuje logiczne błędy w systemie. Pracuję z freelancerami od 2012 roku i on jest jedynym na Upwork, kto naprawdę poradził sobie z trudnymi zadaniami i wniósł realną wartość do projektu. Zasługuje na stawkę seniora. Zawsze był dostępny, gdy projekt tego potrzebował, nigdy nie szuka wymówek i komunikuje się jasno."
    rating: 5
    author:
      name: 'Upwork'
      description: 'Opinia klienta na Upwork'
      to: 'https://www.upwork.com/freelancers/mokryiyurii'
  - quote: "Gorąco polecam Yuriia jako niezawodnego, proaktywnego i zorientowanego na rezultaty profesjonalistę. Yurii to odpowiedzialny specjalista, który potrafi autonomicznie pracować nad szerokim zakresem zadań. Ma solidną ekspertyzę w PHP (Symfony, Laravel) i frameworkach JavaScript (Vue.js, Angular) — samodzielnie bada złożone problemy, znajduje ich pierwotne przyczyny i wdraża skuteczne rozwiązania."
    author:
      name: 'LinkedIn'
      description: 'Rekomendacja na LinkedIn'
      to: 'https://www.linkedin.com/in/yurii-mokryi/details/recommendations/'
  - quote: "Od ponad 8 lat zamieniam problemy biznesowe w działające produkty: od architektury i płatności po wdrożenie i skalowanie. Mój kod sprzedaje bilety na Formula 1 i MotoGP, a moje własne produkty SaaS obsługują płacących klientów. Szukasz dewelopera, który odpowiada za rezultat? Napisz do mnie."
    author:
      name: 'Yurii Mokryi'
      description: 'Senior Full-Stack PHP Developer • 8+ lat • Poznań'
      avatar:
        src: '/images/avatar-2.jpeg'
        alt: 'Yurii Mokryi'
faq:
  title: "Często zadawane pytania"
  description: "W skrócie o procesie, technologiach i współpracy."
  categories:
    - title: "Współpraca"
      questions:
        - label: "Czy przejmujesz istniejące projekty?"
          content: "Tak. Większość mojej pracy to rozwój i utrzymanie produktów produkcyjnych: audyt kodu, refaktoryzacja i nowe funkcje bez zatrzymywania wydań."
        - label: "Jak wygląda proces współpracy?"
          content: "Krótki brief → wycena z terminami → rozwój z demo co 1–2 tygodnie → wdrożenie i wsparcie."
        - label: "Co po wdrożeniu?"
          content: "Monitoring, poprawki i rozwój produktu — zostaję we wsparciu tak długo, jak trzeba."
    - title: "Technologie"
      questions:
        - label: "Z jakich technologii korzystasz?"
          content: "Laravel (Filament, Octane, FrankenPHP) i Symfony po stronie backendu, Vue.js/Nuxt na froncie, Docker, Terraform, CI/CD, integracje płatności i AI."
        - label: "Czy pracujesz z zespołem klienta?"
          content: "Tak, swobodnie wchodzę w istniejące zespoły: code review, wspólny pipeline, dokumentacja i regularne demo."
        - label: "W jakiej strefie czasowej pracujesz?"
          content: "CET (Poznań, Polska), z elastycznym nakładaniem się godzin dla Europy i USA."
