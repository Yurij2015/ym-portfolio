about:
  title: "O mnie"
  description: |
    Full-Stack developer z ponad 8-letnim doświadczeniem komercyjnym. Buduję i utrzymuję produkty SaaS, systemy CRM, platformy ticketingowe/e-commerce oraz REST API.
    Na backendzie pracuję z Laravelem (Filament, Octane, FrankenPHP) i Symfony, a na frontendzie z Vue.js i Nuxt. Zajmuję się między innymi oddzieleniem danych klientów w produktach SaaS oraz integracją systemów płatności.
