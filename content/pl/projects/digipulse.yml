content: |
  SaaS do monitorowania dostępności — sprawdzanie co 60 sekund, śledzenie wygaśnięcia SSL, powiadomienia przez Telegram i email. Panel administracyjny i podstawowy backend zbudowane na Laravel (Octane, websockety Reverb) i Filament, a silnik monitorujący to osobny serwis w Go. Integracja logowania Google OAuth i Cloudflare Turnstile. Zawiera serwer MCP, który udostępnia dane monitoringu bezpośrednio asystentom AI. Self-hosted na Proxmox.

  ## Kluczowe funkcje

  - **Dedykowany silnik w Go** - sprawdzanie dostępności wykonuje osobny serwis w Go, więc ciągłe odpytywanie co 60 sekund nie spowalnia aplikacji Laravel
  - **Dashboard w czasie rzeczywistym** - websockety Reverb przesyłają zmiany statusu do UI na żywo, bez odświeżania
  - **Octane + Filament** - Laravel rezydentny w pamięci z pełnym panelem administracyjnym dla monitorów, kontaktów i reguł alertów
  - **Serwer MCP** - monitory i incydenty dostępne dla asystentów AI (Claude, Cursor) przez Model Context Protocol
  - **Google OAuth + Turnstile** - logowanie bez hasła i ochrona przed botami na formularzach publicznych
  - **Self-hosted** - wdrożone na własnym homelab Proxmox, którym zarządzam end-to-end

  ## Stos technologiczny

  - **Backend**: Laravel (Octane, websockety Reverb)
  - **Panel administracyjny**: Filament
  - **Silnik monitorujący**: Go (osobny serwis)
  - **Baza danych**: PostgreSQL
  - **Integracja AI**: Serwer MCP
  - **Infrastruktura**: Self-hosted na Proxmox
