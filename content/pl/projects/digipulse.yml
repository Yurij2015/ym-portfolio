content: |
  DigiPulse sprawdza dostępność stron i termin ważności certyfikatów SSL. Użytkownik dodaje monitory i kontakty, ustala reguły powiadomień, a informacje o awariach otrzymuje przez Telegram lub email. Kontrole odbywają się co 60 sekund, a panel pokazuje zmiany statusu bez ręcznego odświeżania.

  ## Moja praca w projekcie

  To mój produkt. Rozwijam backend w Laravelu, panel Filament i osobny serwis monitoringu w Go. Pracuję też nad serwerem MCP udostępniającym dane asystentom AI oraz zajmuję się wdrażaniem i infrastrukturą.

  ## Kluczowe funkcje

  - **Osobny serwis monitoringu** — serwis Go sprawdza strony co 60 sekund, a Laravel zarządza monitorami, kontaktami i powiadomieniami
  - **Dashboard w czasie rzeczywistym** - websockety Reverb przesyłają zmiany statusu do UI na żywo, bez odświeżania
  - **Octane + Filament** - Laravel rezydentny w pamięci z pełnym panelem administracyjnym dla monitorów, kontaktów i reguł alertów
  - **Serwer MCP** - monitory i incydenty dostępne dla asystentów AI (Claude, Cursor) przez Model Context Protocol
  - **Google OAuth + Turnstile** - logowanie bez hasła i ochrona przed botami na formularzach publicznych
  - **Self-hosted** — wdrożony w środowisku Proxmox, w którym administruję maszynami wirtualnymi i usługami

  ## Stos technologiczny

  - **Backend**: Laravel (Octane, websockety Reverb)
  - **Panel administracyjny**: Filament
  - **Silnik monitorujący**: Go (osobny serwis)
  - **Baza danych**: PostgreSQL
  - **Integracja AI**: Serwer MCP
  - **Infrastruktura**: Self-hosted na Proxmox
