content: |
  DigiSpace łączy publiczną stronę agencji, panel administracyjny i autorski CMS w jednej aplikacji Laravel. Treści i interfejs są dostępne po angielsku, ukraińsku i polsku. Ekrany administracyjne stopniowo przenoszę do Filament, a starszy panel na Inertia i Vue nadal działa równolegle. Kod aplikacji jest dostępny na GitHub.

  ## Moja praca w projekcie

  Rozwijam i utrzymuję stronę oraz CMS w Laravelu. Pracuję nad stronami publicznymi, tłumaczeniami i narzędziami administracyjnymi. Stopniowo przenoszę ekrany z Inertia i Vue do Filament, zachowując działanie obecnego serwisu.

  ## Kluczowe funkcje

  - **Panel administracyjny Filament** - równoległy panel `/control` (24 zasoby) z edytorem TipTap, przesyłaniem obrazów bezpośrednio do MinIO i nawigacją zorientowaną na treść, wdrażany zasób po zasobie obok istniejącego panelu Inertia
  - **Tłumaczenia treści i interfejsu** - tłumaczone są nie tylko strony, ale i strukturalne teksty UI (menu, stopka, przyciski) dla każdej lokalizacji, z routingiem opartym na hreflang
  - **Konfiguracja SEO** - dane strukturalne JSON-LD, zlokalizowane sitemapy i poprawna obsługa 404 dla każdej lokalizacji
  - **Wspólny kod aplikacji** - publiczna strona i oba panele administracyjne w jednej aplikacji Laravel, bez osobnego API
  - **Edycja treści w CMS** - strony, usługi i portfolio edytuje się w CMS — bez deploymentu dla zmiany tekstu czy tłumaczenia
  - **Kontrola kodu** - testy PHPUnit i analiza statyczna PHPStan w CI
  - **Otwarty kod** - dokładnie ten kod, który obsługuje digispace.pro, jest publiczny na GitHub

  ## Stos technologiczny

  - **Backend**: Laravel
  - **Panel admina**: Filament 5+ (`/control`) + stary panel na Inertia.js + Vue
  - **Frontend**: Vue.js, Vite
  - **Lokalizacja**: tłumaczenia treści i struktury EN/UK/PL
  - **Architektura**: Niestandardowy CMS
