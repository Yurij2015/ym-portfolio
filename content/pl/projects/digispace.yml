content: |
  Produkcyjna strona digispace.pro — publiczny serwis agencji, panel administracyjny i autorski CMS w jednej aplikacji Laravel, teraz w pełni wielojęzyczna (EN/UK/PL), z panelem Filament obok starego panelu na Inertia + Vue. Ten sam kod, który obsługuje żywą stronę, jest dostępny na GitHub.

  ## Kluczowe funkcje

  - **Panel administracyjny Filament** - równoległy panel `/control` (24 zasoby) z edytorem TipTap, przesyłaniem obrazów bezpośrednio do MinIO i nawigacją zorientowaną na treść, wdrażany zasób po zasobie obok istniejącego panelu Inertia
  - **Wielojęzyczność od podstaw** - tłumaczone są nie tylko strony, ale i strukturalne teksty UI (menu, stopka, przyciski) dla każdej lokalizacji, z routingiem opartym na hreflang
  - **SEO wbudowane** - dane strukturalne JSON-LD, zlokalizowane sitemapy i poprawna obsługa 404 dla każdej lokalizacji
  - **Monolit zrobiony dobrze** - publiczna strona i oba panele administracyjne w jednej aplikacji Laravel, bez osobnego API
  - **Treść pod kontrolą** - strony, usługi i portfolio edytuje się w CMS — bez deploymentu dla zmiany tekstu czy tłumaczenia
  - **Bramy jakości** - testy PHPUnit i analiza statyczna PHPStan w CI
  - **Otwarty kod** - dokładnie ten kod, który obsługuje digispace.pro, jest publiczny na GitHub

  ## Stos technologiczny

  - **Backend**: Laravel
  - **Panel admina**: Filament 5 (`/control`) + stary panel na Inertia.js + Vue
  - **Frontend**: Vue.js, Vite
  - **Lokalizacja**: tłumaczenia treści i struktury EN/UK/PL
  - **Architektura**: Niestandardowy CMS
