content: |
  Platforma treści AI z generacją multi-provider (Gemini/OpenAI za abstrakcją driverów), wyszukiwaniem semantycznym na Qdrant, silnikiem agregacji RSS/wiadomości z auto-wykrywaniem i scrapingiem treści oraz śledzeniem Langfuse dla obserwowalności LLM.

  ## Kluczowe funkcje

  - **AI bez przywiązania do dostawcy** - Gemini i OpenAI za abstrakcją driverów, więc zmiana modelu to konfiguracja, nie refaktoryzacja
  - **Pipeline semantyczny** - wyszukiwanie wektorowe na Qdrant deduplikuje i grupuje newsy zanim trafią do generacji
  - **Autonomiczna agregacja** - auto-wykrywanie kanałów RSS plus scraping zamieniają temat w samozasilające się źródło treści
  - **Widoczne wywołania LLM** - każda generacja jest śledzona w Langfuse: tokeny, opóźnienie, koszt
  - **Na kolejkach** - Laravel Horizon wykonuje zadania generacji i scrapingu z retry i kontrolą obciążenia

  ## Stos technologiczny

  - **Backend**: Laravel
  - **AI**: Multi-provider (Gemini/OpenAI)
  - **Baza wektorowa**: Qdrant do wyszukiwania semantycznego
  - **Obserwowalność**: Langfuse do śledzenia LLM
  - **Kolejka**: Laravel Horizon
  - **Architektura**: Wzorzec abstrakcji driverów
