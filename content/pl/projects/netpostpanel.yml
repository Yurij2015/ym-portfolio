content: |
  NetPostPanel to wewnętrzna platforma do wyszukiwania źródeł i przygotowywania treści z pomocą AI. Łączy Google Custom Search, RSS, scraping stron, generowanie tekstu i wyszukiwanie wektorowe. Inne aplikacje korzystają z tych funkcji przez wersjonowane API, między innymi w procesie przygotowywania artykułów dla DigiSpace.

  ## Moja praca w projekcie

  Projektuję i rozwijam to narzędzie na potrzeby własnej pracy z treściami. Zajmuję się wyszukiwaniem źródeł, integracjami dostawców AI, kolejkami generowania i API dla innych aplikacji. Konfiguruję też wyszukiwanie wektorowe w Qdrant i śledzenie wywołań modeli w Langfuse.

  ## Kluczowe funkcje

  - **Zewnętrzne API** - wersjonowane `POST /api/v1/generate` + `/translate` z kluczami i limitami per klient udostępnia cały pipeline innym aplikacjom, synchronicznie lub asynchronicznie z callbackami
  - **Auto Pilot** - codzienne zaplanowane uruchomienia generują treść z nowych inspiracji lub własnych tematów, w pełni automatycznie
  - **Sterowniki dostawców AI** — integracje Gemini i OpenAI mają wspólny interfejs; obsługiwany model wybiera się w konfiguracji
  - **Pipeline semantyczny** - wyszukiwanie wektorowe na Qdrant deduplikuje i grupuje newsy zanim trafią do generacji
  - **Zbieranie źródeł** — wyszukiwanie kanałów RSS, Google Custom Search i scraping stron dla wybranych tematów
  - **Śledzenie wywołań LLM** - każda generacja jest śledzona w Langfuse: tokeny, opóźnienie, koszt
  - **Dostęp oparty na rolach** - role admin/content manager/editor, każde zapytanie ograniczone do właściciela poza adminem

  ## Stos technologiczny

  - **Backend**: Laravel, agenci `laravel/ai`
  - **Frontend**: Inertia.js + Vue 3 (SPA Search & Creation, edytor TipTap)
  - **AI**: Multi-provider (Gemini/OpenAI) za abstrakcją driverów
  - **Research**: Google Custom Search + agregacja RSS, scraping stron
  - **Baza wektorowa**: Qdrant do wyszukiwania semantycznego
  - **Obserwowalność**: Langfuse do śledzenia LLM
  - **Kolejka**: Laravel Horizon
  - **Testy**: PHPUnit/Pest + Cypress E2E
