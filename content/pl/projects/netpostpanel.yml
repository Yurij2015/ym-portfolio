content: |
  Platforma treści AI z generacją multi-provider (Gemini/OpenAI za abstrakcją driverów), wyszukiwaniem semantycznym na Qdrant, silnikiem agregacji RSS/wiadomości z auto-wykrywaniem i scrapingiem treści oraz śledzeniem Langfuse dla obserwowalności LLM.

  ## Kluczowe funkcje

  - **AI multi-provider** - Generacja multi-provider (Gemini/OpenAI)
  - **Wyszukiwanie semantyczne** - Wyszukiwanie semantyczne na Qdrant
  - **Agregacja RSS** - Silnik agregacji RSS/wiadomości
  - **Scraping treści** - Auto-wykrywanie i scraping treści
  - **Obserwowalność LLM** - Śledzenie Langfuse
  - **Kolejki zadań** - Horizon do przetwarzania zadań
  - **Abstrakcja driverów** - Abstrakcja driverów dla dostawców AI

  ## Stos technologiczny

  - **Backend**: Laravel
  - **AI**: Multi-provider (Gemini/OpenAI)
  - **Baza wektorowa**: Qdrant do wyszukiwania semantycznego
  - **Obserwowalność**: Langfuse do śledzenia LLM
  - **Kolejka**: Laravel Horizon
  - **Architektura**: Wzorzec abstrakcji driverów
