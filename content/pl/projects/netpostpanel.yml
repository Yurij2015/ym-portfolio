content: |
  Wewnętrzna platforma AI do operacji na treści, która zamienia research tematu w gotową treść: pełny pipeline RAG (Google Custom Search + RSS → scraping → generacja multi-provider → wektoryzacja), plus wersjonowane zewnętrzne API zasilające procesy treściowe innych projektów, w tym pipeline bloga DigiSpace.

  ## Kluczowe funkcje

  - **Zewnętrzne API** - wersjonowane `POST /api/v1/generate` + `/translate` z kluczami i limitami per klient udostępnia cały pipeline innym aplikacjom, synchronicznie lub asynchronicznie z callbackami
  - **Auto Pilot** - codzienne zaplanowane uruchomienia generują treść z nowych inspiracji lub własnych tematów, w pełni automatycznie
  - **AI bez przywiązania do dostawcy** - Gemini i OpenAI za abstrakcją driverów, więc zmiana modelu to konfiguracja, nie refaktoryzacja
  - **Pipeline semantyczny** - wyszukiwanie wektorowe na Qdrant deduplikuje i grupuje newsy zanim trafią do generacji
  - **Autonomiczna agregacja** - auto-wykrywanie kanałów RSS oraz Google Custom Search plus scraping zamieniają temat w samozasilające się źródło treści
  - **Widoczne wywołania LLM** - każda generacja jest śledzona w Langfuse: tokeny, opóźnienie, koszt
  - **Dostęp oparty na rolach** - role admin/content manager/editor, każde zapytanie ograniczone do właściciela poza adminem

  ## Stos technologiczny

  - **Backend**: Laravel, agenci `laravel/ai`
  - **Frontend**: Inertia.js + Vue 3 (SPA Search & Creation, edytor TipTap)
  - **AI**: Multi-provider (Gemini/OpenAI) za abstrakcją driverów
  - **Research**: Google Custom Search + agregacja RSS, scraping stron
  - **Baza wektorowa**: Qdrant do wyszukiwania semantycznego
  - **Obserwowalność**: Langfuse do śledzenia LLM
  - **Kolejka**: Laravel Horizon
  - **Testy**: PHPUnit/Pest + Cypress E2E
