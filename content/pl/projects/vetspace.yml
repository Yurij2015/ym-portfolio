content: |
  VetSpace łączy publiczny katalog klinik weterynaryjnych z CRM w subskrypcji do rezerwacji wizyt, ich obsługi i prowadzenia kart pacjentów. Katalog i CRM działają jako osobne aplikacje Vue/Nuxt ze wspólnym API w Laravelu. Każda klinika ma własną bazę danych, subskrypcje obsługują Stripe i Cashier, a do analizy wizyt z pomocą AI służy osobny serwis Go.

  ## Kluczowe funkcje

  - **Katalog i CRM** — publiczne strony klinik i osobny panel do obsługi wizyt oraz kart pacjentów
  - **Osobne bazy danych** — dane każdej kliniki są przechowywane w oddzielnej bazie
  - **GraphQL i REST** - GraphQL dla złożonych zapytań katalogu, REST dla CRM — jedna baza kodu Laravel
  - **Subskrypcje Stripe** - subskrypcje Stripe przez Cashier: triale, zmiany planów, dunning
  - **Analiza wizyt** — przetwarzanie z pomocą AI odbywa się w osobnym serwisie Go

  ## Stos technologiczny

  - **Backend**: Laravel (API)
  - **Frontend**: Vue/Nuxt (osobne aplikacje)
  - **Architektura**: Multi-tenancy database-per-tenant
  - **Płatności**: Stripe przez Cashier
  - **API**: GraphQL + REST
  - **AI**: Mikroserwis Go do analizy wizyt
