content: |
  Strona marketingowa DigiSpace Studio — wyspecjalizowanego studia webowego dla klinik weterynaryjnych i marek pet. Zbudowana na WordPress z motywem Blocksy i blokami Stackable/Gutenberg, motywem potomnym do customizacji, blogiem i przechwytywaniem leadów przez formularze kontaktowe.

  ## Moja praca w projekcie

  Przygotowałem stronę na WordPressie z motywem Blocksy i blokami Gutenberg, skonfigurowałem blog oraz formularze kontaktowe. Zmiany wyglądu umieściłem w motywie potomnym, oddzielnie od plików głównego motywu.

  ## Kluczowe funkcje

  - **Dla klinik weterynaryjnych i marek pet** — opisy usług i treści dotyczą współpracy z tymi klientami
  - **Edycja blokowa** — bloki Stackable i Ultimate Gutenberg pozwalają budować nowe landing page bez kodu
  - **Motyw potomny** — zmiany wyglądu są zapisane w motywie potomnym Blocksy, oddzielnie od plików motywu głównego
  - **Blog + lead capture** — content marketing pod SEO z Contact Form 7 do zapytań
