content: |
  Strona marketingowa DigiSpace Studio — wyspecjalizowanego studia webowego dla klinik weterynaryjnych i marek pet. Zbudowana na WordPress z motywem Blocksy i blokami Stackable/Gutenberg, motywem potomnym do customizacji, blogiem i przechwytywaniem leadów przez formularze kontaktowe.

  ## Kluczowe funkcje

  - **Niszowe pozycjonowanie** — strona mówi bezpośrednio do klinik weterynaryjnych i marek pet, a nie ogólnej publiczności
  - **Edycja blokowa** — bloki Stackable i Ultimate Gutenberg pozwalają budować nowe landing page bez kodu
  - **Motyw potomny** — customizacje żyją w Blocksy child theme, więc aktualizacje motywu nie nadpisują designu
  - **Blog + lead capture** — content marketing pod SEO z Contact Form 7 do zapytań
