title: Moja pierwsza strona internetowa w 2010 roku
description: Historia pierwszej strony w HTML, witryny dla mojej działalności freelancerskiej na WordPressie i pierwszego kontaktu z PHP.
seo:
  title: Moja pierwsza strona w HTML z 2010 roku — Yurii Mokryi
  description: Pierwszą stronę stworzyłem w HTML w 2010 roku. Później zbudowałem stronę dla swojej działalności freelancerskiej na WordPressie i poznałem PHP.
content: |
  Moją pierwszą stronę internetową stworzyłem w 2010 roku. Tworzenie stron internetowych było wtedy dla mnie zupełnie nowe. Pracowałem jako pracownik naukowy w instytucji naukowej, a moje wykształcenie nie było związane z programowaniem.

  Wszystko w świecie kodu wydawało mi się nowe, fascynujące i trochę magiczne. Pierwszą stronę zbudowałem w HTML. O ile pamiętam, była to wersja HTML4, choć te oznaczenia nic mi wtedy nie mówiły; samo pojawienie się tekstu na ekranie było magią. To był po prostu projekt do nauki, ale szybko przekonałem się, jak wciągające może być tworzenie stron.

  Następnie stworzyłem stronę dla swojej działalności freelancerskiej, która przynosiła mi wtedy dodatkowy dochód. Zbudowałem ją na WordPressie, korzystając z poradników znalezionych w internecie. Tak po raz pierwszy zetknąłem się z PHP — przez WordPressa, bez bezpośredniej nauki języka.

  Świat programowania wciągał mnie coraz bardziej. Tak zaczęła się moja droga: od pierwszych stron w HTML i WordPressie po aplikacje internetowe, nad którymi pracuję dzisiaj.
