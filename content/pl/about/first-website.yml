title: Moja pierwsza strona internetowa w 2010 roku
description: Historia pierwszej strony w HTML, witryny dla mojej działalności freelancerskiej na WordPressie i pierwszego kontaktu z PHP.
seo:
  title: Moja pierwsza strona w HTML z 2010 roku — Yurii Mokryi
  description: Pierwszą stronę stworzyłem w HTML w 2010 roku. Później zbudowałem stronę dla swojej działalności freelancerskiej na WordPressie i poznałem PHP.
content: |
  Moją pierwszą stronę internetową stworzyłem w 2010 roku. Web development był wtedy dla mnie zupełnie nowym obszarem. Pracowałem jako naukowiec w instytucie weterynaryjnym, a moje wykształcenie nie było związane z programowaniem.

  Wszystko w świecie kodu wydawało mi się nowe, fascynujące i trochę magiczne. Pierwszą stronę zbudowałem w HTML. O ile pamiętam, była to wersja HTML4, choć te oznaczenia nic mi wtedy nie mówiły; samo pojawienie się tekstu na ekranie było magią. Był to projekt edukacyjny, ale szybko przekonałem się, jak wciągający może być ten proces.

  Następnie stworzyłem stronę wspierającą moją działalność freelancerską, która przynosiła wtedy dodatkowy dochód. Zbudowałem ją na WordPressie, korzystając z poradników znalezionych w internecie. W ten sposób po raz pierwszy zetknąłem się z PHP — nie ucząc się bezpośrednio języka, lecz korzystając z platformy opartej na nim.

  Świat programowania wciągał mnie coraz bardziej. Tak zaczęła się moja droga: od pierwszych stron w HTML i WordPressie po aplikacje internetowe, nad którymi pracuję dzisiaj.
