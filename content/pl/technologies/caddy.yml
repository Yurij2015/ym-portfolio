content: |
  Caddy to serwer WWW i odwrotne proxy, którego używam do kierowania żądań do aplikacji SaaS. W projektach takich jak VetSpace i DigiPulse łączy publiczne domeny z usługami działającymi w kontenerach Docker.

  ## Jak korzystam z Caddy

  - **Kierowanie ruchu** — przekazywanie żądań do aplikacji lub kontenera obsługującego daną domenę.
  - **HTTPS** — automatyczne uzyskiwanie i odnawianie certyfikatów dla skonfigurowanych domen.
  - **Czytelna konfiguracja** — reguły w pliku Caddyfile, które można przeglądać razem ze zmianami aplikacji.

  ## Certyfikaty a dostęp do danych placówki

  Automatyczne HTTPS wymaga poprawnego DNS, weryfikacji domeny i trwałego przechowywania certyfikatów. Błędy odnawiania nadal trzeba monitorować. Sama aplikacja musi rozpoznawać placówkę i sprawdzać uprawnienia: odwrotne proxy nie zapewnia izolacji danych klientów.

  ## Miejsce Caddy w infrastrukturze

  W moich środowiskach Docker Caddy ułatwia zarządzanie ruchem przychodzącym bez rozbudowanej konfiguracji proxy. Osobno trzeba dobrać limity czasu, przekazywane nagłówki i logi dostępu. Te szczegóły pomagają prześledzić na przykład nieudane żądanie rezerwacji od serwera proxy do API Laravel.
