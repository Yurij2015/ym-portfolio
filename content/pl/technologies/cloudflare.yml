content: |
  Cloudflare udostępnia DNS, sieć dostarczania treści i usługi ochrony stron. Korzystam z niego przy publicznych produktach SaaS, aby zarządzać domenami, buforować pliki statyczne i ograniczać automatyczne wysyłanie formularzy.

  ## Gdzie korzystam z Cloudflare

  VetCard, VetSpace i DigiPulse łączą publiczne strony z funkcjami aplikacji. Wymagają więc różnych reguł buforowania: obraz można udostępniać wielu odwiedzającym z tego samego cache, ale dane wizyt i kont muszą pozostać prywatne. DigiPulse korzysta również z Turnstile w publicznych formularzach.

  ## Buforowanie i ochrona formularzy

  - **Pliki statyczne** — obrazy, style i skrypty dostarczane z serwerów bliższych odwiedzającym.
  - **Dane prywatne** — odpowiedzi zawierające dane użytkownika wyłączone ze wspólnej pamięci podręcznej.
  - **Turnstile** — weryfikacja przesłanego tokena na serwerze; sam widżet w przeglądarce nie wystarcza.

  ## Za co nadal odpowiada aplikacja

  Cloudflare uzupełnia walidację danych, kontrolę uprawnień i ograniczanie liczby żądań. Reguły buforowania oraz zabezpieczenie połączenia z serwerem źródłowym pozostają częścią konfiguracji wdrożenia. Dostępne funkcje ochrony i limity zależą od wybranych usług i planu.
