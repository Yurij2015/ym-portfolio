content: |
  Tailwind CSS to framework CSS oparty na klasach narzędziowych. Używam go w interfejsach aplikacji i publicznych witrynach, między innymi VetCard, VetSpace, DigiSpace oraz w tym portfolio.

  ## Stylowanie w praktyce

  W VetCard wspólne komponenty określają strukturę stron, a indywidualne kolory pozwalają zachować identyfikację placówek. W portfolio Tailwind CSS v4 współpracuje z Nuxt UI, a parametry motywu są zapisane w CSS. DigiSpace również korzysta z Tailwind w interfejsie administracyjnym.

  ## Jak dbam o spójny wygląd

  - **Responsywny układ** — nawigacja, formularze i karty dopasowane do różnych ekranów.
  - **Wspólne parametry projektu** — kolory i odstępy używane w wielu komponentach.
  - **Ponowne użycie** — wydzielanie podobnych elementów w komponenty, gdy mają wspólne przeznaczenie.

  ## Czego nie gwarantują klasy narzędziowe

  Klasy blisko znaczników ułatwiają czytanie stylów, ale zmiana wspólnego komponentu czy motywu może wpłynąć na wiele stron. Rozmiar CSS zależy od wykrytych klas i własnych stylów. Wygląd na telefonie, obsługę fokusu klawiatury i kontrast kolorów trzeba sprawdzić osobno — framework nie robi tego automatycznie.
