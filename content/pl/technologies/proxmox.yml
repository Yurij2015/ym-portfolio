content: |
  Proxmox VE to platforma wirtualizacji, z której korzystam na wynajętym serwerze Hetzner. Pozwala zarządzać osobnymi środowiskami aplikacji SaaS i usług pomocniczych, w tym infrastrukturą DigiPulse.

  ## Jak organizuję środowiska

  Maszyny wirtualne mają oddzielne systemy operacyjne i konfigurowalny przydział zasobów. Wewnątrz nich Docker uruchamia usługi aplikacji. Dzięki temu łatwiej aktualizować i diagnozować poszczególne środowiska niż instalować wszystkie usługi bezpośrednio na fizycznym hoście.

  ## Migawki i kopie zapasowe

  Migawka może pomóc wycofać zmianę, zależnie od pamięci masowej i stanu aplikacji. Nie zastępuje niezależnej kopii zapasowej ani nie chroni przed utratą dysków hosta. Przy odtwarzaniu środowiska trzeba też uwzględnić spójność bazy danych i kolejność uruchamiania usług.

  ## Ograniczenia jednego hosta

  Maszyny wirtualne współdzielą zasoby fizyczne i zależą od dostępności serwera. Limity pomagają rozdzielać obciążenie, ale awaria dysku lub hosta może dotknąć wiele aplikacji. Dlatego oddzielenie środowisk, odtwarzanie z kopii i wysoka dostępność wymagają osobnych rozwiązań.
