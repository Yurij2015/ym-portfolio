content: |
  Nuxt to framework do aplikacji Vue z routingiem i renderowaniem na serwerze. Korzystam z niego w publicznym katalogu VetCard oraz w tym portfolio, gdzie treść strony powinna być dostępna dla odwiedzających i wyszukiwarek już w odpowiedzi serwera.

  ## Przykłady z moich projektów

  VetCard łączy strony placówek weterynaryjnych z interaktywną rezerwacją wizyt. Jedna aplikacja obsługuje wiele placówek, wersje językowe i indywidualne kolory. To portfolio korzysta z Nuxt Content do tłumaczonych plików YAML, a obrazy do udostępniania w mediach społecznościowych generuje podczas działania serwera.

  ## Co obejmuje praca nad SEO

  Renderowanie na serwerze dostarcza treść HTML bez czekania na wykonanie JavaScript w przeglądarce. Osobno konfiguruję metadane, adresy kanoniczne, wersje językowe i mapę witryny. Ułatwia to odnajdywanie oraz interpretowanie stron, ale nie gwarantuje indeksacji ani pozycji. Wyszukiwarki potrafią wykonywać JavaScript, lecz wymaga to dodatkowego etapu przetwarzania.

  ## Renderowanie i wdrożenie

  Nuxt obsługuje różne sposoby renderowania. Dobieram je do strony: sama interaktywność nie wymaga wyłączenia renderowania serwerowego. To portfolio korzysta z renderowania na serwerze i pamięci podręcznej ISR w Vercel dla wybranych tras; generowanie stron z wyprzedzeniem jest wyłączone w wersji produkcyjnej.
faq:
  - label: Dlaczego warto użyć Nuxt na publicznej stronie?
    content: Renderowanie na serwerze udostępnia treść w początkowej odpowiedzi HTML. Nuxt daje też narzędzia do routingu i metadanych. Strony JavaScript mogą być indeksowane, ale renderowanie serwerowe zmniejsza zależność od wykonywania kodu przez robota wyszukiwarki.
  - label: Z której wersji Nuxt korzystasz?
    content: To portfolio i VetCard korzystają z Nuxt 4. Portfolio używa też Nuxt Content, Nuxt Image, lokalizacji i generowania obrazów do mediów społecznościowych podczas działania serwera. Dobór modułów zależy od projektu.
