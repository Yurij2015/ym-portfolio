content: |
  GitHub Actions uruchamia zautomatyzowane procesy na podstawie konfiguracji w repozytorium GitHub. Używam go do sprawdzania zmian i wspierania wdrożeń, przechowując opis procesu razem z kodem aplikacji.

  ## Co sprawdza to portfolio

  Po wysłaniu zmian do repozytorium uruchamiają się ESLint, sprawdzanie typów TypeScript, testy jednostkowe, budowanie wersji produkcyjnej i testy przeglądarkowe Playwright. Każdy etap dotyczy innego obszaru: spójności kodu, błędów typów, zachowania aplikacji lub gotowej witryny.

  ## CI i wdrożenie to osobne procesy

  To portfolio jest wdrażane przez integrację Vercel z Git. Nieudany przebieg GitHub Actions sam w sobie nie blokuje wdrożenia ani scalenia zmian: wymagane kontrole i warunki publikacji trzeba skonfigurować osobno. Obecność testów w CI nie oznacza automatycznie, że od ich wyniku zależy wydanie.

  ## Moje podejście do automatyzacji

  W projektach Laravel, takich jak DigiSpace, automatyczne testy pomagają weryfikować zmiany przed publikacją. Szybkie kontrole umieszczam na początku, aby wcześniej otrzymać czytelną informację o błędzie. Automatyzacja wdrożeń wymaga również kontroli dostępu, przydatnych logów i planu przywrócenia działania.
