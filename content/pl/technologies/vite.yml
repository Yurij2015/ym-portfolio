content: |
  Vite to narzędzie do tworzenia i budowania frontendu. Korzystam z niego przez Nuxt w VetCard i tym portfolio, a także przez integrację z Laravel w DigiSpace.

  ## Podczas pracy nad kodem

  Serwer deweloperski obsługuje wymianę modułów bez pełnego przeładowania strony, czyli HMR. Wiele zmian można więc zobaczyć od razu w otwartej aplikacji. Rzeczywisty czas reakcji zależy jednak od projektu, wtyczek i komputera — nie jest bezwarunkową obietnicą natychmiastowej aktualizacji.

  ## Przygotowanie do wdrożenia

  Budowanie przygotowuje pliki frontendu, w tym nazwy z hashem i podział kodu na części przy odpowiedniej konfiguracji. Nuxt i Laravel dodają własną integrację wokół wyniku. Wewnętrzny bundler zależy od wersji Vite, dlatego przy zmianie konfiguracji sprawdzam zainstalowane wersje narzędzi.

  ## Co sprawdzam po zbudowaniu aplikacji

  Udane budowanie nie dowodzi, że każda strona działa. Adresy plików, zmienne środowiskowe, renderowanie na serwerze i zachowanie przeglądarki trzeba sprawdzić w docelowym środowisku. Vite jest częścią procesu wydania; testy przeglądarkowe i kontrola uruchomionej strony obejmują to, czego kompilacja nie weryfikuje.
