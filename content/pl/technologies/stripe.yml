content: |
  Stripe udostępnia usługi płatności i subskrypcji. Integruję go z VetSpace przez Laravel Cashier, a także pracuję nad płatnościami kartą w komercyjnej platformie sprzedaży biletów.

  ## Subskrypcje i składanie zamówień

  Praca obejmuje okresy próbne, zmiany planów, potwierdzanie płatności i obsługę nieudanych obciążeń. Cashier zapewnia integrację z Laravel, a szczegóły rozliczeń zależą od ustawień Stripe i reguł aplikacji. Interfejs powinien jasno pokazywać oczekiwanie, powodzenie i błąd płatności.

  ## Obsługa webhooków

  Powrót użytkownika ze strony płatności nie potwierdza zapłaty. Obsługa webhooków musi sprawdzać podpis, uwzględniać duplikaty i zmienioną kolejność zdarzeń, a w razie potrzeby uzgadniać stan przez Stripe API. Idempotentna obsługa zapobiega ponownemu wykonaniu tej samej operacji biznesowej.

  ## Utrzymanie logiki płatności

  Mam również doświadczenie z integracjami Dalenys i Revolut. Tam, gdzie to praktyczne, oddzielam specyfikę operatora od procesów zamówień i subskrypcji. Operatorzy mają różne możliwości, więc dodanie kolejnego nadal wymaga testów stanów i błędów. Ważne, aby dało się prześledzić przebieg płatności, gdy klient zgłosi problem.
faq:
  - label: Czy możesz dodać subskrypcje Stripe do istniejącej aplikacji Laravel?
    content: Tak. Praca obejmuje integrację Cashier, produkty i ceny Stripe, obsługę webhooków oraz testy cyklu subskrypcji. Okresy próbne i działania po nieudanej płatności są dopasowywane do produktu.
  - label: Czy pracujesz z innymi operatorami płatności?
    content: Mam również doświadczenie z Dalenys i Revolut. Każda integracja wymaga osobnych kontroli stanów płatności, uwierzytelniania i obsługi błędów.
