content: |
  Go to kompilowany język programowania, którego używam do usług działających obok aplikacji Laravel. W moich projektach wykonują one konkretne zadania, dla których przydatny jest osobny proces i niezależny cykl wdrożeń.

  ## Go w DigiPulse i VetSpace

  DigiPulse korzysta z osobnej usługi Go do sprawdzania dostępności stron. Laravel obsługuje aplikację i panel administracyjny, a usługa monitoringu wysyła żądania HTTP i przekazuje wyniki. W VetSpace oddzielna usługa Go uczestniczy w analizie wizyt z pomocą AI.

  ## Organizacja pracy w tle

  Gorutyny ułatwiają współbieżne wykonywanie zadań, ale ich liczbę nadal trzeba kontrolować. Limity czasu, anulowanie żądań i ograniczone kolejki pomagają obsługiwać wolne lub niedostępne strony. Liczy się to, czy usługa niezawodnie kończy sprawdzenia przy dostępnych zasobach. Ogólne stwierdzenie, że Go jest szybsze od PHP, nie zastąpi pomiarów.

  ## Wdrożenie i wybór języka

  Aplikacje Go można wdrażać jako skompilowane pliki wykonywalne. To, czy potrzebują bibliotek systemowych, zależy od ustawień budowania i zależności. Zwykłe procesy aplikacji pozostawiam w Laravel, a Go wybieram wtedy, gdy wydzielenie usługi upraszcza jej działanie i utrzymanie.
