content: |
  Laravel to framework PHP, którego używam do produktów SaaS, API i narzędzi administracyjnych. Moje projekty obejmują VetSpace, DigiPulse, NetPostPanel i stronę DigiSpace. Każdy ma własne reguły biznesowe i potrzeby integracyjne.

  ## Jak korzystam z Laravel

  - **VetSpace** — wspólne API katalogu placówek i CRM, dostęp z uwzględnieniem placówki oraz subskrypcje Stripe przez Cashier.
  - **DigiPulse** — aplikacja monitoringu i panel Filament obok osobnej usługi sprawdzającej dostępność, napisanej w Go.
  - **NetPostPanel** — generowanie treści w tle z wykorzystaniem kolejek i Horizon.
  - **DigiSpace** — wielojęzyczna strona z własnym CMS i panelem Filament.

  ## Framework i jego ekosystem

  Laravel zapewnia routing, walidację, dostęp do bazy danych i API kolejek. Filament, Cashier i Horizon to dodatkowe narzędzia, które dobieram i konfiguruję dla projektu. Płatności, uprawnienia i izolacja danych klientów nadal wymagają osobnego projektu oraz testów.

  ## Utrzymanie po wdrożeniu

  Staram się oddzielać logikę biznesową od obsługi żądań HTTP i ekranów administracyjnych. Ułatwia to ponowne wykorzystanie procesu w API lub zadaniu w tle. Optymalizację zaczynam od pomiarów: Octane może pomóc przy odpowiednim obciążeniu, ale nie zastępuje poprawy zapytań ani kontroli stanu aplikacji.
faq:
  - label: Tworzysz nowe aplikacje Laravel czy utrzymujesz istniejące?
    content: Jedno i drugie. Zajmuję się nowymi aplikacjami, audytami, refaktoryzacją i rozwojem działających produktów. Podejście zależy od stanu kodu oraz wymagań dotyczących wydań.
  - label: Z jakich narzędzi Laravel korzystasz?
    content: Z Filament do administracji, Cashier do subskrypcji Stripe i Horizon do kolejek Redis. Pracuję też z Octane i FrankenPHP, gdy aplikacja korzysta na długotrwałych procesach.
  - label: Czy możesz zająć się hostingiem i wdrożeniem Laravel?
    content: Tak. Pracuję z Docker, Caddy, Proxmox i CI/CD, także na wynajętym serwerze dedykowanym Hetzner. Konfiguracja zależy od wymaganej dostępności i sposobu utrzymania projektu.
