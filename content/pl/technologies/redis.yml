content: |
  Redis to magazyn danych w pamięci, którego używam do buforowania i przetwarzania w tle. W projektach Laravel pomaga wykonywać zadania, na które użytkownik nie powinien czekać w ramach żądania HTTP.

  ## Przykłady z moich projektów

  NetPostPanel korzysta z Laravel Horizon do kolejek generowania treści. W DigiPulse Redis uczestniczy w architekturze monitoringu opartej na zdarzeniach. Takie zadania wymagają innego podejścia do trwałości niż zwykła pamięć podręczna strony: utrata oczekującej pracy może wpłynąć na produkt, nawet jeśli cache da się odtworzyć.

  ## Buforowanie i koordynacja

  Redis może przechowywać wyniki obliczeń, liczniki żądań i krótkotrwałe blokady. Klucze i czas wygaśnięcia muszą pasować do danych. Blokady pomagają koordynować procesy, ale ponawianie zadań nadal trzeba zaprojektować tak, aby nie powielało operacji biznesowych.

  ## Trwałość danych kolejki

  Redis oferuje migawki RDB i dziennik AOF z różnymi możliwościami odtwarzania. Restart nie musi oznaczać utraty danych, a traktowanie wszystkich kluczy jako jednorazowych jest niebezpieczne dla kolejek. Trwałość, usuwanie kluczy przy braku pamięci i ponawianie zadań trzeba skonfigurować razem. Natomiast Redis Pub/Sub nie przechowuje wiadomości dla odłączonych odbiorców.
