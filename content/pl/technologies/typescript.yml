content: |
  TypeScript dodaje statyczne sprawdzanie typów do JavaScript. Używam go w aplikacjach Vue i Nuxt, w tym VetCard i tym portfolio, aby interfejsy komponentów oraz modele danych były łatwiejsze do zrozumienia i zmiany.

  ## Co opisuję typami

  - **Komponenty** — parametry wejściowe, zdarzenia i wspólny stan.
  - **Modele API** — oczekiwaną strukturę danych placówek i rezerwacji.
  - **Wspólna logika** — argumenty i wyniki funkcji composable.

  W tym repozytorium działa też sprawdzanie typów w CI oraz schematy przetłumaczonej treści. Te kontrole uzupełniają się, ale odpowiadają za różne zadania.

  ## Gdzie kończy się sprawdzanie statyczne

  Typy TypeScript są usuwane z wygenerowanego JavaScript. Adnotacja typu nie weryfikuje rzeczywistej odpowiedzi API. Dane zewnętrzne wymagają walidacji podczas działania aplikacji, a nieuzgodniona zmiana backendu nie pojawi się automatycznie jako błąd kompilatora.

  ## Łatwiejsze utrzymanie

  Po zmianie zadeklarowanego modelu kontrola typów może wskazać niezgodne miejsca w kodzie. Pomaga to konsekwentnie zaktualizować formularze i szablony. Typowanie uzupełnia testy i walidację danych, zamiast usuwać potrzebę ich stosowania.
