content: |
  PHP to mój główny język programowania po stronie serwera. Mam ponad osiem lat doświadczenia komercyjnego z Laravel, Symfony i WordPress, gdy odpowiada on potrzebom projektu. Obecnie pracuję z PHP 8.x; wcześniejsze doświadczenie obejmuje również starsze wersje języka.

  ## Gdzie korzystam z PHP

  Laravel obsługuje projekty takie jak VetSpace, DigiPulse i NetPostPanel. Moja praca komercyjna z Symfony obejmuje platformę sprzedaży biletów na Formula 1, MotoGP, EICMA i EuroLeague. Zajmuję się składaniem zamówień, kontami użytkowników, narzędziami administracyjnymi i integracjami.

  ## Na czym się skupiam

  - **Logika biznesowa** — zrozumiałe procesy rezerwacji, subskrypcji i zamówień.
  - **API i płatności** — walidacja, uprawnienia oraz niezawodna obsługa odpowiedzi zewnętrznych usług.
  - **Utrzymanie** — automatyczne testy i analiza statyczna wspierające rozwój istniejącego kodu.

  ## Wybór środowiska wykonawczego

  PHP-FPM sprawdza się przy typowej obsłudze żądań. Długotrwałe procesy, w tym aplikacje uruchamiane przez Octane i FrankenPHP, wymagają innego podejścia do stanu i pamięci. Dobieram środowisko do aplikacji i sprawdzam wyniki przy reprezentatywnym obciążeniu. Sam język czy framework nie gwarantuje wydajności.
faq:
  - label: Z którymi wersjami PHP pracujesz?
    content: Obecnie pracuję z PHP 8.x. Przy aktualizacji starszej aplikacji sprawdzam wymagania frameworka i zależności oraz testuję zachowanie, na które wpływa zmiana wersji.
  - label: Jak wybierasz między Laravel a Symfony?
    content: "Uwzględniam istniejący kod, doświadczenie zespołu, integracje i wymagania utrzymaniowe. Oba nadają się do wieloletniego rozwoju: Laravel wykorzystuję we własnych produktach SaaS, a Symfony w komercyjnej sprzedaży biletów."
