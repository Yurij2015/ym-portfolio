content: |
  DigitalOcean to dostawca infrastruktury chmurowej. Korzystałem z maszyn wirtualnych Droplet przy pierwszych projektach DigiSpace, samodzielnie konfigurując środowisko Linux i wdrażając aplikacje.

  ## Praca z serwerami Droplet

  Oddzielne maszyny pozwalały niezależnie konfigurować i aktualizować usługi. Praca obejmowała serwery WWW, bazy danych, reguły zapory, aktualizacje systemu i kopie zapasowe. Droplet wymaga samodzielnej administracji: łatwo go utworzyć, ale utrzymanie oprogramowania pozostaje obowiązkiem użytkownika.

  ## Przejście na serwer dedykowany

  Gdy infrastruktura się rozrosła, przeniosłem usługi na wynajęty serwer Hetzner z Proxmox VE. Docker ułatwił przenoszenie środowisk aplikacji. Dane, zmiany DNS i plan odtworzenia usług nadal wymagały osobnego przygotowania.

  ## Jak porównuję warianty hostingu

  Biorę pod uwagę zużycie zasobów, czas administracji, miejsce na kopie zapasowe i wymaganą dostępność. Maszyny w chmurze są wygodne, gdy środowiska trzeba niezależnie tworzyć lub skalować. Serwer dedykowany może pasować do stałego obciążenia, ale skupia usługi na jednej fizycznej maszynie. Opłacalność zależy od konkretnego projektu.
