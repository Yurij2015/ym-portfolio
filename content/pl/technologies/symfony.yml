content: |
  Symfony to framework PHP, z którego korzystam w pracy komercyjnej nad platformą sprzedaży biletów na Formula 1, MotoGP, EICMA i EuroLeague. Pracuję zarówno nad procesem zakupu, jak i wewnętrznymi narzędziami administracyjnymi.

  ## Czym się zajmuję

  - **Składanie zamówień** — koszyk, wybór miejsc, potwierdzenie zakupu i dostarczanie biletów.
  - **Płatności** — integracje z operatorami takimi jak Stripe i Dalenys.
  - **Konta i administracja** — profile, historia zamówień oraz zarządzanie wydarzeniami i sprzedażą.
  - **Usługi zewnętrzne** — mapy miejsc i API wykorzystywane podczas zakupu.

  ## Czego wymaga sprzedaż biletów

  Po rozpoczęciu sprzedaży platforma musi poradzić sobie ze zmianą popytu, zachowując spójność zamówień i dostępnych miejsc. Szczególne znaczenie mają więc transakcje, stany płatności i obsługa błędów. Szybka strona ma wartość wtedy, gdy klient może poprawnie dokończyć zakup.

  ## Symfony i Laravel w mojej pracy

  Pracuję z oboma frameworkami. Wybór zależy od istniejącej architektury, zasad zespołu i integracji, a nie od sztywnego podziału na duże i małe produkty. W rozwijanej aplikacji Symfony skupiam się na zmianach, które można przejrzeć, przetestować i utrzymywać w kolejnych wydaniach.
faq:
  - label: Przy jakich projektach Symfony pracowałeś?
    content: "Moje doświadczenie komercyjne obejmuje platformę sprzedaży biletów na Formula 1, MotoGP, EICMA i EuroLeague: składanie zamówień, integracje płatności oraz narzędzia administracyjne."
  - label: Czy możesz dołączyć do istniejącego projektu Symfony?
    content: Tak. Najpierw poznaję architekturę i proces wydań, a następnie określam zmiany i testy potrzebne do bezpiecznego rozwoju aplikacji.
