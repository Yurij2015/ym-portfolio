content: |
  Vue.js to framework JavaScript do tworzenia interfejsów. Używam go w panelu placówki VetSpace, publicznej witrynie VetCard i interfejsach administracyjnych, między innymi w DigiSpace.

  ## Różne interfejsy, wspólne narzędzia

  - **Panele aplikacji** — formularze, listy i procesy dla zalogowanych użytkowników.
  - **Publiczne strony** — komponenty Vue w stronach Nuxt renderowanych na serwerze.
  - **Integracja z Laravel** — Inertia łączy trasy serwerowe ze stronami Vue bez potrzeby osobnego publicznego API dla tych ekranów.

  ## Przykład strony placówki

  VetCard potrzebuje zarówno czytelnych informacji o placówce, jak i interaktywnej rezerwacji wizyt. Nuxt odpowiada za renderowanie strony na serwerze, a Vue za interakcje użytkownika. Ta sama witryna pomaga więc poznać placówkę i wybrać termin wizyty.

  ## Utrzymanie komponentów

  Composition API pomaga grupować powiązaną logikę, a TypeScript jasno określa parametry i wyniki. Oddzielam pobieranie danych, wspólną logikę i prezentację tam, gdzie poprawia to czytelność. Wybór frameworka nadal zależy od istniejącego projektu i zespołu: różne interfejsy mogą wymagać różnej architektury.
faq:
  - label: Używasz Vue z Nuxt czy Laravel?
    content: Korzystam z obu rozwiązań. Nuxt stosuję na publicznych stronach takich jak VetCard, a Vue z Laravel lub Inertia w interfejsach aplikacji. Wybór zależy od routingu, dostępu do danych i renderowania.
  - label: Jak podszedłbyś do migracji z Vue 2 do Vue 3?
    content: Najpierw sprawdziłbym zależności i niezgodne API, a potem zaplanował zmiany według komponentów lub tras, jeśli pozwala na to architektura. Testy i stopniowe wydania pomagają kontrolować przejście.
