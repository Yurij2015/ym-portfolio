content: |
  Terraform zarządza tymi częściami mojej infrastruktury, które kiedyś mieszkały w czyjejś pamięci — kontenery, sieci i konfiguracja wdrożeń zadeklarowane w kodzie, aplikowane z workspace'a per środowisko.

  ## Jak używam Terraforma

  - **Kontenery na VM** — infrastruktura DigiPulse provisionuje serwisy Docker na VM Proxmox przez providera Docker po SSH: bez uzależnienia od chmury, po prostu deklaratywne kontenery na własnym sprzęcie.
  - **Separacja środowisk** — workspace'y i per-env tfvars izolują testing i production; ten sam plan kształtuje oba, różnią się tylko zmienne.
  - **Dyscyplina stanu** — plany przeglądane przed apply, sekrety poza plikami var i poza gitem.

  ## Doświadczenie produkcyjne

  Konkretna wygrana: dodanie serwisu do DigiPulse stało się `terraform apply` zamiast „wejdź po SSH i miej nadzieję". Środowiska przestały dryfować, bo kod jest środowiskiem. Dla infrastruktury jednoosobowej to różnica między „pamiętam, jak to połączone" a „repo mówi, jak to połączone".

  ## Jak daleko sięga IaC w solowym setupie

  Terraform pokrywa provisioning i układ serwisów; deploye aplikacji idą przez CI/CD. Granica jest celowa — zmiany infrastruktury są rzadkie i przeglądane, deploye częste i zautomatyzowane. Mieszanie ich psuje jedno i drugie.
