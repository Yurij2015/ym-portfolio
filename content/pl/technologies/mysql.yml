content: |
  MySQL to relacyjna baza danych, której używam w aplikacjach Laravel i witrynach WordPress. W DigiSpace przechowuje treści strony firmowej oraz CMS, a w DigiSpace Studio jest częścią środowiska WordPress.

  ## Na czym polega praca z bazą

  - **Model danych** — relacje między stronami, menu i innymi rekordami, klucze oraz ograniczenia integralności.
  - **Analiza zapytań** — sprawdzanie wolnych zapytań i planów wykonania przed zmianą indeksów lub zwiększeniem zasobów.
  - **Migracje** — planowanie zmian struktury z uwzględnieniem istniejących danych i kolejności wdrożenia.

  ## MySQL w WordPress

  MySQL jest częstym wyborem dla WordPress, ale nie jedynym obsługiwanym silnikiem: WordPress działa również z MariaDB. Decyzja zależy od hostingu, istniejących danych i doświadczenia w utrzymaniu. Zmiana silnika wymaga sprawdzenia zgodności.

  ## MySQL czy PostgreSQL?

  Pracuję z obiema bazami. Działająca aplikacja MySQL może nie potrzebować migracji, podczas gdy innemu projektowi przydadzą się typy danych lub indeksy PostgreSQL. W obu przypadkach jakość zapytań, kopie zapasowe i sprawdzone odtwarzanie są ważniejsze niż ogólna deklaracja, że jedna baza zawsze działa szybciej.
