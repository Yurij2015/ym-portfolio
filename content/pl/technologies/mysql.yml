content: |
  MySQL był moją pierwszą produkcyjną bazą i wciąż obsługuje sporą część tego, co utrzymuję — aplikacje Laravel, CMS DigiSpace i każde wdrożenie WordPress, gdzie jest natywnym silnikiem.

  ## Jak używam MySQL

  - **Laravel + MySQL** — platforma firmy DigiSpace: strony, widżety, menu i treści bloga serwowane ze schematu MySQL 8 za autorskim CMS-em.
  - **Strony WordPress** — DigiSpace Studio i wdrożenia klienckie: MySQL jest tam nie do negocjacji, więc praca to tuning i higiena schematu, nie wybór silnika.
  - **Dziedzictwo e-commerce i ticketingowe** — wcześniejsza praca komercyjna nad witrynami i flow rezerwacji, gdzie MySQL był standardem platformy.

  ## Doświadczenie produkcyjne

  Lata MySQL w produkcji nauczyły nieefektownego: indeksuj pod zapytanie, które faktycznie wykonujesz, patrz w slow query log zanim dokupisz sprzęt i trzymaj migracje odwracalne. CMS DigiSpace przeżył na MySQL kilka redesignów — schemat przeżył dwa stacki frontendowe, i dokładnie tak powinna zachowywać się baza danych.

  ## MySQL vs PostgreSQL w moim stacku

  MySQL gdy platforma dyktuje — WordPress, hosting współdzielony, ustalone schematy Laravel. PostgreSQL gdy kontroluję architekturę, a model danych zyskuje na JSONB i ściślejszej semantyce. Obie w produkcji od lat — te kompromisy to dla mnie praktyka, nie teoria.
