content: |
  Docker pozwala umieścić aplikację i jej zależności w obrazie kontenera. Używam go do usług Laravel i Node.js w DigiPulse, VetSpace oraz NetPostPanel, od lokalnej pracy po wdrożenia na maszynach wirtualnych.

  ## Jak organizuję kontenery

  - **Docker Compose** — wspólny opis aplikacji, procesów obsługujących zadania w tle i usług pomocniczych.
  - **Budowanie wieloetapowe** — oddzielenie narzędzi budowania od końcowego obrazu uruchomieniowego.
  - **Trwałe dane** — pliki bazy danych i przesłane materiały przechowywane poza wymienialnymi kontenerami.

  ## Co daje przenośność

  Kontenery pomogły mi zmienić dostawcę hostingu bez odtwarzania środowiska aplikacji od podstaw. Na działanie systemu nadal wpływają konfiguracja, architektura procesora, sieć i dane. Sam Docker nie gwarantuje więc, że błąd z produkcji uda się odtworzyć lokalnie.

  ## Kontrola stanu i odzyskiwanie działania

  Health check zgłasza stan kontenera. Polityki restartu Dockera reagują na zakończenie procesu; sam status unhealthy nie powoduje ponownego uruchomienia. Trzeba to uwzględnić przy wdrażaniu i usuwaniu awarii, szczególnie w przypadku baz danych i procesów, które nie mogą zgubić rozpoczętych zadań.
faq:
  - label: Kiedy wybierasz Docker Compose zamiast Kubernetes?
    content: Używam Compose do usług zarządzanych na pojedynczych maszynach wirtualnych. Kubernetes rozważam, gdy projekt potrzebuje rozdzielania zadań między węzły i ma zasoby na utrzymanie klastra.
