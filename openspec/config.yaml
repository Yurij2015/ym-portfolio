schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Personal portfolio of Yurii Mokryi (Senior Full-Stack PHP Developer).

  Tech stack: Nuxt 4, Vue 3, TypeScript, Nuxt UI v4, Tailwind CSS v4,
  @nuxt/content v3 (SQLite via better-sqlite3), @nuxtjs/i18n, motion-v,
  nuxt-og-image. Package manager: pnpm. Deploy: Vercel (Nitro `vercel`
  preset, prerendering disabled due to a Nitro 2.13.4 bug — every page
  is SSR'd per request).

  Locales: uk (default, no URL prefix), en, pl — `prefix_except_default`.
  Content lives in `content/<locale>/*.yml`, validated by Zod schemas in
  `content.schemas.ts`; UI strings in `i18n/locales/<locale>.json`.
  All three locales must stay in parity (same schema, same keys).

  Conventions:
  - Content-driven: texts, projects, experience live in YAML, not code.
  - SEO matters: canonical, hreflang + x-default, sitemap.xml, runtime
    OG images (1200x630) — keep them working on every change.
  - Comments explain *why* (workarounds, non-obvious decisions), not what.
  - ESLint stylistic: commaDangle 'never', braceStyle '1tbs'.

  Environment constraints (see AGENTS.md):
  - Dev server runs at http://localhost:3002 — never start it, use it.
  - Never run `pnpm test` (vitest) while the dev server is up — both
    write .data/content/contents.sqlite.
  - Never commit or push without explicit user permission.
  - Production: https://yuriimokryi.vercel.app/

# Per-artifact rules
rules:
  proposal:
    - Keep proposals short — this is a solo portfolio project
    - Include a "Non-goals" section when scope could creep
  tasks:
    - Order tasks so verification (lint/typecheck/e2e) comes last
    - Flag any task that touches all three locales
